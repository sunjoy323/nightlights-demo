<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07061a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307061a' width='32' height='32' rx='6'/%3E%3Ccircle cx='20' cy='12' r='7' fill='%23ffd56a'/%3E%3Ccircle cx='16' cy='10' r='6' fill='%2307061a'/%3E%3Crect x='8' y='20' width='3' height='3' fill='%23ffd56a'/%3E%3Crect x='13' y='20' width='3' height='3' fill='%237ee7ff'/%3E%3Crect x='18' y='20' width='3' height='3' fill='%23ff8ab8'/%3E%3C/svg%3E" />
  <title>夜灯将眠</title>
  <style>
:root {
  --bg: #07061a;
  --panel: #12101f;
  --line: #2c2750;
  --text: #f3efe4;
  --muted: #8a84a8;
  --ink: #140d08;
  --accent: #ffd56a;
  --danger: #ff6b8a;
  --ok: #8dffc1;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus, .box:focus { outline: none; }
#app {
  width: min(430px, 100%);
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #07061a;
  box-shadow: 0 0 0 1px #1a1630;
}
#menu, #game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#menu[hidden], #game[hidden], [hidden] { display: none !important; }

/* menu */
#menu { overflow: auto; padding: 28px 20px 32px; }
.brand { text-align: center; margin-bottom: 8px; }
.brand h1 {
  font-size: 32px; letter-spacing: 0.18em; font-weight: 700; margin: 0 0 8px;
  text-shadow: 0 0 24px rgba(255, 213, 106, .28);
}
.brand p { margin: 0; color: var(--muted); font-size: 14px; letter-spacing: 0.06em; }
#levels { display: flex; flex-direction: column; gap: 12px; margin-top: 22px; }
.card {
  appearance: none; border: 1px solid #2a2650; background: #12101f;
  border-radius: 16px; padding: 0; overflow: hidden; cursor: pointer;
  text-align: left; display: block; width: 100%;
}
.card canvas { display: block; width: 100%; height: auto; background: #0a0a22; }
.card .meta { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 12px; }
.card .no { color: var(--muted); font-size: 12px; }
.card strong { font-size: 16px; font-weight: 650; }
.card .star { margin-left: auto; color: var(--accent); }
.card.start { border-color: #ffd56a; box-shadow: 0 0 0 1px rgba(255,213,106,.35); }
.card.done { border-color: #3a5a48; }

/* game hud */
.hud {
  display: flex; align-items: center; gap: 8px;
  padding: 10px 12px 6px;
  flex: 0 0 auto;
}
.hud .icon, .hud .tool {
  appearance: none; background: #1a1730; border: 1px solid var(--line);
  border-radius: 10px; width: 36px; height: 36px; cursor: pointer;
  display: grid; place-items: center; font-size: 16px;
}
.hud .titles { flex: 1; min-width: 0; }
#lvNo { display: block; font-size: 11px; color: var(--muted); letter-spacing: 0.04em; }
#lvName { display: block; font-size: 17px; font-weight: 700; }
.hud .stat {
  background: #1a1730; border: 1px solid var(--line); border-radius: 10px;
  padding: 4px 8px; text-align: right;
}
.hud .stat em { display: block; font-style: normal; font-size: 10px; color: var(--muted); }
#leftV { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 16px; }

#stage { flex: 1; min-height: 0; position: relative; }
#board { display: block; width: 100%; height: 100%; }
#slots {
  position: absolute; left: 10px; right: 10px; bottom: 8px;
  display: grid; gap: 8px;
  pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%) translateY(-8px);
  background: #2a1630; color: #ffe8ee; border: 1px solid #6a3048;
  padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0;
  pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.soft { background: #1a2030; border-color: #3a5070; color: #e8f0ff; }

#slots.pad { min-height: 0; }
.slot {
  height: 52px; border: 1.5px dashed #3a3560; border-radius: 10px;
  background: rgba(12, 10, 24, .7);
  display: grid; place-items: center;
}
.slot.full { border-style: solid; border-color: #4a4570; }
.slot.wait { border-color: #6a6080; }
.slot .box { width: 100%; height: 100%; border-radius: 9px; font-size: 20px; font-weight: 700; position: relative; }
.zz {
  position: absolute; right: 4px; top: 2px; font-size: 10px; font-style: normal;
  color: #3a2208; opacity: .7; font-weight: 700;
}

#tray {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 6px 14px 8px;
}
.tcol { display: flex; flex-direction: column; gap: 7px; position: relative; }
.box {
  appearance: none; height: 46px; border-radius: 8px; border: 2px solid #140d08;
  cursor: pointer; font-weight: 800; font-size: 18px; letter-spacing: 0.5px;
  box-shadow: 0 2px 0 #140d08;
}
.box.back { opacity: .92; cursor: default; }
.box.point {
  outline: 3px solid #fff4c0; outline-offset: 3px;
  animation: pulse 1s ease-in-out infinite;
  position: relative; z-index: 3;
}
.box.point::after {
  content: ""; position: absolute; right: -18px; top: 50%; width: 28px; height: 28px;
  transform: translateY(-20%);
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23fff4c0' stroke='%23140d08' stroke-width='2' d='M8 2l4 14 3-2 6 12 4-2-6-12 5-1z'/></svg>") center/contain no-repeat;
  pointer-events: none;
}
@keyframes pulse { 50% { outline-color: rgba(255,244,192,.35); } }
.more { text-align: center; font-size: 11px; color: var(--muted); margin-top: -2px; }

#coach {
  position: absolute; left: 16px; right: 16px; bottom: 72px;
  z-index: 5; pointer-events: auto;
}
#coach .bubble {
  background: #fff8e8; color: #2a1a10; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#coach .bubble b { color: #9a3a10; }
#coach .next { margin-top: 4px; font-size: 12px; color: #8a6a50; }

/* overlays */
.modal {
  position: absolute; inset: 0; background: rgba(6, 5, 16, .62);
  display: grid; place-items: center; z-index: 20; padding: 20px;
}
.panel {
  width: min(340px, 100%); background: #161326; border: 1px solid #3a3560;
  border-radius: 18px; padding: 22px 18px 16px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.panel .en { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); }
.panel h2 { margin: 6px 0 8px; font-size: 28px; font-weight: 750; }
#winBox h2 { font-size: 40px; letter-spacing: 0.28em; text-shadow: 0 0 28px rgba(255,213,106,.45); }
.panel p { margin: 0 0 16px; color: var(--muted); font-size: 13px; line-height: 1.55; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 10px 14px;
  background: #2a2650; cursor: pointer; font-weight: 650; font-size: 14px;
}
.btn.primary { background: var(--accent); color: #2a1a08; min-width: 100%; }
.btn.ghost { background: transparent; border: 1px solid #3a3560; }
.btn.danger { background: #3a2030; }
.note { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.4; }

#adBox .panel { background: #0c0b18; }
#adSec { font-size: 48px; font-weight: 800; color: var(--accent); margin: 8px 0; }

@media (max-height: 700px) {
  .box { height: 40px; font-size: 16px; }
  .slot { height: 46px; }
  .brand h1 { font-size: 26px; }
}

  </style>
</head>
<body>
  <div id="app">
    <section id="menu">
      <div class="brand">
        <h1>夜灯将眠</h1>
        <p>把通明的城市，一盏盏关掉</p>
      </div>
      <div id="levels"></div>
    </section>

    <section id="game" hidden>
      <div class="hud">
        <button class="icon" id="backBtn" aria-label="返回">←</button>
        <div class="titles"><span id="lvNo"></span><span id="lvName"></span></div>
        <div class="stat"><em>剩余</em><span id="leftV">0</span></div>
        <button class="tool" id="speedBtn" type="button">▶ 1×</button>
        <button class="tool" id="soundBtn" type="button">♪</button>
      </div>
      <div id="stage">
        <canvas id="board"></canvas>
        <div id="toast"></div>
        <div id="slots"></div>
        <div id="coach" hidden></div>
      </div>
      <div id="tray"></div>

      <div id="loseBox" class="modal" hidden>
        <div class="panel">
          <div class="en">GRID OVERLOAD</div>
          <h2 style="color:#ff6b8a">电网过载了</h2>
          <p>电闸里的颜色都还没露出来，小电工无处下手。</p>
          <button class="btn primary" id="loseRw" type="button">◀ 时光倒流</button>
          <div class="row" style="margin-top:8px">
            <button class="btn ghost" id="loseMenu" type="button">菜单</button>
            <button class="btn" id="loseRetry" type="button">重新开始</button>
            <button class="btn" id="loseAd" type="button">看广告加一个槽</button>
          </div>
          <div class="note">时光倒流会退回最近几步，每关一次。广告是演示用的倒计时，不会真的播放。</div>
        </div>
      </div>

      <div id="winBox" class="modal" hidden>
        <div class="panel">
          <div class="en">CITY ASLEEP</div>
          <h2 id="winTitle">晚安</h2>
          <p id="winSub">城市已入睡</p>
          <div class="row">
            <button class="btn ghost" id="winMenu" type="button">菜单</button>
            <button class="btn" id="winRetry" type="button">再关一次</button>
            <button class="btn primary" id="winNext" type="button" style="min-width:0;flex:1">下一关</button>
          </div>
        </div>
      </div>

      <div id="adBox" class="modal" hidden>
        <div class="panel">
          <div class="en">SIMULATED AD</div>
          <h2>模拟广告</h2>
          <p>这是演示用的倒计时，不是真广告。</p>
          <div id="adSec">5</div>
          <button class="btn ghost" id="adSkip" type="button">跳过并获得槽位</button>
        </div>
      </div>
    </section>
  </div>
  <script id="core">
// Shared puzzle core for 夜灯将眠 — used by verify.mjs and inlined into index.html
(function (root) {
  const COLORS = [
    { id: "amber", fill: "#ffd56a", glow: "#ffbe3a", ink: "#3a2208", name: "暖黄" },
    { id: "pink", fill: "#ff8ab8", glow: "#ff5e9a", ink: "#4a1028", name: "粉" },
    { id: "cyan", fill: "#7ee7ff", glow: "#3ad4ff", ink: "#073044", name: "青" },
    { id: "orange", fill: "#ff9a4a", glow: "#ff7a1a", ink: "#3a1a00", name: "橙" },
    { id: "mint", fill: "#8dffc1", glow: "#3dff9a", ink: "#06301c", name: "薄荷" },
    { id: "lavender", fill: "#c9a6ff", glow: "#a87cff", ink: "#2a1050", name: "紫" },
  ];

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function emptyGrid(W, H) {
    return Array.from({ length: H }, () => Array.from({ length: W }, () => null));
  }

  function cloneGrid(g) {
    return g.map((row) => row.map((c) => (c ? { ...c } : null)));
  }

  function cloneCols(cols) {
    return cols.map((col) => col.map((t) => ({ ...t })));
  }

  function cloneSlots(slots) {
    return slots.map((s) => (s ? { ...s } : null));
  }

  // Windows sit in a rectangle. y0 is the top row, x0 left.
  // border/fill are color indices; fill may be null for solid border color.
  // lock: building id string. key: this window unlocks that id when turned off.
  function stampBuilding(g, x0, y0, w, h, opt) {
    const border = opt.border;
    const fill = opt.fill == null ? border : opt.fill;
    const lock = opt.lock || null;
    const key = opt.key || null;
    const keyAt = opt.keyAt || null;
    for (let y = y0; y < y0 + h; y++) {
      for (let x = x0; x < x0 + w; x++) {
        const edge = x === x0 || x === x0 + w - 1 || y === y0 || y === y0 + h - 1;
        let c = edge ? border : fill;
        if (opt.pattern && opt.pattern[y - y0] && opt.pattern[y - y0][x - x0] != null) {
          c = opt.pattern[y - y0][x - x0];
        }
        const cell = { c, on: true };
        if (lock) cell.lock = lock;
        if (keyAt && keyAt[0] === x && keyAt[1] === y && key) cell.key = key;
        g[y][x] = cell;
      }
    }
    if (key && keyAt == null) {
      // default: a border cell that is not a corner, mid-top if possible
      const kx = x0 + (w >> 1);
      const ky = y0;
      if (g[ky][kx]) {
        g[ky][kx].key = key;
        g[ky][kx].c = opt.keyColor != null ? opt.keyColor : g[ky][kx].c;
      }
    }
  }

  function countOn(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && c.on) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function isOpen(grid, x, y) {
    const H = grid.length, W = grid[0].length;
    if (x < 0 || y < 0 || x >= W || y >= H) return true; // outside = sky
    const c = grid[y][x];
    if (!c) return true; // sky
    if (c.on) return false;
    return true; // already off window, path opens
  }

  function isReachable(grid, x, y, unlocked) {
    const cell = grid[y][x];
    if (!cell || !cell.on) return false;
    if (cell.lock && !(unlocked && unlocked[cell.lock])) return false;
    for (const [dx, dy] of DIRS) {
      if (isOpen(grid, x + dx, y + dy)) return true;
    }
    return false;
  }

  function findTarget(grid, color, unlocked) {
    const H = grid.length, W = grid[0].length;
    let best = null;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on || cell.c !== color) continue;
        if (!isReachable(grid, x, y, unlocked)) continue;
        const isKey = !!cell.key;
        if (
          !best ||
          (isKey && !best.key) ||
          (isKey === !!best.key && (y < best.y || (y === best.y && x < best.x)))
        ) {
          best = { x, y, key: isKey };
        }
      }
    }
    return best;
  }

  function turnOff(grid, t, unlocked) {
    const cell = grid[t.y][t.x];
    cell.on = false;
    if (cell.key) unlocked[cell.key] = true;
  }

  // Process all slots until none can work. Deterministic.
  function saturate(grid, slots, unlocked) {
    let guard = 0;
    while (guard++ < 4000) {
      let did = false;
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        if (!s || s.n <= 0) continue;
        const t = findTarget(grid, s.c, unlocked);
        if (!t) continue;
        turnOff(grid, t, unlocked);
        s.n--;
        did = true;
      }
      if (!did) break;
    }
    for (let i = 0; i < slots.length; i++) {
      if (slots[i] && slots[i].n <= 0) slots[i] = null;
    }
  }

  function leftCount(grid) {
    let n = 0;
    for (const row of grid) for (const c of row) if (c && c.on) n++;
    return n;
  }

  function canTake(cols, ci) {
    return cols[ci] && cols[ci].length > 0;
  }

  function place(cols, slots, ci, slotCount) {
    if (!canTake(cols, ci)) return false;
    let si = -1;
    for (let i = 0; i < slotCount; i++) if (!slots[i]) { si = i; break; }
    if (si < 0) return false;
    const t = cols[ci].shift();
    slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id };
    return true;
  }

  function frontsUseful(grid, cols, unlocked) {
    const out = [];
    for (let i = 0; i < cols.length; i++) {
      const t = cols[i][0];
      if (t && findTarget(grid, t.c, unlocked)) out.push(i);
    }
    return out;
  }

  function isWon(grid) { return leftCount(grid) === 0; }

  function isLost(grid, cols, slots, slotCount, unlocked) {
    if (isWon(grid)) return false;
    if (slots.some((s) => s && s.n > 0 && findTarget(grid, s.c, unlocked))) return false;
    const free = slots.slice(0, slotCount).filter((s) => !s).length;
    if (free === 0) return true;
    // free slot but no front ticket? also lost
    const anyFront = cols.some((c) => c.length);
    return !anyFront;
  }

  function stateKey(grid, cols, slots, unlocked) {
    let lights = "";
    for (const row of grid) for (const c of row) lights += c && c.on ? "1" : "0";
    const cs = cols.map((col) => col.map((t) => t.c + ":" + t.n).join(",")).join("|");
    const ss = slots.map((s) => (s ? s.c + ":" + s.n : "-")).join(",");
    const uk = Object.keys(unlocked).filter((k) => unlocked[k]).sort().join(",");
    return lights + "#" + cs + "#" + ss + "#" + uk;
  }

  // Returns {ok, path: column indices} or {ok:false}
  function solve(level, slotCount) {
    const grid0 = cloneGrid(level.grid);
    const cols0 = cloneCols(level.cols);
    const slots0 = Array(slotCount).fill(null);
    const unlocked0 = { ...(level.unlocked || {}) };
    const seen = new Set();
    let found = null;
    const maxVisits = 200000;
    let visits = 0;

    function dfs(grid, cols, slots, unlocked, path) {
      if (found) return;
      if (++visits > maxVisits) return;
      saturate(grid, slots, unlocked);
      if (isWon(grid)) { found = path.slice(); return; }
      if (isLost(grid, cols, slots, slotCount, unlocked)) return;
      const key = stateKey(grid, cols, slots, unlocked);
      if (seen.has(key)) return;
      seen.add(key);

      // Prefer useful fronts first, then others (for faster win)
      const order = [];
      for (let i = 0; i < cols.length; i++) if (cols[i].length) order.push(i);
      order.sort((a, b) => {
        const ua = findTarget(grid, cols[a][0].c, unlocked) ? 0 : 1;
        const ub = findTarget(grid, cols[b][0].c, unlocked) ? 0 : 1;
        return ua - ub;
      });
      for (const i of order) {
        const g2 = cloneGrid(grid);
        const c2 = cloneCols(cols);
        const s2 = cloneSlots(slots);
        const u2 = { ...unlocked };
        if (!place(c2, s2, i, slotCount)) continue;
        dfs(g2, c2, s2, u2, path.concat(i));
        if (found) return;
      }
    }

    dfs(grid0, cols0, slots0, unlocked0, []);
    return { ok: !!found, path: found || [], visits, left: leftCount(grid0) };
  }

  function ticketSumsOk(level) {
    const { n } = countOn(level.grid);
    const got = {};
    for (const col of level.cols) for (const t of col) got[t.c] = (got[t.c] || 0) + t.n;
    const keys = new Set([...Object.keys(n), ...Object.keys(got)]);
    for (const k of keys) if ((n[k] || 0) !== (got[k] || 0)) return { ok: false, n, got };
    return { ok: true, n, got };
  }

  // ----- level builders -----
  let _tid = 1;
  function T(c, n, extra) { return { c, n, id: _tid++, ...(extra || {}) }; }

  function level(def) {
    const g = emptyGrid(def.W, def.H);
    for (const b of def.buildings) stampBuilding(g, b.x, b.y, b.w, b.h, b);
    return {
      id: def.id,
      name: def.name,
      hint: def.hint,
      tier: def.tier,
      W: def.W,
      H: def.H,
      grid: g,
      cols: def.cols,
      unlocked: def.unlocked || {},
      coach: def.coach || false,
      mechanic: def.mechanic || null,
    };
  }

  const LEVELS = [];

  // L1 江岸初夜 — yellow shell, cyan core. Teach edges-in.
  LEVELS.push(level({
    id: "river",
    name: "江岸初夜",
    tier: "入门",
    hint: "从外层的暖黄开始关，里面的青灯才会露出来。",
    coach: true,
    W: 15, H: 10,
    buildings: [
      { x: 1, y: 6, w: 3, h: 4, border: 0, fill: 0 },
      { x: 5, y: 2, w: 5, h: 8, border: 0, fill: 2 },
      { x: 11, y: 6, w: 3, h: 4, border: 0, fill: 0 },
    ],
    cols: [
      [T(0, 16)],
      [T(2, 18)],
      [T(0, 16)],
      [T(0, 14)],
    ],
  }));

  // L2 霓虹街 — 4 colors, 5 buildings, mid layer
  LEVELS.push(level({

    let left = s;
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (left <= d || i === pts.length - 1) {
        const k = d ? left / d : 1;
        const x = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k;
        const y = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k;
        const a = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
        return { x, y, a };
      }
      left -= d;
    }
    const last = pts[pts.length - 1];
    return { x: last.x, y: last.y, a: 0 };
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < (n || 10); i++) {
      parts.push({
        x, y,
        vx: (Math.random() - 0.5) * 140,
        vy: -Math.random() * 120 - 20,
        life: 0.35 + Math.random() * 0.25,
        max: 0.6,
        c: col,
        sz: 1.5 + Math.random() * 2.5,
      });
    }
  }

  function step(dt) {
    if (over || paused || !LV || !geo) {
      if (won && winTimer > 0) {
        winTimer -= dt;
        if (winTimer <= 0) showWin();
      }
      stepFx(dt);
      return;
    }
    playTime += dt;
    const rushing = cols.every((c) => !c.length);
    const sp = rushing ? Math.max(speed, 8) : speed;

    // dispatch workers
    for (let i = 0; i < slotCount; i++) {
      const s = slots[i];
      if (!s || s.n <= 0 || s._busy) continue;
      const t = C.findTarget(grid, s.c, unlocked);
      if (!t) {
        if (!s._wait) {
          s._wait = true;
          toast("这种颜色还埋在里面，小电工在等", true);
        }
        continue;
      }
      spawnWorker(i, t);
    }

    const climb = geo.cs * 22 * sp;
    for (let k = workers.length - 1; k >= 0; k--) {
      const w = workers[k];
      w.ph += dt * 16;
      if (w.st === "go") {
        w.s = Math.min(w.len, w.s + climb * dt);
        const p = atPoly(w.path, w.s);
        w.x = p.x; w.y = p.y; w.a = p.a;
        if (w.s >= w.len - 0.1) {
          w.st = "work";
          w.t = 0;
        }
      } else if (w.st === "work") {
        w.t += dt * sp;
        if (w.t > 0.08 && !w.did) {
          w.did = true;
          const cell = grid[w.ty][w.tx];
          if (cell && cell.on && cell.c === w.color) {
            const wasKey = !!cell.key;
            C.turnOff(grid, { x: w.tx, y: w.ty }, unlocked);
            const col = C.COLORS[w.color].glow;
            burst(w.x, w.y, col, 12);
            SFX.spark();
            SFX.off();
            if (wasKey) { SFX.unlock(); toast("咔哒，顶楼的锁开了", true); }
            if (slots[w.si]) slots[w.si].n--;
          }
        }
        if (w.t > 0.16) {
          const s = slots[w.si];
          if (s && s.n > 0) {
            const nxt = C.findTarget(grid, s.c, unlocked);
            if (nxt) {
              const dest = cellXY(nxt.x, nxt.y);
              const go = [
                { x: w.x, y: w.y },
                { x: dest.x, y: w.y },
                { x: dest.x, y: dest.y },
              ];
              w.tx = nxt.x; w.ty = nxt.y;
              w.path = go; w.s = 0; w.len = polyLen(go); w.st = "go"; w.t = 0; w.did = false;
            } else {
              w.st = "back"; w.t = 0;
              const sp0 = slotPt(w.si);
              w.path = [{ x: w.x, y: w.y }, { x: w.x, y: geo.streetY }, { x: sp0.x, y: geo.streetY }, { x: sp0.x, y: sp0.y }];
              w.s = 0; w.len = polyLen(w.path);
            }
          } else {
            w.st = "back"; w.t = 0;
            const sp0 = slotPt(w.si);
            w.path = [{ x: w.x, y: w.y }, { x: w.x, y: geo.streetY }, { x: sp0.x, y: geo.streetY }, { x: sp0.x, y: sp0.y }];
            w.s = 0; w.len = polyLen(w.path);
          }
        }
      } else if (w.st === "back") {
        w.s = Math.min(w.len, w.s + climb * 1.15 * dt);
        const p = atPoly(w.path, w.s);
        w.x = p.x; w.y = p.y; w.a = p.a;
        if (w.s >= w.len - 0.1) {
          if (slots[w.si]) slots[w.si]._busy = false;
          workers.splice(k, 1);
        }
      }
    }

    // pop empty slots when no worker belongs to them
    for (let i = 0; i < slotCount; i++) {
      if (slots[i] && slots[i].n <= 0 && !slots[i]._busy && !workers.some((w) => w.si === i && w.st !== "back")) {
        slots[i] = null;
        SFX.pop();
      }
    }

    // win / lose when idle
    const left = C.leftCount(grid);
    const busy = workers.length > 0;
    if (left === 0 && !busy && !won) {
      won = true;
      winTimer = 0.55;
    } else if (!won && !busy && C.isLost(grid, cols, slots, slotCount, unlocked)) {
      showLose();
    }

    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) $("#toast").classList.remove("show");
    }
    if (winTimer > 0) {
      winTimer -= dt;
      if (winTimer <= 0) showWin();
    }
    stepFx(dt);
    const sig = slots.map((s) => (s ? s.c + ":" + s.n + (s._wait ? "w" : "") : "-")).join("|") + "#" + slotCount;
    if (sig !== step._slotSig) { step._slotSig = sig; renderSlots(); updateHud(); }
    else if (Math.floor(playTime * 8) !== step._hudN) { step._hudN = Math.floor(playTime * 8); updateHud(); }
  }

  function stepFx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
  }

  function showLose() {
    if (over || won) return;
    over = true;
    SFX.lose();
    $("#loseRw").hidden = usedRewind || history.length === 0;
    $("#loseBox").hidden = false;
  }
  function showWin() {
    over = true;
    won = true;
    cleared[li] = true;
    SFX.win();
    $("#winBox").hidden = false;
    $("#winNext").hidden = li >= C.LEVELS.length - 1;
    $("#winTitle").textContent = "晚安";
    $("#winSub").textContent = "城市已入睡 · " + LV.name;
  }

  function rewind() {
    if (usedRewind || !history.length) return;
    usedRewind = true;
    const steps = Math.min(3, history.length);
    let s = null;
    for (let i = 0; i < steps; i++) s = history.pop();
    restore(s);
    toast("时光倒流，回到 " + steps + " 步之前", true);
  }

  function addSlotFromAd() {
    if (slotCount >= 7) { toast("槽位已经加满了", true); return; }
    slotCount++;
    slots.push(null);
    over = false;
    won = false;
    $("#loseBox").hidden = true;
    renderSlots();
    toast("多了一个电闸槽", true);
    SFX.seat();
  }

  function openAd() {
    adFor = "slot";
    adLeft = 5;
    $("#adBox").hidden = false;
    $("#adSec").textContent = "5";
  }
  function tickAd(dt) {
    if ($("#adBox").hidden) return;
    adLeft -= dt;
    const n = Math.max(0, Math.ceil(adLeft));
    $("#adSec").textContent = String(n);
    if (adLeft <= 0) {
      $("#adBox").hidden = true;
      addSlotFromAd();
    }
  }

  /* ---------- render ---------- */
  function darkK() {
    if (!LV) return 0;
    const left = C.leftCount(grid);
    return 1 - left / Math.max(1, startTotal);
  }

  function draw() {
    if (!geo) return;
    const { w, h } = geo;
    const k = darkK();
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, h);
    const top = lerpC("#14163a", "#05051a", k);
    const bot = lerpC("#2a1b48", "#070612", k);
    g.addColorStop(0, top);
    g.addColorStop(0.55, lerpC("#1a1440", "#08071c", k));
    g.addColorStop(1, bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // stars
    const starA = 0.25 + 0.75 * k;
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(playTime * s.s + s.p);
      ctx.globalAlpha = starA * s.b * tw;
      ctx.fillStyle = "#fff8e8";
      const x = s.x * w, y = s.y * geo.sky * 1.15;
      ctx.beginPath();
      ctx.arc(x, y, s.r * (0.7 + 0.6 * k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    // moon
    const mx = w * 0.82, my = geo.sky * 0.42;
    const mr = 18 + 10 * k;
    ctx.save();
    ctx.shadowColor = `rgba(255,244,210,${0.2 + 0.45 * k})`;
    ctx.shadowBlur = 18 + 24 * k;
    ctx.fillStyle = `rgba(255,244,214,${0.55 + 0.4 * k})`;
    ctx.beginPath();
    ctx.arc(mx, my, mr, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(230,214,170,${0.25 + 0.2 * k})`;
    ctx.beginPath(); ctx.arc(mx - mr * 0.28, my - mr * 0.18, mr * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr * 0.22, my + mr * 0.2, mr * 0.14, 0, Math.PI * 2); ctx.fill();
    ctx.restore();

    if (LV && grid) drawCity();

    // particles
    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / (p.max || 0.6));
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x - p.sz / 2, p.y - p.sz / 2, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;

    for (const w of workers) drawWorker(w);
  }

  function drawCity() {
    const { cs, ox, oy } = geo;
    // haze from remaining lights
    const k = darkK();
    const left = C.leftCount(grid);
    if (left > 0) {
      const hg = ctx.createRadialGradient(geo.w / 2, oy + LV.H * cs, 10, geo.w / 2, oy + LV.H * cs * 0.4, geo.w * 0.7);
      hg.addColorStop(0, `rgba(255, 180, 80, ${0.07 * (1 - k)})`);
      hg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = hg;
      ctx.fillRect(0, 0, geo.w, geo.h);
    }

    // street
    ctx.fillStyle = "#0b0a14";
    ctx.fillRect(0, geo.streetY - 8, geo.w, geo.h - geo.streetY + 8);
    ctx.fillStyle = "#16141f";
    ctx.fillRect(0, geo.streetY - 10, geo.w, 4);
    ctx.fillStyle = "rgba(255,210,120,.12)";
    for (let x = 16; x < geo.w; x += 28) ctx.fillRect(x, geo.streetY - 8, 12, 1.5);

    // glow pass
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on) continue;
        if (cell.lock && !unlocked[cell.lock]) continue;
        const p = cellXY(x, y);
        const col = C.COLORS[cell.c];
        const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, cs * 1.7);
        grd.addColorStop(0, hexA(col.glow, 0.55));
        grd.addColorStop(0.45, hexA(col.glow, 0.16));
        grd.addColorStop(1, hexA(col.glow, 0));
        ctx.fillStyle = grd;
        ctx.fillRect(p.x - cs * 1.7, p.y - cs * 1.7, cs * 3.4, cs * 3.4);
      }
    }
    ctx.restore();

    // facades + windows
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const cell = grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        const locked = cell.lock && !unlocked[cell.lock];
        ctx.fillStyle = locked ? "#1a1528" : "#161326";
        ctx.fillRect(px, py, cs + 0.4, cs + 0.4);
        const inset = Math.max(1.2, cs * 0.16);
        const wx = px + inset, wy = py + inset;
        const ww = cs - inset * 2, wh = cs - inset * 2;
        if (cell.on && !locked) {
          ctx.fillStyle = C.COLORS[cell.c].fill;
          roundRect(ctx, wx, wy, ww, wh, 1);
          ctx.fill();
          ctx.fillStyle = "rgba(255,255,230,.35)";
          ctx.fillRect(wx + 0.6, wy + 0.6, ww * 0.35, wh * 0.28);
        } else {
          ctx.fillStyle = locked ? "#0c0a16" : "#0a0914";
          roundRect(ctx, wx, wy, ww, wh, 1);
          ctx.fill();
          ctx.strokeStyle = "rgba(80,70,120,.25)";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
        if (cell.key && cell.on) {
          ctx.fillStyle = "#ffe27a";
          ctx.font = `${Math.max(8, cs * 0.62)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("♔", px + cs / 2, py + cs / 2 + 0.5);
        }
        if (locked && cell.on && y === minLockY(cell.lock) && x === midLockX(cell.lock)) {
          ctx.fillStyle = "#ffd56a";
          ctx.font = `${Math.max(10, cs * 0.8)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("🔒", px + cs / 2, py + cs / 2);
        }
      }
    }

    // roofs
    for (let x = 0; x < LV.W; x++) {
      let top = -1;
      for (let y = 0; y < LV.H; y++) if (grid[y][x]) { top = y; break; }
      if (top < 0) continue;
      const px = ox + x * cs, py = oy + top * cs;
      ctx.fillStyle = "#0e0c1c";
      ctx.fillRect(px - 0.5, py - 3, cs + 1, 3);
      // antenna on some tops
      if (top <= 2 && x % 5 === 2) {
        ctx.strokeStyle = "#2a2740";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(px + cs * 0.7, py - 3);
        ctx.lineTo(px + cs * 0.7, py - 10);
        ctx.stroke();
        ctx.fillStyle = "#ff8ab8";
        ctx.globalAlpha = 0.5 + 0.5 * Math.sin(playTime * 4 + x);
        ctx.beginPath(); ctx.arc(px + cs * 0.7, py - 11, 1.4, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
      }
    }
  }

  function minLockY(id) {
    let m = 99;
    for (let y = 0; y < LV.H; y++)
      for (let x = 0; x < LV.W; x++)
        if (grid[y][x] && grid[y][x].lock === id) m = Math.min(m, y);
    return m;
  }
  function midLockX(id) {
    const xs = [];
    const y = minLockY(id);
    for (let x = 0; x < LV.W; x++) if (grid[y][x] && grid[y][x].lock === id) xs.push(x);
    return xs[xs.length >> 1] || 0;
  }

  function drawWorker(w) {
    const col = C.COLORS[w.color].fill;
    const climbing = w.st === "go" || w.st === "back";
    // van on the street whenever the worker is mid-path near street
    const onStreet = Math.abs(w.y - geo.streetY) < 18 && (w.st === "go" || w.st === "back");
    if (onStreet || (w.st === "go" && w.s < w.len * 0.55)) {
      const vx = onStreet ? w.x : atPoly(w.path, Math.min(w.s, polyLen([w.path[0], w.path[1], w.path[2]]))).x;
      const vy = geo.streetY;
      drawVan(vx, vy, col, w.a > 0);
    }
    // little electrician
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.scale(1.25, 1.25);
    const walk = Math.sin(w.ph) * 2;
    // wand
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.lineTo(11, -8 + (w.st === "work" ? -2 : 0));
    ctx.stroke();
    if (w.st === "work") {
      ctx.fillStyle = "#fff4c0";
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(playTime * 30);
      ctx.beginPath(); ctx.arc(11, -10, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // body
    ctx.fillStyle = "#1c1a28";
    ctx.fillRect(-3.5, -2 + walk * 0.2, 7, 8);
    ctx.fillStyle = col;
    ctx.fillRect(-3.5, -1, 7, 3.5);
    // head + hat
    ctx.fillStyle = "#f1d2b0";
    ctx.beginPath(); ctx.arc(0, -5, 3.1, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd56a";
    ctx.fillRect(-3.4, -9, 6.8, 2.4);
    ctx.fillRect(-1, -11, 2, 2);
    // legs
    ctx.fillStyle = "#2a2738";
    ctx.fillRect(-3, 6, 2.2, 4 + walk);
    ctx.fillRect(1, 6, 2.2, 4 - walk);
    ctx.restore();
  }

  function drawVan(x, y, col, flip) {
    ctx.save();
    ctx.translate(x, y + 2);
    if (flip) ctx.scale(-1, 1);
    ctx.fillStyle = "#1a1830";
    ctx.fillRect(-11, -9, 22, 10);
    ctx.fillStyle = col;
    ctx.fillRect(-11, -9, 22, 3.5);
    ctx.fillStyle = "#7ee7ff";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(3, -7, 6, 3);
    ctx.globalAlpha = 1;
    ctx.fillStyle = "#2a2738";
    ctx.beginPath(); ctx.arc(-6, 2, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(7, 2, 2.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexA(h, a) {
    const n = h.replace("#", "");
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lerpC(a, b, t) {
    const P = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const A = P(a), B = P(b);
    return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`;
  }

  /* ---------- loop ---------- */
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    acc += dt;
    tickAd(dt);
    if (screen === "game") {
      const stepDt = dt;
      step(stepDt);
    }
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- events ---------- */
  $("#backBtn").onclick = openMenu;
  $("#speedBtn").onclick = () => { if (over) return; speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; updateHud(); };
  $("#soundBtn").onclick = () => { muted = !muted; try { ac(); } catch (e) {} updateHud(); };
  $("#loseMenu").onclick = openMenu;
  $("#loseRetry").onclick = () => loadLevel(li);
  $("#winMenu").onclick = openMenu;
  $("#winRetry").onclick = () => loadLevel(li);
  $("#winNext").onclick = () => openLevel(Math.min(C.LEVELS.length - 1, li + 1));
  $("#loseRw").onclick = rewind;
  $("#loseAd").onclick = openAd;
  $("#adSkip").onclick = () => { $("#adBox").hidden = true; addSlotFromAd(); };
  $("#coach").onclick = () => { if (coach) coachNext(); };

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 80));

  /* ---------- boot ---------- */
  seedStars();
  solutions = C.LEVELS.map((L) => C.solve(L, 5));
  solutions.forEach((s, i) => {
    if (!s.ok) console.error("UNSOLVABLE", C.LEVELS[i].id);
  });
  renderMenu();
  resize();
  requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });

  window.__DEMO__ = {
    startLevel: openLevel,
    tap: (ci) => tapBox(ci, 0),
    state: () => ({
      screen, li, left: grid ? C.leftCount(grid) : 0, over, won,
      slots: slots.map((s) => (s ? { c: s.c, n: s.n, wait: !!s._wait } : null)),
      fronts: cols ? cols.map((c) => (c[0] ? { c: c[0].c, n: c[0].n, hidden: !!c[0].hidden } : null)) : [],
      slotCount, usedRewind, coach: coach && coach.i,
      name: LV && LV.name,
    }),
    solutions: solutions.map((s) => s.path),
    skipCoach() { coach = null; const el = document.getElementById("coach"); if (el) el.hidden = true; },
    showLose,
    setSpeed: (n) => { speed = n; if (LV) updateHud(); },
    rewind,
    addSlotFromAd,
    openAd,
    loadLevel,
    COLORS: C.COLORS,
  };
})();

  </script>
</body>
</html>
