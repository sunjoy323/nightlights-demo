<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07061a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307061a' width='32' height='32' rx='6'/%3E%3Ccircle cx='20' cy='12' r='7' fill='%23ffd56a'/%3E%3Ccircle cx='16' cy='10' r='6' fill='%2307061a'/%3E%3Crect x='8' y='20' width='3' height='3' fill='%23ffd56a'/%3E%3Crect x='13' y='20' width='3' height='3' fill='%237ee7ff'/%3E%3Crect x='18' y='20' width='3' height='3' fill='%23ff8ab8'/%3E%3C/svg%3E" />
  <title>夜灯将眠</title>
  <style>
:root {
  --bg: #07061a;
  --panel: #12101f;
  --line: #2c2750;
  --text: #f3efe4;
  --muted: #8a84a8;
  --ink: #140d08;
  --accent: #ffd56a;
  --danger: #ff6b8a;
  --ok: #8dffc1;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus, .box:focus { outline: none; }
#app {
  width: min(430px, 100%);
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #07061a;
  box-shadow: 0 0 0 1px #1a1630;
}
#menu, #game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#menu[hidden], #game[hidden], [hidden] { display: none !important; }

/* menu */
#menu { overflow: auto; padding: 22px 16px 28px; }
.brand { text-align: center; margin-bottom: 6px; }
.brand h1 {
  font-size: 30px; letter-spacing: 0.18em; font-weight: 700; margin: 0 0 6px;
  text-shadow: 0 0 24px rgba(255, 213, 106, .28);
  cursor: default;
}
.brand p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
#progress { margin: 10px 0 0; color: var(--accent); font-size: 12px; letter-spacing: 0.08em; }
#levels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}
.card {
  appearance: none; border: 1px solid #2a2650; background: #12101f;
  border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer;
  text-align: left; display: block; width: 100%;
  transition: transform .12s ease, border-color .12s;
}
.card:active { transform: scale(0.97); }
.card canvas { display: block; width: 100%; height: auto; background: #0a0a22; }
.card .meta { display: flex; flex-direction: column; gap: 2px; padding: 7px 10px 8px; position: relative; }
.card .no { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; }
.card strong { font-size: 14px; font-weight: 700; line-height: 1.25; }
.card .star { position: absolute; right: 8px; top: 8px; color: var(--accent); font-size: 11px; letter-spacing: 1px; }
.card.start { border-color: #ffd56a; box-shadow: 0 0 0 1px rgba(255,213,106,.35); }
.card.done { border-color: #3a5a48; }
.card.locked { opacity: 0.55; cursor: default; filter: grayscale(.35); }
.card.locked .meta strong { color: var(--muted); }
.card .lock { position: absolute; right: 8px; top: 8px; font-size: 12px; opacity: .8; }

/* game hud */
.hud {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 10px 4px;
  flex: 0 0 auto;
}
.hud .icon, .hud .tool {
  appearance: none; background: #1a1730; border: 1px solid var(--line);
  border-radius: 10px; width: 34px; height: 34px; cursor: pointer;
  display: grid; place-items: center; font-size: 15px;
}
.hud .titles { flex: 1; min-width: 0; }
#lvNo { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
#lvName { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .stat {
  background: #1a1730; border: 1px solid var(--line); border-radius: 10px;
  padding: 3px 7px; text-align: right;
}
.hud .stat em { display: block; font-style: normal; font-size: 9px; color: var(--muted); }
#leftV { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
#loadRail {
  height: 3px; margin: 0 12px 4px; background: #1a1730; border-radius: 99px; overflow: hidden;
  flex: 0 0 auto;
}
#loadFill { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 8px rgba(255,213,106,.5); transition: width .2s, background .2s; }
#loadFill.hot { background: var(--danger); box-shadow: 0 0 8px rgba(255,107,138,.5); }

#stage { flex: 1; min-height: 0; position: relative; }
#board { display: block; width: 100%; height: 100%; }
#slots {
  position: absolute; left: 10px; right: 10px; bottom: 8px;
  display: grid; gap: 6px;
  pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%) translateY(-8px);
  background: #2a1630; color: #ffe8ee; border: 1px solid #6a3048;
  padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0;
  pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.soft { background: #1a2030; border-color: #3a5070; color: #e8f0ff; }

#slots.pad { min-height: 0; }
.slot {
  height: 52px; border: 1.5px dashed #3a3560; border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(40,36,70,.45), rgba(12, 10, 24, .82));
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
  position: relative;
}
.slot.full { border-style: solid; border-color: #4a4570; }
.slot.wait { border-color: #6a6080; }
.slot.duo { border-color: #ff9a4a; box-shadow: 0 0 0 1px rgba(255,154,74,.35); }
.slot.hold { border-style: solid; border-color: #ff9a4a; opacity: .85; }
.slot .box { width: 100%; height: 100%; border-radius: 9px; font-size: 20px; font-weight: 700; position: relative; }
.slot .tag {
  position: absolute; left: 4px; bottom: 2px; font-size: 8px; font-weight: 700;
  letter-spacing: 0.04em; opacity: .7;
}
.zz {
  position: absolute; right: 4px; top: 2px; font-size: 10px; font-style: normal;
  color: #3a2208; opacity: .7; font-weight: 700;
}
.sleeper {
  position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  font-size: 14px; opacity: .85;
}

#tray {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 6px 14px 10px;
  background: linear-gradient(180deg, transparent, rgba(8,6,20,.55));
}
.tcol { display: flex; flex-direction: column; gap: 7px; position: relative; }
.box {
  appearance: none; height: 46px; border-radius: 8px; border: 2px solid #140d08;
  cursor: pointer; font-weight: 800; font-size: 18px; letter-spacing: 0.5px;
  box-shadow: 0 3px 0 #140d08, 0 4px 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s;
  position: relative;
}
.box:active { transform: translateY(2px); box-shadow: 0 1px 0 #140d08; }
.box.back { opacity: .92; cursor: default; box-shadow: 0 2px 0 #140d08; }
.box.back:active { transform: none; }
.box.duo::before {
  content: "双槽"; position: absolute; left: 4px; top: 2px;
  font-size: 8px; font-weight: 700; letter-spacing: 0; opacity: .7;
}
.box.point {
  outline: 3px solid #fff4c0; outline-offset: 3px;
  animation: pulse 1s ease-in-out infinite;
  position: relative; z-index: 3;
}
.box.point::after {
  content: ""; position: absolute; right: -18px; top: 50%; width: 28px; height: 28px;
  transform: translateY(-20%);
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23fff4c0' stroke='%23140d08' stroke-width='2' d='M8 2l4 14 3-2 6 12 4-2-6-12 5-1z'/></svg>") center/contain no-repeat;
  pointer-events: none;
}
@keyframes pulse { 50% { outline-color: rgba(255,244,192,.35); } }
.more { text-align: center; font-size: 11px; color: var(--muted); margin-top: -2px; }

#coach {
  position: absolute; left: 16px; right: 16px; bottom: 72px;
  z-index: 5; pointer-events: auto;
}
#coach .bubble {
  background: #fff8e8; color: #2a1a10; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#coach .bubble b { color: #9a3a10; }
#coach .next { margin-top: 4px; font-size: 12px; color: #8a6a50; }

#fx {
  position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden;
}
.fly {
  position: fixed; z-index: 40; pointer-events: none; border-radius: 8px;
  display: grid; place-items: center; font-weight: 800; border: 2px solid #140d08;
  transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), transform .38s, opacity .38s;
}

/* overlays */
.modal {
  position: absolute; inset: 0; background: rgba(6, 5, 16, .62);
  display: grid; place-items: center; z-index: 20; padding: 20px;
}
.panel {
  width: min(340px, 100%); background: #161326; border: 1px solid #3a3560;
  border-radius: 18px; padding: 22px 18px 16px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.panel .en { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); }
.panel h2 { margin: 6px 0 8px; font-size: 28px; font-weight: 750; }
#winBox h2 { font-size: 40px; letter-spacing: 0.28em; text-shadow: 0 0 28px rgba(255,213,106,.45); }
.panel p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
#winStars { font-size: 28px; letter-spacing: 6px; color: var(--accent); margin: 0 0 12px; text-shadow: 0 0 16px rgba(255,213,106,.45); }
#winStars .dim { color: #3a3560; text-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 10px 14px;
  background: #2a2650; cursor: pointer; font-weight: 650; font-size: 14px;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: #2a1a08; min-width: 100%; }
.btn.ghost { background: transparent; border: 1px solid #3a3560; }
.btn.danger { background: #3a2030; }
.note { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.4; }

#adBox .panel { background: #0c0b18; }
#adSec { font-size: 48px; font-weight: 800; color: var(--accent); margin: 8px 0; }

@media (max-height: 700px) {
  .box { height: 40px; font-size: 16px; }
  .slot { height: 46px; }
  .brand h1 { font-size: 24px; }
  #levels { gap: 8px; }
}

  </style>
</head>
<body>
  <div id="app">
    <section id="menu">
      <div class="brand">
        <h1 id="brandTitle">夜灯将眠</h1>
        <p>把通明的城市，一盏盏关掉</p>
        <p id="progress"></p>
      </div>
      <div id="levels"></div>
    </section>

    <section id="game" hidden>
      <div class="hud">
        <button class="icon" id="backBtn" aria-label="返回">←</button>
        <div class="titles"><span id="lvNo"></span><span id="lvName"></span></div>
        <div class="stat"><em>剩余</em><span id="leftV">0</span></div>
        <button class="tool" id="speedBtn" type="button">▶ 1×</button>
        <button class="tool" id="soundBtn" type="button">♪</button>
      </div>
      <div id="loadRail"><i id="loadFill"></i></div>
      <div id="stage">
        <canvas id="board"></canvas>
        <div id="toast"></div>
        <div id="slots"></div>
        <div id="coach" hidden></div>
        <div id="fx"></div>
      </div>
      <div id="tray"></div>

      <div id="loseBox" class="modal" hidden>
        <div class="panel">
          <div class="en">GRID OVERLOAD</div>
          <h2 style="color:#ff6b8a">电网过载了</h2>
          <p>电闸里的颜色都还没露出来，小电工无处下手。</p>
          <button class="btn primary" id="loseRw" type="button">◀ 时光倒流</button>
          <div class="row" style="margin-top:8px">
            <button class="btn ghost" id="loseMenu" type="button">菜单</button>
            <button class="btn" id="loseRetry" type="button">重新开始</button>
            <button class="btn" id="loseAd" type="button">看广告加一个槽</button>
          </div>
          <div class="note">时光倒流会退回最近几步，每关一次。广告是演示用的倒计时，不会真的播放。</div>
        </div>
      </div>

      <div id="winBox" class="modal" hidden>
        <div class="panel">
          <div class="en">CITY ASLEEP</div>
          <h2 id="winTitle">晚安</h2>
          <div id="winStars">★★★</div>
          <p id="winSub">城市已入睡</p>
          <div class="row">
            <button class="btn ghost" id="winMenu" type="button">菜单</button>
            <button class="btn" id="winRetry" type="button">再关一次</button>
            <button class="btn primary" id="winNext" type="button" style="min-width:0;flex:1">下一关</button>
          </div>
        </div>
      </div>

      <div id="adBox" class="modal" hidden>
        <div class="panel">
          <div class="en">SIMULATED AD</div>
          <h2>模拟广告</h2>
          <p>这是演示用的倒计时，不是真广告。</p>
          <div id="adSec">5</div>
          <button class="btn ghost" id="adSkip" type="button">跳过并获得槽位</button>
        </div>
      </div>
    </section>
  </div>
  <script id="core">
// Shared puzzle core for 夜灯将眠 — used by verify.mjs and inlined into index.html
(function (root) {
  const COLORS = [
    { id: "amber", fill: "#ffd56a", glow: "#ffbe3a", ink: "#3a2208", name: "暖黄" },
    { id: "pink", fill: "#ff8ab8", glow: "#ff5e9a", ink: "#4a1028", name: "粉" },
    { id: "cyan", fill: "#7ee7ff", glow: "#3ad4ff", ink: "#073044", name: "青" },
    { id: "orange", fill: "#ff9a4a", glow: "#ff7a1a", ink: "#3a1a00", name: "橙" },
    { id: "mint", fill: "#8dffc1", glow: "#3dff9a", ink: "#06301c", name: "薄荷" },
    { id: "lavender", fill: "#c9a6ff", glow: "#a87cff", ink: "#2a1050", name: "紫" },
  ];

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function emptyGrid(W, H) {
    return Array.from({ length: H }, () => Array.from({ length: W }, () => null));
  }

  function cloneGrid(g) {
    return g.map((row) => row.map((c) => (c ? { ...c } : null)));
  }

  function cloneCols(cols) {
    return cols.map((col) => col.map((t) => ({ ...t })));
  }

  function cloneSlots(slots) {
    return slots.map((s) => (s ? { ...s } : null));
  }

  // Windows sit in a rectangle. y0 is the top row, x0 left.
  // border/fill are color indices; fill may be null for solid border color.
  // lock: building id string. key: this window unlocks that id when turned off.
  function stampBuilding(g, x0, y0, w, h, opt) {
    const border = opt.border;
    const fill = opt.fill == null ? border : opt.fill;
    const lock = opt.lock || null;
    const key = opt.key || null;
    const keyAt = opt.keyAt || null;
    for (let y = y0; y < y0 + h; y++) {
      for (let x = x0; x < x0 + w; x++) {
        const edge = x === x0 || x === x0 + w - 1 || y === y0 || y === y0 + h - 1;
        let c = edge ? border : fill;
        if (opt.pattern && opt.pattern[y - y0] && opt.pattern[y - y0][x - x0] != null) {
          c = opt.pattern[y - y0][x - x0];
        }
        const cell = { c, on: true };
        if (lock) cell.lock = lock;
        if (opt.kind) cell.kind = opt.kind;
        if (keyAt && keyAt[0] === x && keyAt[1] === y && key) cell.key = key;
        g[y][x] = cell;
      }
    }
    if (key && keyAt == null) {
      const kx = x0 + (w >> 1);
      const ky = y0;
      if (g[ky][kx]) {
        g[ky][kx].key = key;
        g[ky][kx].c = opt.keyColor != null ? opt.keyColor : g[ky][kx].c;
        if (opt.keyKind) g[ky][kx].kind = opt.keyKind;
      }
    }
  }

  function countOn(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && c.on) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function countNeed(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && (c.on || c.dormant)) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function isOpen(grid, x, y) {
    const H = grid.length, W = grid[0].length;
    if (x < 0 || y < 0 || x >= W || y >= H) return true;
    const c = grid[y][x];
    if (!c) return true;
    if (c.on) return false;
    return true;
  }

  function blinkOpen(cell, takes) {
    if (!cell || !cell.blink) return true;
    return (takes || 0) % 2 === 1;
  }

  function isReachable(grid, x, y, unlocked, takes) {
    const cell = grid[y][x];
    if (!cell || !cell.on) return false;
    if (cell.lock && !(unlocked && unlocked[cell.lock])) return false;
    if (!blinkOpen(cell, takes)) return false;
    for (const [dx, dy] of DIRS) {
      if (isOpen(grid, x + dx, y + dy)) return true;
    }
    return false;
  }

  function findTarget(grid, color, unlocked, takes) {
    const H = grid.length, W = grid[0].length;
    let best = null;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on || cell.c !== color) continue;
        if (!isReachable(grid, x, y, unlocked, takes)) continue;
        const isKey = !!cell.key;
        if (
          !best ||
          (isKey && !best.key) ||
          (isKey === !!best.key && (y < best.y || (y === best.y && x < best.x)))
        ) {
          best = { x, y, key: isKey };
        }
      }
    }
    return best;
  }

  function turnOff(grid, t, unlocked) {
    const cell = grid[t.y][t.x];
    cell.on = false;
    cell.dormant = false;
    if (cell.key) unlocked[cell.key] = true;
    if (cell.awaken) {
      for (const [x, y] of cell.awaken) {
        const d = grid[y] && grid[y][x];
        if (d && d.dormant) {
          d.dormant = false;
          d.on = true;
        }
      }
    }
  }

  function saturate(grid, slots, unlocked, takes) {
    let guard = 0;
    while (guard++ < 4000) {
      let did = false;
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        if (!s || s.n <= 0 || s.hold) continue;
        const t = findTarget(grid, s.c, unlocked, takes);
        if (!t) continue;
        turnOff(grid, t, unlocked);
        s.n--;
        did = true;
      }
      if (!did) break;
    }
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s && s.n <= 0 && !s.hold) {
        if (s.duo && s.pair != null) slots[s.pair] = null;
        slots[i] = null;
      }
    }
  }

  function leftCount(grid) {
    let n = 0;
    for (const row of grid) for (const c of row) if (c && (c.on || c.dormant)) n++;
    return n;
  }

  function canTake(cols, ci) {
    return cols[ci] && cols[ci].length > 0;
  }

  function hasPair(slots, slotCount) {
    for (let i = 0; i < slotCount - 1; i++) if (!slots[i] && !slots[i + 1]) return true;
    return false;
  }

  function canPlaceTicket(slots, slotCount, t) {
    if (!t) return false;
    if (t.duo) return hasPair(slots, slotCount);
    for (let i = 0; i < slotCount; i++) if (!slots[i]) return true;
    return false;
  }

  function place(cols, slots, ci, slotCount) {
    if (!canTake(cols, ci)) return false;
    const t = cols[ci][0];
    if (t.duo) {
      let si = -1;
      for (let i = 0; i < slotCount - 1; i++) {
        if (!slots[i] && !slots[i + 1]) { si = i; break; }
      }
      if (si < 0) return false;
      cols[ci].shift();
      slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id, duo: true, pair: si + 1 };
      slots[si + 1] = { c: t.c, n: 0, hidden: !!t.hidden, id: t.id, duo: true, hold: true, pair: si };
      return true;
    }
    let si = -1;
    for (let i = 0; i < slotCount; i++) if (!slots[i]) { si = i; break; }
    if (si < 0) return false;
    cols[ci].shift();
    slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id };
    return true;
  }

  function frontsUseful(grid, cols, unlocked, takes) {
    const out = [];
    for (let i = 0; i < cols.length; i++) {
      const t = cols[i][0];
      if (t && findTarget(grid, t.c, unlocked, takes)) out.push(i);
    }
    return out;
  }

  function isWon(grid) { return leftCount(grid) === 0; }

  function canPlaceAny(cols, slots, slotCount) {
    for (let i = 0; i < cols.length; i++) {
      if (cols[i].length && canPlaceTicket(slots, slotCount, cols[i][0])) return true;
    }
    return false;
  }

  function isLost(grid, cols, slots, slotCount, unlocked, takes) {
    if (isWon(grid)) return false;
    if (slots.some((s) => s && s.n > 0 && !s.hold && findTarget(grid, s.c, unlocked, takes))) return false;
    return !canPlaceAny(cols, slots, slotCount);
  }

  function stateKey(grid, cols, slots, unlocked, takes) {
    let lights = "";
    for (const row of grid) for (const c of row) lights += c && c.on ? "1" : c && c.dormant ? "d" : "0";
    const cs = cols.map((col) => col.map((t) => t.c + ":" + t.n + (t.duo ? "D" : "")).join(",")).join("|");
    const ss = slots.map((s) => (s ? (s.hold ? "H" : s.c + ":" + s.n + (s.duo ? "D" : "")) : "-")).join(",");
    const uk = Object.keys(unlocked).filter((k) => unlocked[k]).sort().join(",");
    return lights + "#" + cs + "#" + ss + "#" + uk + "#" + ((takes || 0) % 2);
  }

  function solve(level, slotCount) {
    const grid0 = cloneGrid(level.grid);
    const cols0 = cloneCols(level.cols);
    const slots0 = Array(slotCount).fill(null);
    const unlocked0 = { ...(level.unlocked || {}) };
    const seen = new Set();
    let found = null;
    const maxVisits = 400000;
    let visits = 0;

    function dfs(grid, cols, slots, unlocked, takes, path) {
      if (found) return;
      if (++visits > maxVisits) return;
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) { found = path.slice(); return; }
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return;
      const key = stateKey(grid, cols, slots, unlocked, takes);
      if (seen.has(key)) return;
      seen.add(key);

      const order = [];
      for (let i = 0; i < cols.length; i++) if (cols[i].length) order.push(i);
      order.sort((a, b) => {
        const ua = findTarget(grid, cols[a][0].c, unlocked, takes) ? 0 : 1;
        const ub = findTarget(grid, cols[b][0].c, unlocked, takes) ? 0 : 1;
        if (ua !== ub) return ua - ub;
        const da = cols[a][0].duo ? 1 : 0;
        const db = cols[b][0].duo ? 1 : 0;
        return da - db;
      });
      for (const i of order) {
        const g2 = cloneGrid(grid);
        const c2 = cloneCols(cols);
        const s2 = cloneSlots(slots);
        const u2 = { ...unlocked };
        if (!place(c2, s2, i, slotCount)) continue;
        dfs(g2, c2, s2, u2, takes + 1, path.concat(i));
        if (found) return;
      }
    }

    dfs(grid0, cols0, slots0, unlocked0, 0, []);
    return { ok: !!found, path: found || [], visits, left: leftCount(grid0) };
  }

  function greedySolve(level, slotCount) {
    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    const path = [];
    for (let guard = 0; guard < 250; guard++) {
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      let choice = -1;
      for (let i = 0; i < cols.length; i++) {
        const t = cols[i][0];
        if (!t || !canPlaceTicket(slots, slotCount, t)) continue;
        if (findTarget(grid, t.c, unlocked, takes)) { choice = i; break; }
      }
      if (choice < 0) {
        for (let i = 0; i < cols.length; i++) {
          if (cols[i][0] && canPlaceTicket(slots, slotCount, cols[i][0])) { choice = i; break; }
        }
      }
      if (choice < 0) return { ok: false, path, reason: "stuck" };
      place(cols, slots, choice, slotCount);
      takes++;
      path.push(choice);
    }
    return { ok: false, path, reason: "timeout" };
  }


  function leftmostSolve(level, slotCount) {
    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    const path = [];
    for (let guard = 0; guard < 250; guard++) {
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      let choice = -1;
      for (let i = 0; i < cols.length; i++) {
        if (cols[i][0] && canPlaceTicket(slots, slotCount, cols[i][0])) { choice = i; break; }
      }
      if (choice < 0) return { ok: false, path, reason: "stuck" };
      place(cols, slots, choice, slotCount);
      takes++;
      path.push(choice);
    }
    return { ok: false, path, reason: "timeout" };
  }

  function ticketSumsOk(level) {
    const { n } = countNeed(level.grid);
    const got = {};
    for (const col of level.cols) for (const t of col) got[t.c] = (got[t.c] || 0) + t.n;
    const keys = new Set([...Object.keys(n), ...Object.keys(got)]);
    for (const k of keys) if ((n[k] || 0) !== (got[k] || 0)) return { ok: false, n, got };
    return { ok: true, n, got };
  }

  let _tid = 1;
  function T(c, n, extra) { return { c, n, id: _tid++, ...(extra || {}) }; }

  function level(def) {
    const g = emptyGrid(def.W, def.H);
    for (const b of def.buildings) stampBuilding(g, b.x, b.y, b.w, b.h, b);
    if (def.decorate) def.decorate(g);
    return {
      id: def.id,
      name: def.name,
      hint: def.hint,
      tier: def.tier,
      W: def.W,
      H: def.H,
      grid: g,

    };
  }

  function recItem(item) {
    return typeof item === "number" ? { c: item } : item;
  }

  function assign(level, recipe, hiddenSet) {
    hiddenSet = hiddenSet || new Set();
    const { n } = countNeed(level.grid);
    const need = {};
    const parsed = recipe.map((col) => col.map(recItem));
    for (const col of parsed) for (const it of col) need[it.c] = (need[it.c] || 0) + 1;
    const piles = {};
    for (const [cs, total] of Object.entries(n)) {
      const c = +cs;
      const k = need[c] || 0;
      piles[c] = [];
      if (k === 0 && total > 0) throw new Error(level.id + " color " + c + " has " + total + " lights but no tickets");
      if (k === 0) continue;
      const base = Math.floor(total / k);
      let rem = total - base * k;
      for (let i = 0; i < k; i++) {
        const v = base + (rem > 0 ? 1 : 0);
        if (rem > 0) rem--;
        piles[c].push(v);
      }
    }
    for (const c of Object.keys(need)) {
      if (!n[+c]) throw new Error(level.id + " ticket color " + c + " has no lights");
    }
    level.cols = parsed.map((col, ci) =>
      col.map((it, ri) => {
        const n1 = piles[it.c].shift();
        const hidden = !!(it.hidden || hiddenSet.has(ci + ":" + ri) || hiddenSet.has("c" + it.c));
        const extra = {};
        if (hidden) extra.hidden = true;
        if (it.duo) extra.duo = true;
        return T(it.c, n1, extra);
      })
    );
  }

    toast: () => beep(400, 0.08, "square", 0.03),
    awaken: () => { beep(440, 0.1, "sine", 0.04); beep(880, 0.16, "sine", 0.05, 0.08); beep(1320, 0.2, "sine", 0.04, 0.16); },
  };

  /* ---------- helpers ---------- */
  function hash(n) {
    n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b);
    return (n ^ (n >>> 13)) >>> 0;
  }
  function rnd(seed) {
    return function () {
      seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0;
      return seed / 4294967296;
    };
  }
  function seedOf(s) {
    let n = 2166136261;
    for (let i = 0; i < s.length; i++) n = Math.imul(n ^ s.charCodeAt(i), 16777619);
    return n >>> 0;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexA(h, a) {
    const n = (h || "#ffffff").replace("#", "");
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lerpC(a, b, t) {
    const P = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const A = P(a), B = P(b);
    return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`;
  }
  function roundRect(c, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  /* ---------- glow sprites (no per-frame shadowBlur) ---------- */
  const glowSprites = [];
  function makeGlows() {
    for (let i = 0; i < C.COLORS.length; i++) {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const x = c.getContext("2d");
      const col = C.COLORS[i].glow;
      const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
      g.addColorStop(0, hexA("#fff8e0", 0.95));
      g.addColorStop(0.2, hexA(col, 0.7));
      g.addColorStop(0.55, hexA(col, 0.22));
      g.addColorStop(1, hexA(col, 0));
      x.fillStyle = g;
      x.fillRect(0, 0, 64, 64);
      glowSprites[i] = c;
    }
  }
  makeGlows();

  let bloomCv = document.createElement("canvas");
  let bloomCtx = bloomCv.getContext("2d");
  let skyCv = document.createElement("canvas");
  let skyCtx = skyCv.getContext("2d");
  let skyKey = "";

  /* ---------- stars ---------- */
  function seedStars() {
    stars = Array.from({ length: 90 }, (_, i) => ({
      x: Math.random(),
      y: Math.random() * 0.7,
      r: 0.4 + Math.random() * 1.7,
      p: Math.random() * Math.PI * 2,
      s: 0.5 + Math.random() * 1.8,
      b: 0.35 + Math.random() * 0.65,
    }));
  }

  /* ---------- layout ---------- */
  function resize() {
    const wrap = $("#stage");
    if (!wrap) return;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    board.width = Math.max(1, w * dpr);
    board.height = Math.max(1, h * dpr);
    board.style.width = w + "px";
    board.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout(w, h);
    glowDirty = true;
    skyKey = "";
  }

  function layout(w, h) {
    if (!LV) { geo = { w, h }; return; }
    const slotBand = 70;
    const streetY = h - slotBand;
    const sky = Math.max(96, h * 0.22);
    const cityH = Math.max(80, streetY - sky - 8);
    const cs = Math.max(9, Math.min((w - 12) / LV.W, cityH / LV.H));
    const ox = (w - cs * LV.W) / 2;
    const oy = streetY - 8 - cs * LV.H;
    geo = { w, h, cs, ox, oy, sky, street: slotBand, streetY };
  }

  function cellXY(x, y) {
    return { x: geo.ox + (x + 0.5) * geo.cs, y: geo.oy + (y + 0.5) * geo.cs };
  }
  function slotPt(i) {
    const el = $$("#slots .slot")[i];
    if (!el || !geo) return { x: geo.w * (i + 0.5) / slotCount, y: geo.h - 8 };
    const r = el.getBoundingClientRect();
    const b = board.getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top - b.top + 6 };
  }

  /* ---------- decor ---------- */
  function buildDecor(L) {
    const r = rnd(seedOf(L.id + ":" + L.name));
    const th = themeOf(L);
    // connected buildings
    const seen = Array.from({ length: L.H }, () => Array(L.W).fill(false));
    const blds = [];
    const inb = (x, y) => y >= 0 && y < L.H && x >= 0 && x < L.W && L.grid[y][x];
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        if (!inb(x, y) || seen[y][x]) continue;
        const cells = [];
        const q = [[x, y]];
        seen[y][x] = true;
        let x0 = x, y0 = y, x1 = x, y1 = y;
        while (q.length) {
          const [cx, cy] = q.pop();
          cells.push([cx, cy]);
          x0 = Math.min(x0, cx); y0 = Math.min(y0, cy);
          x1 = Math.max(x1, cx); y1 = Math.max(y1, cy);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = cx + dx, ny = cy + dy;
            if (inb(nx, ny) && !seen[ny][nx]) { seen[ny][nx] = true; q.push([nx, ny]); }
          }
        }
        const wall = th.wall[(blds.length) % th.wall.length];
        blds.push({
          cells, x0, y0, x1, y1,
          wall, wall2: lerpC(wall, "#000000", 0.25),
          roof: (r() * 5) | 0,
          tower: r() > 0.55,
          antenna: r() > 0.4,
          ac: 1 + ((r() * 3) | 0),
          sign: th.signs[blds.length % th.signs.length],
          signY: y0 + 1 + ((r() * Math.max(1, (y1 - y0 - 2))) | 0),
          pipe: r() > 0.35,
        });
      }
    }
    function makeSky(count, hMin, hMax, dark, startX) {
      const arr = [];
      let x = startX;
      for (let i = 0; i < count && x < 1.12; i++) {
        const w = 0.045 + r() * 0.09;
        const h = hMin + r() * (hMax - hMin);
        const wins = [];
        const cols = 2 + ((r() * 4) | 0);
        const rows = 4 + ((r() * 8) | 0);
        for (let j = 0; j < cols * rows; j++) if (r() > 0.28) wins.push(j);
        arr.push({
          x, w, h, roof: (r() * 4) | 0,
          wall: lerpC(th.wall[0], dark, 0.25 + r() * 0.35),
          edge: lerpC(th.wall[1] || th.wall[0], "#8a90b0", 0.12),
          cols, rows, wins, lit: 0.45 + r() * 0.5,
          spire: r() > 0.65,
        });
        x += w + 0.004 + r() * 0.02;
      }
      return arr;
    }
    const skylineFar = makeSky(16, 0.58, 1.12, "#0a0a18", -0.02);
    const skylineMid = makeSky(12, 0.32, 0.72, "#12101c", -0.05);
    const lamps = [];
    for (let i = 0; i < 5; i++) lamps.push({ t: (i + 0.5) / 5 + (r() - 0.5) * 0.06 });
    return { blds, skylineFar, skylineMid, lamps, seed: r };
  }

  /* ---------- menu ---------- */
  function openMenu() {
    screen = "menu";
    LV = null;
    $("#game").hidden = true;
    $("#menu").hidden = false;
    renderMenu();
  }

  function renderMenu() {
    const cleared = Object.keys(save.stars).length;
    const prog = $("#progress");
    if (prog) prog.textContent = save.all ? `已入睡 ${cleared} / ${C.LEVELS.length} 座城 · 测试解锁` : `已入睡 ${cleared} / ${C.LEVELS.length} 座城`;
    const box = $("#levels");
    box.innerHTML = "";
    C.LEVELS.forEach((L, i) => {
      const open = isOpenLevel(i);
      const b = document.createElement("button");
      const starsN = save.stars[i] || 0;
      b.className = "card" + (starsN ? " done" : "") + (open && !starsN && i === save.unlocked - 1 ? " start" : "") + (open ? "" : " locked");
      b.type = "button";
      const cv = document.createElement("canvas");
      cv.width = 280;
      cv.height = 150;
      drawThumb(cv, L, open);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<span class="no">第 ${i + 1} 关 · ${L.tier}</span><strong>${L.name}</strong>`;
      if (!open) meta.innerHTML += `<span class="lock">锁</span>`;
      else if (starsN) meta.innerHTML += `<span class="star">${"★".repeat(starsN)}${"☆".repeat(3 - starsN)}</span>`;
      b.append(cv, meta);
      b.onclick = () => {
        if (!open) { /* stay */ return; }
        openLevel(i);
      };
      box.appendChild(b);
    });
  }

  function drawThumb(cv, L, open) {
    const c = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const th = themeOf(L);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky0);
    g.addColorStop(1, th.sky2);
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    c.fillStyle = "rgba(255,255,255,.5)";
    for (let i = 0; i < 16; i++) c.fillRect((i * 47) % W, (i * 29) % (H * 0.4), 1.4, 1.4);
    const cs = Math.min((W - 16) / L.W, (H - 22) / L.H);
    const ox = (W - cs * L.W) / 2, oy = 12 + (H - 22 - cs * L.H);
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        const cell = L.grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        c.fillStyle = th.wall[0];
        c.fillRect(px, py, cs + 0.5, cs + 0.5);
        if (cell.on || cell.dormant) {
          c.fillStyle = cell.dormant ? "rgba(40,40,60,.8)" : C.COLORS[cell.c].fill;
          c.globalAlpha = open ? 1 : 0.45;
          c.fillRect(px + 0.8, py + 0.8, Math.max(1, cs - 1.6), Math.max(1, cs - 1.6));
          c.globalAlpha = 1;
        }
      }
    }
  }

  function openLevel(i, force) {

    over = false;
    won = false;
    paused = false;
    history = [];
    usedRewind = false;
    usedAd = false;
    workers = [];
    parts = [];
    afterglow = [];
    lah = [];
    meteors = [];
    playTime = 0;
    startTotal = C.leftCount(grid);

    winTimer = 0;
    takes = 0;
    shakeT = 0;
    glowDirty = true;

  function snapshot() {
    return {
      grid: C.cloneGrid(grid),
      cols: C.cloneCols(cols),
      slots: C.cloneSlots(slots),
      unlocked: { ...unlocked },
      slotCount, takes,
    };

  function restore(s) {
    grid = C.cloneGrid(s.grid);
    cols = C.cloneCols(s.cols);
    slots = C.cloneSlots(s.slots);
    for (const sl of slots) if (sl) { sl._busy = false; sl._wait = false; }
    unlocked = { ...s.unlocked };
    slotCount = s.slotCount;
    takes = s.takes || 0;
    workers = [];
    parts = [];
    over = false;
    won = false;
    paused = false;
    glowDirty = true;
    $("#loseBox").hidden = true;
    renderSlots();
    renderTray();
    updateHud();
    resize();

  function startCoach() {
    coach = { i: 0, wait: 0 };
    showCoach();
  }
  function coachPick() {
    const u = C.frontsUseful(grid, cols, unlocked, takes);
    return u.length ? u[0] : 0;
  }
  function showCoach() {
    const el = $("#coach");
    if (!coach || over || won) { el.hidden = true; return; }
    const steps = [
      { k: "tap", html: "点<b>最前排</b>的工单，派出同色的小电工" },
      { k: "read", html: "小电工只会关<b>露在外面</b>的灯，从外往里、从上往下" },
      { k: "read", html: "电闸只有 <b>5</b> 个槽。关不到的颜色会占着，<b>全堵住就电网过载了</b>" },
    ];
    const s = steps[coach.i];
    if (!s) { el.hidden = true; coach = null; toast("把整座城的灯关完就过关，晚安。", true); return; }
    el.hidden = false;
    el.innerHTML = `<div class="bubble">${s.html}${s.k === "read" ? '<div class="next">点一下继续</div>' : ""}</div>`;
    $$(".box").forEach((b) => b.classList.remove("point"));
    if (s.k === "tap") {
      const ci = coachPick();
      const btn = $(`.tcol[data-c="${ci}"] .box[data-k="0"]`);
      if (btn) btn.classList.add("point");
    }
  }
  function coachNext() {
    if (!coach) return;
    coach.i++;
    showCoach();
  }
  function coachBlocks(ci) {
    if (!coach) return false;
    const steps = ["tap", "read", "read"];
    const k = steps[coach.i];
    if (!k || k === "read") return k === "read";
    return ci !== coachPick();
  }

  /* ---------- hud / tray / slots ---------- */

    if (!LV) return;

  function renderSlots() {

      if (s) {

        } else {

  function renderTray() {

  function toast(msg, soft) {

  function flyCard(fromEl, color, text, ink) {
    if (!fromEl) return;
    const r = fromEl.getBoundingClientRect();
    // snapshot dest before renderSlots replaces the nodes
    const dest = $$("#slots .slot").find((s) => !s.classList.contains("full")) || $("#slots .slot");
    const d = dest ? dest.getBoundingClientRect() : r;
    const el = document.createElement("div");
    el.className = "fly";
    el.style.left = r.left + "px";
    el.style.top = r.top + "px";
    el.style.width = r.width + "px";
    el.style.height = r.height + "px";
    el.style.background = color;
    el.style.color = ink;
    el.style.fontSize = "18px";
    el.textContent = text;
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.left = d.left + "px";
      el.style.top = d.top + "px";
      el.style.transform = "scale(0.88)";
      el.style.opacity = "0.2";

    setTimeout(() => el.remove(), 420);

  /* ---------- interaction ---------- */
  function tapBox(ci, k) {
    if (over || won || paused) return;
    if (coach && coachBlocks(ci)) return;
    if (k > 0) return;
    if (!cols[ci] || !cols[ci][0]) return;
    const t0 = cols[ci][0];
    if (!C.canPlaceTicket(slots, slotCount, t0)) {
      toast(t0.duo ? "这块大招牌要两个挨着的槽" : "电闸槽满了");
      SFX.wait();
      return;
    }
    const from = $(`.tcol[data-c="${ci}"] .box[data-k="0"]`);
    const colr = C.COLORS[t0.c];
    flyCard(from, t0.hidden ? "#3a3558" : colr.fill, t0.hidden ? "?" : String(t0.n), t0.hidden ? "#dcd6ff" : colr.ink);
    history.push(snapshot());
    if (history.length > 24) history.shift();
    const revealed = t0.hidden;
    C.place(cols, slots, ci, slotCount);
    takes++;
    SFX.seat();
    SFX.tap();
    if (revealed) toast("工单现形：" + C.COLORS[slots.find((s) => s && s.c === t0.c && !s.hold).c].name, true);
    if (coach && coach.i === 0) coachNext();
    renderTray();
    renderSlots();
    updateHud();
  }

  function spawnWorker(si, target) {
    const start = slotPt(si);
    const dest = cellXY(target.x, target.y);
    const streetY = geo.streetY;
    const go = [
      { x: start.x, y: start.y },
      { x: start.x, y: streetY },
      { x: dest.x, y: streetY },
      { x: dest.x, y: dest.y },
    ];
    workers.push({
      si, color: slots[si].c, tx: target.x, ty: target.y,
      path: go, s: 0, len: polyLen(go), st: "go", t: 0,
      x: start.x, y: start.y, a: -Math.PI / 2, ph: Math.random() * 6,
      kind: si % 2 === 0 ? "van" : "climb",
      vanX: dest.x,
    });
    slots[si]._busy = true;
    slots[si]._wait = false;
  }

  function polyLen(pts) {
    let n = 0;
    for (let i = 1; i < pts.length; i++) n += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return n;
  }
  function atPoly(pts, s) {
    let left = s;
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (left <= d || i === pts.length - 1) {
        const k = d ? left / d : 1;
        const x = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k;
        const y = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k;
        const a = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
        return { x, y, a };
      }
      left -= d;
    }
    const last = pts[pts.length - 1];
    return { x: last.x, y: last.y, a: 0 };
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < (n || 10); i++) {
      parts.push({
        x, y,
        vx: (Math.random() - 0.5) * 160,
        vy: -Math.random() * 140 - 20,
        life: 0.35 + Math.random() * 0.28,
        max: 0.65,
        c: col,
        sz: 1.6 + Math.random() * 2.6,
      });
    }
  }

  function step(dt) {
    if (over || paused || !LV || !geo) {
      if (won && winTimer > 0) {
        winTimer -= dt;
        if (winTimer <= 0) showWin();
      }
      stepFx(dt);
      return;
    }
    playTime += dt;
    if (shakeT > 0) shakeT -= dt;
    const rushing = cols.every((c) => !c.length);
    const sp = rushing ? Math.max(speed, 8) : speed;

    for (let i = 0; i < slotCount; i++) {
      const s = slots[i];
      if (s && s._busy && !workers.some((w) => w.si === i)) s._busy = false;
      if (!s || s.n <= 0 || s._busy || s.hold) continue;
      const t = C.findTarget(grid, s.c, unlocked, takes);
      if (!t) {
        if (!s._wait) {
          s._wait = true;
          const anyBlink = (function () {
            for (const row of grid) for (const c of row) if (c && c.on && c.c === s.c && c.blink) return true;
            return false;
          })();
          toast(anyBlink && takes % 2 === 0 ? "灯笼还在亮着，等它暗下去再关" : "这种颜色还埋在里面，小电工在等", true);
        }
        continue;
      }
      spawnWorker(i, t);
    }

    const climb = geo.cs * 22 * sp;
    for (let k = workers.length - 1; k >= 0; k--) {
      const w = workers[k];
      w.ph += dt * 16;
      if (w.st === "go") {
        w.s = Math.min(w.len, w.s + climb * dt);
        const p = atPoly(w.path, w.s);
        w.x = p.x; w.y = p.y; w.a = p.a;
        if (w.s >= w.len - 0.1) { w.st = "work"; w.t = 0; }
      } else if (w.st === "work") {
        w.t += dt * sp;
        if (w.t > 0.08 && !w.did) {
          w.did = true;
          const cell = grid[w.ty][w.tx];
          if (cell && cell.on && cell.c === w.color) {
            const wasKey = !!cell.key;
            const kind = cell.kind;
            const willAwaken = !!(cell.awaken && cell.awaken.length);
            C.turnOff(grid, { x: w.tx, y: w.ty }, unlocked);
            glowDirty = true;
            const col = C.COLORS[w.color].glow;
            burst(w.x, w.y, col, 12);
            afterglow.push({ x: w.x, y: w.y, c: col, t: 1 });
            shakeT = Math.max(shakeT, 0.08);
            SFX.spark();
            SFX.off();
            if (wasKey) {
              SFX.unlock();
              const msg = kind === "button" ? "叮，电梯门开了，中间几层能关了"
                : kind === "breaker" ? "总闸拉开了，整片都有电了"
                : kind === "beacon" ? "航标灭了，那边解锁了"
                : kind === "switch" ? "开关一拉，有些灯亮起来了"
                : "咔哒，锁开了";
              toast(msg, true);
            }
            if (willAwaken) {
              SFX.awaken();
              if (!wasKey) toast("那边一下子亮起来了", true);
            }
            if (slots[w.si]) slots[w.si].n--;
          }
        }
        if (w.t > 0.16) {
          const s = slots[w.si];
          if (s && s.n > 0) {
            const nxt = C.findTarget(grid, s.c, unlocked, takes);
            if (nxt) {
              const dest = cellXY(nxt.x, nxt.y);
              const go = [{ x: w.x, y: w.y }, { x: dest.x, y: w.y }, { x: dest.x, y: dest.y }];
              w.tx = nxt.x; w.ty = nxt.y;
              w.path = go; w.s = 0; w.len = polyLen(go); w.st = "go"; w.t = 0; w.did = false;
            } else {
              w.st = "back"; w.t = 0;
              const sp0 = slotPt(w.si);
              w.path = [{ x: w.x, y: w.y }, { x: w.x, y: geo.streetY }, { x: sp0.x, y: geo.streetY }, { x: sp0.x, y: sp0.y }];
              w.s = 0; w.len = polyLen(w.path);
            }
          } else {
            w.st = "back"; w.t = 0;
            const sp0 = slotPt(w.si);
            w.path = [{ x: w.x, y: w.y }, { x: w.x, y: geo.streetY }, { x: sp0.x, y: geo.streetY }, { x: sp0.x, y: sp0.y }];
            w.s = 0; w.len = polyLen(w.path);
          }
        }
      } else if (w.st === "back") {
        w.s = Math.min(w.len, w.s + climb * 1.15 * dt);
        const p = atPoly(w.path, w.s);
        w.x = p.x; w.y = p.y; w.a = p.a;
        if (w.s >= w.len - 0.1) {
          if (slots[w.si]) slots[w.si]._busy = false;
          workers.splice(k, 1);
        }
      }
    }

    for (let i = 0; i < slotCount; i++) {
      if (slots[i] && slots[i].n <= 0 && !slots[i].hold && !slots[i]._busy && !workers.some((w) => w.si === i && w.st !== "back")) {
        const pt = slotPt(i);
        lah.push({ x: pt.x, y: pt.y - 12, t: 0.7, text: "啦" });
        if (slots[i].duo && slots[i].pair != null) slots[slots[i].pair] = null;
        slots[i] = null;
        SFX.pop();
      }
    }

    const left = C.leftCount(grid);
    const busy = workers.length > 0;
    if (left === 0 && !busy && !won) {
      won = true;
      winTimer = 0.55;
    } else if (!won && !busy && C.isLost(grid, cols, slots, slotCount, unlocked, takes)) {
      showLose();
    }

    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) $("#toast").classList.remove("show");
    }
    if (winTimer > 0) {
      winTimer -= dt;
      if (winTimer <= 0) showWin();
    }
    stepFx(dt);
    const sig = slots.map((s) => (s ? s.c + ":" + s.n + (s._wait ? "w" : "") : "-")).join("|") + "#" + slotCount;
    if (sig !== step._slotSig) { step._slotSig = sig; renderSlots(); updateHud(); }
    else if (Math.floor(playTime * 8) !== step._hudN) { step._hudN = Math.floor(playTime * 8); updateHud(); }
  }

  function stepFx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = afterglow.length - 1; i >= 0; i--) {
      afterglow[i].t -= dt * 2.6;
      if (afterglow[i].t <= 0) afterglow.splice(i, 1);
    }
    for (let i = lah.length - 1; i >= 0; i--) {
      lah[i].t -= dt;
      if (lah[i].t <= 0) lah.splice(i, 1);
    }
    if (LV && Math.random() < dt * (0.15 + darkK() * 0.6) && meteors.length < 2) {
      meteors.push({ x: 0.1 + Math.random() * 0.7, y: 0.02 + Math.random() * 0.12, vx: 0.25 + Math.random() * 0.2, vy: 0.18 + Math.random() * 0.12, t: 0.7 });
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.t -= dt;
      if (m.t <= 0 || m.x > 1.2) meteors.splice(i, 1);
    }
    cars.forEach((c) => {
      c.t += c.v * c.dir * dt;
      if (c.t > 1.15) { c.t = -0.1; }
      if (c.t < -0.15) { c.t = 1.1; }
    });
  }

  function showLose() {
    if (over || won) return;
    over = true;
    SFX.lose();
    $("#loseRw").hidden = usedRewind || history.length === 0;
    $("#loseBox").hidden = false;
  }
  function showWin() {
    over = true;
    won = true;
    const starsN = (usedRewind && usedAd) ? 1 : (usedRewind || usedAd) ? 2 : 3;
    const prev = save.stars[li] || 0;
    if (starsN > prev) save.stars[li] = starsN;
    if (save.unlocked < li + 2) save.unlocked = Math.min(C.LEVELS.length, li + 2);
    persist();
    SFX.win();
    if (LV && LV.theme === "newyear") {
      for (let i = 0; i < 40; i++) {
        const col = C.COLORS[i % 6].glow;
        burst(geo.w * (0.2 + Math.random() * 0.6), geo.sky * (0.3 + Math.random() * 0.4), col, 8);
      }
    }
    $("#winBox").hidden = false;
    $("#winNext").hidden = li >= C.LEVELS.length - 1;
    $("#winTitle").textContent = "晚安";
    const starEl = $("#winStars");
    if (starEl) starEl.innerHTML = "★".repeat(starsN) + `<span class="dim">${"★".repeat(3 - starsN)}</span>`;
    $("#winSub").textContent = (LV.quote || "城市已入睡。") + " · " + LV.name;
  }

  function rewind() {
    if (usedRewind || !history.length) return;
    usedRewind = true;
    const steps = Math.min(3, history.length);
    let s = null;
    for (let i = 0; i < steps; i++) s = history.pop();
    restore(s);
    toast("时光倒流，回到 " + steps + " 步之前", true);
  }

  function addSlotFromAd() {
    if (slotCount >= 7) { toast("槽位已经加满了", true); return; }
    slotCount++;
    slots.push(null);
    usedAd = true;
    over = false;
    won = false;
    $("#loseBox").hidden = true;
    renderSlots();
    toast("多了一个电闸槽", true);
    SFX.seat();
  }
  function openAd() {
    adFor = "slot";
    adLeft = 5;
    $("#adBox").hidden = false;
    $("#adSec").textContent = "5";
  }
  function tickAd(dt) {
    if ($("#adBox").hidden) return;
    adLeft -= dt;
    const n = Math.max(0, Math.ceil(adLeft));
    $("#adSec").textContent = String(n);
    if (adLeft <= 0) {
      $("#adBox").hidden = true;
      addSlotFromAd();
    }
  }

  /* ---------- render ---------- */
  function darkK() {
    if (!LV) return 0;
    const left = C.leftCount(grid);
    return 1 - left / Math.max(1, startTotal);
  }

  function draw() {
    if (!geo) return;
    const { w, h } = geo;
    const k = LV ? darkK() : 0;
    const th = themeOf(LV);
    ctx.save();
    if (shakeT > 0) {
      const s = shakeT * 10;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, lerpC(th.sky0, "#050510", k * 0.75));
    g.addColorStop(0.5, lerpC(th.sky1, "#070616", k * 0.75));
    g.addColorStop(1, lerpC(th.sky2, "#06050e", k * 0.8));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // milky way — soft dust, no hard polygon
    if (k > 0.15) {
      ctx.save();
      ctx.globalAlpha = (k - 0.15) * 0.55;
      const yy0 = (geo.sky || 80) * 0.15;
      for (let i = 0; i < 80; i++) {
        const u = i / 80;
        const px = w * (0.05 + u * 0.85);
        const py = yy0 + u * (geo.sky || 80) * 0.7 + Math.sin(i * 1.7) * 10;
        const rr = (i % 5 === 0) ? 1.6 : 0.7;
        ctx.fillStyle = "rgba(220,230,255," + (0.15 + (i % 7) * 0.05) + ")";
        ctx.beginPath();
        ctx.arc(px, py, rr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const starA = 0.2 + 0.8 * k;
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(playTime * s.s + s.p);
      ctx.globalAlpha = starA * s.b * tw;
      ctx.fillStyle = "#fff8e8";
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * (geo.sky || h * 0.3) * 1.35, s.r * (0.7 + 0.6 * k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const m of meteors) {
      ctx.strokeStyle = `rgba(255,245,220,${Math.max(0, m.t)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(m.x * w, m.y * h);
      ctx.lineTo((m.x - m.vx * 0.12) * w, (m.y - m.vy * 0.12) * h);
      ctx.stroke();
    }

    // moon
    const mx = w * 0.82, my = (geo.sky || 80) * 0.38;
    const mr = 16 + 12 * k;
    ctx.fillStyle = `rgba(255,244,214,${0.5 + 0.45 * k})`;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(230,214,170,${0.25 + 0.2 * k})`;
    ctx.beginPath(); ctx.arc(mx - mr * 0.28, my - mr * 0.18, mr * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr * 0.22, my + mr * 0.2, mr * 0.14, 0, Math.PI * 2); ctx.fill();

    // warm fog, fades as city sleeps
    if (th.fog) {
      ctx.fillStyle = th.fog.replace(/[\d.]+\)$/, (0.22 * (1 - k * 0.85)).toFixed(3) + ")");
      // fog string may not match; fallback
      const fogA = 0.18 * (1 - k * 0.85);
      const fg = ctx.createLinearGradient(0, (geo.sky || 80), 0, (geo.streetY || h));
      fg.addColorStop(0, hexA(th.accent, 0));
      fg.addColorStop(0.55, hexA(th.accent, fogA * 0.45));
      fg.addColorStop(1, hexA(th.accent, fogA));
      ctx.fillStyle = fg;
      ctx.fillRect(0, 0, w, h);
    }

    drawSkyline(k, th);
    if (LV && grid) drawCity(k, th);
    drawStreet(k, th);

    for (const a of afterglow) {
      ctx.globalAlpha = Math.max(0, a.t);
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.arc(a.x, a.y, 6 + (1 - a.t) * 8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;

    if (LV && grid) workers.forEach(drawWorker);

    for (const t of lah) {
      ctx.globalAlpha = Math.max(0, t.t / 0.7);
      ctx.fillStyle = "#fff4c0";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(t.text, t.x, t.y - (0.7 - t.t) * 28);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
    ctx.restore();
  }

  function drawSkyline(k, th) {
    if (!decor || !geo) return;
    const key = (LV && LV.id) + ":" + ((k * 8) | 0) + ":" + geo.w + ":" + geo.h;
    if (skyKey !== key) {
      skyCv.width = Math.max(1, geo.w);
      skyCv.height = Math.max(1, geo.h);
      skyCtx.clearRect(0, 0, skyCv.width, skyCv.height);
      const streetY = geo.streetY || geo.h - 70;
      const horizon = streetY - 6;
      const fill = skyCtx;
      const paint = (list, heightMul, winA, shade) => {
        for (const b of list) {
          const x = b.x * geo.w;
          const bw = Math.max(8, b.w * geo.w);
          const bh = b.h * horizon * heightMul;
          const y = horizon - bh;
          fill.fillStyle = lerpC(b.wall, "#050508", shade + k * 0.25);
          fill.fillRect(x, y, bw, bh + 2);
          // left highlight so silhouettes read against the sky
          fill.fillStyle = hexA(b.edge || "#8890aa", 0.18);
          fill.fillRect(x, y, 1.4, bh);
          if (b.roof === 0) {
            fill.fillStyle = lerpC(b.wall, "#050508", shade + k * 0.25);
            fill.beginPath();
            fill.moveTo(x - 1, y);
            fill.lineTo(x + bw / 2, y - Math.min(16, bw * 0.35));
            fill.lineTo(x + bw + 1, y);
            fill.fill();
          } else if (b.roof === 1 || b.spire) {
            fill.fillStyle = lerpC(b.wall, "#050508", shade);
            fill.fillRect(x + bw * 0.42, y - 16, Math.max(2, bw * 0.12), 16);
            if (b.spire) {
              fill.fillStyle = hexA(th.accent, 0.45 * (1 - k * 0.5));
              fill.fillRect(x + bw * 0.42 + 0.5, y - 18, 2, 2);
            }
          } else if (b.roof === 2) {
            fill.fillStyle = lerpC(b.wall, "#050508", shade);
            fill.fillRect(x, y - 5, bw, 5);
          }
          const cw = bw / (b.cols + 1), ch = bh / (b.rows + 2);
          fill.fillStyle = hexA(th.accent, winA * b.lit * (1 - k * 0.7));
          for (const i of b.wins) {
            const cx = i % b.cols, cy = (i / b.cols) | 0;
            fill.fillRect(x + cw * (cx + 0.45), y + ch * (cy + 0.8), Math.max(1.4, cw * 0.5), Math.max(1.4, ch * 0.5));
          }
        }
      };
      paint(decor.skylineFar || [], 0.92, 0.28, 0.35);
      paint(decor.skylineMid || decor.skyline || [], 0.78, 0.5, 0.12);
      skyKey = key;
    }
    ctx.drawImage(skyCv, 0, 0);
  }

  function drawCity(k, th) {
    const { cs, ox, oy } = geo;
    // facades first
    if (decor) {
      for (const b of decor.blds) {
        const x = ox + b.x0 * cs, y = oy + b.y0 * cs;
        const bw = (b.x1 - b.x0 + 1) * cs, bh = (b.y1 - b.y0 + 1) * cs;
        ctx.fillStyle = b.wall;
        ctx.fillRect(x - 2, y - 2, bw + 4, bh + 6);
        // left pipe
        if (b.pipe) {
          ctx.fillStyle = "#2a2a38";
          ctx.fillRect(x - 4, y + 8, 3, bh - 10);
        }
        // roof
        ctx.fillStyle = lerpC(b.wall2, th.accent, 0.08);
        const rx = x - 3, ry = y, rw = bw + 6;
        if (b.roof === 0) {
          ctx.beginPath();
          ctx.moveTo(rx - 2, ry);
          ctx.lineTo(rx + rw / 2, ry - Math.min(18, cs * 1.4));
          ctx.lineTo(rx + rw + 2, ry);
          ctx.closePath();
          ctx.fill();
        } else if (b.roof === 1) {
          ctx.fillRect(rx, ry - 6, rw, 6);
          ctx.fillStyle = b.wall2;
          ctx.fillRect(rx + rw * 0.35, ry - 16, rw * 0.3, 10);
        } else if (b.roof === 2) {
          ctx.fillRect(rx, ry - 5, rw, 5);
          if (b.tower) {
            ctx.fillStyle = "#2a2838";
            ctx.fillRect(rx + rw * 0.6, ry - 20, cs * 0.7, 16);
            ctx.beginPath(); ctx.arc(rx + rw * 0.6 + cs * 0.35, ry - 20, cs * 0.38, Math.PI, 0); ctx.fill();
          }
        } else if (b.roof === 3) {
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx + 4, ry - 8);
          ctx.lineTo(rx + rw - 4, ry - 8);
          ctx.lineTo(rx + rw, ry);
          ctx.fill();
        } else {
          ctx.fillRect(rx, ry - 4, rw, 4);
        }
        if (b.antenna) {
          ctx.strokeStyle = "#4a4860";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x + bw * 0.2, y - 4);
          ctx.lineTo(x + bw * 0.2, y - 18 - (cs > 12 ? 6 : 0));
          ctx.stroke();
          ctx.fillStyle = hexA(th.accent, 0.5 + 0.5 * Math.sin(playTime * 3 + b.x0));
          ctx.beginPath(); ctx.arc(x + bw * 0.2, y - 18, 1.8, 0, Math.PI * 2); ctx.fill();
        }
        // AC units
        ctx.fillStyle = "#2a3040";
        for (let i = 0; i < b.ac; i++) {
          const ax = x + 4 + i * Math.max(10, cs * 1.1);
          const ay = oy + (b.y1 + 0.15) * cs - 5;
          if (ax < x + bw - 8) ctx.fillRect(ax, ay, 8, 5);
        }
        // neon sign
        if (b.sign && bw > cs * 2) {
          const sy = oy + b.signY * cs + 2;
          ctx.save();
          ctx.font = `bold ${Math.max(8, cs * 0.55)}px "PingFang SC","Noto Sans SC",sans-serif`;
          ctx.fillStyle = hexA(th.accent, 0.25 + 0.55 * (1 - k));
          ctx.textAlign = "center";
          ctx.fillText(b.sign, x + bw / 2, sy);
          ctx.restore();
        }
      }
    }

    // bloom of playable lights
    const sig = lightKey();
    if (glowDirty || sig !== lightSig) {
      rebuildBloom();
      lightSig = sig;
      glowDirty = false;
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.85;
    ctx.drawImage(bloomCv, 0, 0, geo.w, geo.h);
    ctx.restore();

    // windows
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const cell = grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        const pad = Math.max(1, cs * 0.16);
        const locked = cell.lock && !unlocked[cell.lock];
        const blinkDim = cell.blink && (takes % 2 === 1);
        const style = hash(x * 73 + y * 911 + seedOf(LV.id)) % 5;

        // shutter overlay later
        if (cell.dormant) {
          ctx.fillStyle = "rgba(18,16,30,0.95)";
          ctx.fillRect(px + pad, py + pad, cs - pad * 2, cs - pad * 2);
          ctx.strokeStyle = "rgba(80,80,110,0.35)";
          ctx.strokeRect(px + pad, py + pad, cs - pad * 2, cs - pad * 2);
          continue;
        }
        if (!cell.on) {
          ctx.fillStyle = "rgba(10,10,20,0.92)";
          ctx.fillRect(px + pad * 0.8, py + pad * 0.8, cs - pad * 1.6, cs - pad * 1.6);
          continue;
        }
        const col = C.COLORS[cell.c];
        let a = locked ? 0.28 : 1;
        if (cell.blink) a *= blinkDim ? 0.35 : 1;
        ctx.globalAlpha = a;
        ctx.fillStyle = col.fill;
        const wx = px + pad, wy = py + pad, ww = cs - pad * 2, wh = cs - pad * 2;
        if (style === 1) {
          ctx.fillRect(wx, wy, ww, wh);
          ctx.fillStyle = "rgba(10,8,20,0.35)";
          ctx.fillRect(wx + ww / 2 - 0.6, wy, 1.2, wh);
          ctx.fillRect(wx, wy + wh / 2 - 0.6, ww, 1.2);
        } else if (style === 2) {
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(wx, wy, ww, wh, 2) : ctx.rect(wx, wy, ww, wh);
          ctx.fill();
        } else if (style === 3) {
          const tw = ww / 3;
          for (let i = 0; i < 3; i++) ctx.fillRect(wx + i * tw + 0.4, wy, tw - 0.8, wh);
        } else if (style === 4) {
          ctx.fillRect(wx, wy, ww, wh * 0.45);
          ctx.fillRect(wx, wy + wh * 0.55, ww, wh * 0.45);
        } else {
          ctx.fillRect(wx, wy, ww, wh);
        }
        ctx.globalAlpha = 1;
        // special kinds
        if (cell.key || cell.kind === "button" || cell.kind === "breaker" || cell.kind === "switch" || cell.kind === "beacon") {
          ctx.strokeStyle = "#fff4c0";
          ctx.lineWidth = 1.2;
          ctx.strokeRect(wx - 1, wy - 1, ww + 2, wh + 2);
          ctx.fillStyle = "#fff8e0";
          ctx.font = `bold ${Math.max(7, cs * 0.42)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const mark = cell.kind === "breaker" ? "闸" : cell.kind === "button" ? "梯" : cell.kind === "switch" ? "开" : cell.kind === "beacon" ? "标" : "钥";
          ctx.fillText(mark, px + cs / 2, py + cs / 2);
          ctx.textBaseline = "alphabetic";
        }
        if (cell.kind === "sign" && cell.on) {
          ctx.fillStyle = hexA("#fff4c0", 0.35 + 0.25 * Math.sin(playTime * 4 + x));
          ctx.fillRect(wx, wy, ww, 1.5);
        }
        if (cell.kind === "shutter" && locked) {
          ctx.fillStyle = "rgba(20,22,30,0.72)";
          ctx.fillRect(px, py, cs, cs);
          ctx.strokeStyle = "rgba(70,80,100,0.8)";
          ctx.lineWidth = 1;
          for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(px, py + (cs * i) / 4);
            ctx.lineTo(px + cs, py + (cs * i) / 4);
            ctx.stroke();
          }
        }
        if (locked && cell.kind === "zone") {
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.fillRect(px, py, cs, cs);
        }
      }
    }
    ctx.textAlign = "left";
  }

  function lightKey() {
    if (!grid) return "";
    let s = takes + ":";
    for (const row of grid) for (const c of row) s += c && c.on ? (c.c + (c.blink ? "b" : "") + (c.lock && !unlocked[c.lock] ? "L" : "")) : ".";
    return s;
  }
  function rebuildBloom() {
    const scale = 0.35;
    bloomCv.width = Math.max(1, (geo.w * scale) | 0);
    bloomCv.height = Math.max(1, (geo.h * scale) | 0);
    bloomCtx.clearRect(0, 0, bloomCv.width, bloomCv.height);
    if (!grid || !LV) return;
    const { cs, ox, oy } = geo;
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on) continue;
        if (cell.lock && !unlocked[cell.lock]) continue;
        if (cell.blink && takes % 2 === 1) continue;
        const px = (ox + (x + 0.5) * cs) * scale;
        const py = (oy + (y + 0.5) * cs) * scale;
        const spr = glowSprites[cell.c];
        const sz = cs * 3.2 * scale;
        bloomCtx.drawImage(spr, px - sz / 2, py - sz / 2, sz, sz);
      }
    }
  }

  function drawStreet(k, th) {
    const y = geo.streetY || geo.h - 70;
    const w = geo.w, h = geo.h;
    const water = !!(LV && (LV.water || themeOf(LV).water));
    if (water) {
      const wh = 28;
      const wy = y - wh;
      const wg = ctx.createLinearGradient(0, wy, 0, y);
      wg.addColorStop(0, hexA(th.waterHi || "#2a5080", 0.0));
      wg.addColorStop(0.2, hexA(th.water || "#101c32", 0.55));
      wg.addColorStop(1, hexA(th.water || "#101c32", 0.9));
      ctx.fillStyle = wg;
      ctx.fillRect(0, wy, w, wh + 2);
      // reflections of lights
      if (grid && LV) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0, wy, w, wh); ctx.clip();
        ctx.globalAlpha = 0.5 * (1 - k * 0.25);
        ctx.translate(0, y + (y - 8) - (geo.oy + LV.H * geo.cs));
        ctx.scale(1, -0.45);
        // rough: draw colored strips under buildings
        for (let yy = 0; yy < LV.H; yy++) {
          for (let xx = 0; xx < LV.W; xx++) {
            const cell = grid[yy][xx];
            if (!cell || !cell.on) continue;
            if (cell.lock && !unlocked[cell.lock]) continue;
            ctx.fillStyle = C.COLORS[cell.c].fill;
            const px = geo.ox + xx * geo.cs, py = geo.oy + yy * geo.cs;
            ctx.fillRect(px, py, geo.cs, geo.cs);
          }
        }
        ctx.restore();
        // ripples
        ctx.strokeStyle = hexA("#c8e4ff", 0.12);
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const ry = wy + 4 + i * 5 + Math.sin(playTime * 1.4 + i) * 1.2;
          ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(w, ry); ctx.stroke();
        }
      }
    }
    // quay / pavement
    ctx.fillStyle = "#12101c";
    ctx.fillRect(0, y - 3, w, 6);
    ctx.fillStyle = "#1a1730";
    ctx.fillRect(0, y, w, h - y);
    // lamps
    if (decor) {
      for (const lp of decor.lamps) {
        const lx = lp.t * w;
        ctx.fillStyle = "#2a2838";
        ctx.fillRect(lx - 1.2, y - 26, 2.4, 26);
        ctx.fillStyle = hexA("#ffd56a", 0.35 + 0.35 * (1 - k));
        ctx.beginPath(); ctx.arc(lx, y - 26, 3.2, 0, Math.PI * 2); ctx.fill();
        const lg = ctx.createRadialGradient(lx, y - 26, 1, lx, y - 26, 18);
        lg.addColorStop(0, hexA("#ffd56a", 0.25 * (1 - k * 0.5)));
        lg.addColorStop(1, hexA("#ffd56a", 0));
        ctx.fillStyle = lg;
        ctx.fillRect(lx - 18, y - 44, 36, 44);
      }
    }
    // cars
    for (const c of cars) {
      const cx = c.t * w;
      const cy = y - 4;
      ctx.fillStyle = "#1a1828";
      ctx.fillRect(cx, cy - 6, 16, 6);
      ctx.fillStyle = c.dir > 0 ? "#ff5a4a" : "#ffd56a";
      ctx.globalAlpha = 0.8;
      ctx.fillRect(c.dir > 0 ? cx : cx + 13, cy - 4, 3, 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawWorker(w) {
    const col = C.COLORS[w.color].fill;
    const onStreet = Math.abs(w.y - geo.streetY) < 20 && (w.st === "go" || w.st === "back");
    if (w.kind === "van" && (onStreet || w.st === "go" || w.st === "back" || w.st === "work")) {
      const vx = onStreet ? w.x : w.vanX;
      const vy = geo.streetY;
      if (Math.abs((onStreet ? w.x : vx) - w.vanX) < geo.w) drawVan(onStreet ? w.x : w.vanX, vy, col, w.a > 0);
    }
    ctx.save();
    ctx.translate(w.x, w.y);
    ctx.scale(1.65, 1.65);
    const walk = Math.sin(w.ph) * 2;
    // wand
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.lineTo(11, -8 + (w.st === "work" ? -2 : 0));
    ctx.stroke();
    if (w.st === "work") {
      ctx.fillStyle = "#fff4c0";
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(playTime * 30);
      ctx.beginPath(); ctx.arc(11, -10, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // toolbox
    ctx.fillStyle = "#3a2a10";
    ctx.fillRect(4, 1, 5, 4);
    ctx.fillStyle = col;
    ctx.fillRect(4, 1, 5, 1.4);
    // body
    ctx.fillStyle = "#1c1a28";
    ctx.fillRect(-4, -2 + walk * 0.2, 8, 9);
    ctx.fillStyle = "#2a4060";
    ctx.fillRect(-4, -1, 8, 4);
    // head + hat
    ctx.fillStyle = "#f1d2b0";
    ctx.beginPath(); ctx.arc(0, -5.2, 3.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd56a";
    ctx.fillRect(-3.8, -9.2, 7.6, 2.6);
    ctx.fillRect(-1.1, -11.2, 2.2, 2);
    // legs
    ctx.fillStyle = "#2a2738";
    ctx.fillRect(-3.2, 7, 2.4, 4.5 + walk);
    ctx.fillRect(1, 7, 2.4, 4.5 - walk);
    ctx.restore();
  }

  function drawVan(x, y, col, flip) {
    ctx.save();
    ctx.translate(x, y + 2);
    if (flip) ctx.scale(-1, 1);
    ctx.fillStyle = "#1a1830";
    ctx.fillRect(-14, -12, 28, 13);
    ctx.fillStyle = col;
    ctx.fillRect(-14, -12, 28, 4);
    ctx.fillStyle = "#7ee7ff";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(4, -9, 8, 4);
    ctx.globalAlpha = 1;
    // boom
    ctx.strokeStyle = "#4a4860";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(8, -22);
    ctx.stroke();
    ctx.fillStyle = "#2a2738";
    ctx.beginPath(); ctx.arc(-7, 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  /* ---------- loop ---------- */
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    acc += dt;
    tickAd(dt);
    if (screen === "game") step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- events ---------- */
  $("#backBtn").onclick = openMenu;
  $("#speedBtn").onclick = () => { if (over) return; speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; updateHud(); };
  $("#soundBtn").onclick = () => { muted = !muted; try { ac(); } catch (e) {} updateHud(); };
  $("#loseMenu").onclick = openMenu;
  $("#loseRetry").onclick = () => loadLevel(li);
  $("#winMenu").onclick = openMenu;
  $("#winRetry").onclick = () => loadLevel(li);
  $("#winNext").onclick = () => {
    const n = Math.min(C.LEVELS.length - 1, li + 1);
    if (isOpenLevel(n)) openLevel(n);
    else openMenu();
  };
  $("#loseRw").onclick = rewind;
  $("#loseAd").onclick = openAd;
  $("#adSkip").onclick = () => { $("#adBox").hidden = true; addSlotFromAd(); };
  $("#coach").onclick = () => { if (coach) coachNext(); };

  const brand = $("#brandTitle") || $(".brand h1");
  if (brand) {
    brand.addEventListener("click", () => {
      const now = Date.now();
      titleClicks = titleClicks.filter((t) => now - t < 2500);
      titleClicks.push(now);
      if (titleClicks.length >= 5) {
        titleClicks = [];
        save.all = true;
        persist();
        renderMenu();
        toast("测试用：已全部解锁", true);
      }
    });
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 80));

  /* ---------- boot ---------- */
  seedStars();
  solutions = C.LEVELS.map((L) => C.solve(L, 5));
  solutions.forEach((s, i) => {
    if (!s.ok) console.error("UNSOLVABLE", C.LEVELS[i].id);
  });
  renderMenu();
  resize();
  requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });

  window.__DEMO__ = {
    startLevel: (i) => openLevel(i, true),
    tap: (ci) => tapBox(ci, 0),
    state: () => ({
      screen, li, left: grid ? C.leftCount(grid) : 0, over, won,
      slots: slots.map((s) => (s ? { c: s.c, n: s.n, wait: !!s._wait, duo: !!s.duo, hold: !!s.hold } : null)),
      fronts: cols ? cols.map((c) => (c[0] ? { c: c[0].c, n: c[0].n, hidden: !!c[0].hidden, duo: !!c[0].duo } : null)) : [],
      slotCount, usedRewind, usedAd, takes, coach: coach && coach.i,
      name: LV && LV.name, unlocked: save.unlocked, stars: { ...save.stars }, all: save.all,
    }),
    solutions: solutions.map((s) => s.path),
    skipCoach() { coach = null; const el = document.getElementById("coach"); if (el) el.hidden = true; },
    showLose,
    setSpeed: (n) => { speed = n; if (LV) updateHud(); },
    rewind,
    addSlotFromAd,
    openAd,
    loadLevel,
    unlockAll() { save.all = true; persist(); renderMenu(); },
    COLORS: C.COLORS,
  };
})();

  </script>
</body>
