<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07061a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307061a' width='32' height='32' rx='6'/%3E%3Ccircle cx='20' cy='12' r='7' fill='%23ffd56a'/%3E%3Ccircle cx='16' cy='10' r='6' fill='%2307061a'/%3E%3Crect x='8' y='20' width='3' height='3' fill='%23ffd56a'/%3E%3Crect x='13' y='20' width='3' height='3' fill='%237ee7ff'/%3E%3Crect x='18' y='20' width='3' height='3' fill='%23ff8ab8'/%3E%3C/svg%3E" />
  <title>夜灯将眠</title>
  <style>
:root {
  --bg: #07061a;
  --panel: #12101f;
  --line: #2c2750;
  --text: #f3efe4;
  --muted: #8a84a8;
  --ink: #140d08;
  --accent: #ffd56a;
  --danger: #ff6b8a;
  --ok: #8dffc1;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus, .box:focus { outline: none; }
#app {
  width: min(430px, 100%);
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #07061a;
  box-shadow: 0 0 0 1px #1a1630;
}
#menu, #game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#menu[hidden], #game[hidden], [hidden] { display: none !important; }

/* menu */
#menu { overflow: auto; padding: 22px 16px 28px; }
.brand { text-align: center; margin-bottom: 6px; }
.brand h1 {
  font-size: 30px; letter-spacing: 0.18em; font-weight: 700; margin: 0 0 6px;
  text-shadow: 0 0 24px rgba(255, 213, 106, .28);
  cursor: default;
}
.brand p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
#progress { margin: 10px 0 0; color: var(--accent); font-size: 12px; letter-spacing: 0.08em; }
#levels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}
.card {
  appearance: none; border: 1px solid #2a2650; background: #12101f;
  border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer;
  text-align: left; display: block; width: 100%;
  transition: transform .12s ease, border-color .12s;
}
.card:active { transform: scale(0.97); }
.card canvas { display: block; width: 100%; height: auto; background: #0a0a22; }
.card .meta { display: flex; flex-direction: column; gap: 2px; padding: 7px 10px 8px; position: relative; }
.card .no { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; }
.card strong { font-size: 14px; font-weight: 700; line-height: 1.25; }
.card .star { position: absolute; right: 8px; top: 8px; color: var(--accent); font-size: 11px; letter-spacing: 1px; }
.card.start { border-color: #ffd56a; box-shadow: 0 0 0 1px rgba(255,213,106,.35); }
.card.done { border-color: #3a5a48; }
.card.locked { opacity: 0.55; cursor: default; filter: grayscale(.35); }
.card.locked .meta strong { color: var(--muted); }
.card .lock { position: absolute; right: 8px; top: 8px; font-size: 12px; opacity: .8; }

/* game hud */
.hud {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 10px 4px;
  flex: 0 0 auto;
}
.hud .icon, .hud .tool {
  appearance: none; background: #1a1730; border: 1px solid var(--line);
  border-radius: 10px; width: 34px; height: 34px; cursor: pointer;
  display: grid; place-items: center; font-size: 15px;
}
.hud .titles { flex: 1; min-width: 0; }
#lvNo { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
#lvName { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .stat {
  background: #1a1730; border: 1px solid var(--line); border-radius: 10px;
  padding: 3px 7px; text-align: right;
}
.hud .stat em { display: block; font-style: normal; font-size: 9px; color: var(--muted); }
#leftV { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
#loadRail {
  height: 3px; margin: 0 12px 4px; background: #1a1730; border-radius: 99px; overflow: hidden;
  flex: 0 0 auto;
}
#loadFill { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 8px rgba(255,213,106,.5); transition: width .2s, background .2s; }
#loadFill.hot { background: var(--danger); box-shadow: 0 0 8px rgba(255,107,138,.5); }

#stage { flex: 1; min-height: 0; position: relative; }
#board { display: block; width: 100%; height: 100%; }
#slots {
  position: absolute; left: 10px; right: 10px; bottom: 8px;
  display: grid; gap: 6px;
  pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%) translateY(-8px);
  background: #2a1630; color: #ffe8ee; border: 1px solid #6a3048;
  padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0;
  pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.soft { background: #1a2030; border-color: #3a5070; color: #e8f0ff; }

#slots.pad { min-height: 0; }
.slot {
  height: 52px; border: 1.5px dashed #3a3560; border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(40,36,70,.45), rgba(12, 10, 24, .82));
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
  position: relative;
}
.slot.full { border-style: solid; border-color: #4a4570; }
.slot.wait { border-color: #6a6080; }
.slot.duo { border-color: #ff9a4a; box-shadow: 0 0 0 1px rgba(255,154,74,.35); }
.slot.hold { border-style: solid; border-color: #ff9a4a; opacity: .85; }
.slot .box { width: 100%; height: 100%; border-radius: 9px; font-size: 20px; font-weight: 700; position: relative; }
.slot .tag {
  position: absolute; left: 4px; bottom: 2px; font-size: 8px; font-weight: 700;
  letter-spacing: 0.04em; opacity: .7;
}
.zz {
  position: absolute; right: 4px; top: 2px; font-size: 10px; font-style: normal;
  color: #3a2208; opacity: .7; font-weight: 700;
}
.sleeper {
  position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  font-size: 14px; opacity: .85;
}

#tray {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 6px 14px 10px;
  background: linear-gradient(180deg, transparent, rgba(8,6,20,.55));
}
.tcol { display: flex; flex-direction: column; gap: 7px; position: relative; }
.box {
  appearance: none; height: 46px; border-radius: 8px; border: 2px solid #140d08;
  cursor: pointer; font-weight: 800; font-size: 18px; letter-spacing: 0.5px;
  box-shadow: 0 3px 0 #140d08, 0 4px 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s;
  position: relative;
}
.box:active { transform: translateY(2px); box-shadow: 0 1px 0 #140d08; }
.box.back { opacity: .92; cursor: default; box-shadow: 0 2px 0 #140d08; }
.box.back:active { transform: none; }
.box.duo::before {
  content: "双槽"; position: absolute; left: 4px; top: 2px;
  font-size: 8px; font-weight: 700; letter-spacing: 0; opacity: .7;
}
.box.point {
  outline: 3px solid #fff4c0; outline-offset: 3px;
  animation: pulse 1s ease-in-out infinite;
  position: relative; z-index: 3;
}
.box.point::after {
  content: ""; position: absolute; right: -18px; top: 50%; width: 28px; height: 28px;
  transform: translateY(-20%);
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23fff4c0' stroke='%23140d08' stroke-width='2' d='M8 2l4 14 3-2 6 12 4-2-6-12 5-1z'/></svg>") center/contain no-repeat;
  pointer-events: none;
}
@keyframes pulse { 50% { outline-color: rgba(255,244,192,.35); } }
.more { text-align: center; font-size: 11px; color: var(--muted); margin-top: -2px; }

#coach {
  position: absolute; left: 16px; right: 16px; bottom: 72px;
  z-index: 5; pointer-events: auto;
}
#coach .bubble {
  background: #fff8e8; color: #2a1a10; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#coach .bubble b { color: #9a3a10; }
#coach .next { margin-top: 4px; font-size: 12px; color: #8a6a50; }

#fx {
  position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden;
}
.fly {
  position: fixed; z-index: 40; pointer-events: none; border-radius: 8px;
  display: grid; place-items: center; font-weight: 800; border: 2px solid #140d08;
  transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), transform .38s, opacity .38s;
}

/* overlays */
.modal {
  position: absolute; inset: 0; background: rgba(6, 5, 16, .62);
  display: grid; place-items: center; z-index: 20; padding: 20px;
}
.panel {
  width: min(340px, 100%); background: #161326; border: 1px solid #3a3560;
  border-radius: 18px; padding: 22px 18px 16px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.panel .en { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); }
.panel h2 { margin: 6px 0 8px; font-size: 28px; font-weight: 750; }
#winBox h2 { font-size: 40px; letter-spacing: 0.28em; text-shadow: 0 0 28px rgba(255,213,106,.45); }
.panel p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
#winStars { font-size: 28px; letter-spacing: 6px; color: var(--accent); margin: 0 0 12px; text-shadow: 0 0 16px rgba(255,213,106,.45); }
#winStars .dim { color: #3a3560; text-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 10px 14px;
  background: #2a2650; cursor: pointer; font-weight: 650; font-size: 14px;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: #2a1a08; min-width: 100%; }
.btn.ghost { background: transparent; border: 1px solid #3a3560; }
.btn.danger { background: #3a2030; }
.note { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.4; }

#adBox .panel { background: #0c0b18; }
#adSec { font-size: 48px; font-weight: 800; color: var(--accent); margin: 8px 0; }

@media (max-height: 700px) {
  .box { height: 40px; font-size: 16px; }
  .slot { height: 46px; }
  .brand h1 { font-size: 24px; }
  #levels { gap: 8px; }
}

/* menu bar / pager */
.menu-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 0; }
#pager { display: flex; align-items: center; gap: 6px; }
#pager .btn, .menu-bar .btn { padding: 6px 10px; font-size: 12px; }
#pageLab { font-size: 12px; color: var(--accent); letter-spacing: 0.06em; white-space: nowrap; }
.card.landmark { border-color: #ffd56a; }
.card .badge {
  position: absolute; left: 8px; top: 8px; font-size: 9px; letter-spacing: 0.08em;
  background: #ffd56a; color: #2a1a08; border-radius: 6px; padding: 1px 5px; font-weight: 700;
}

/* album */
#album { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: auto; padding: 18px 16px 28px; }
#album[hidden] { display: none !important; }
#album .brand { position: relative; }
#albumBack, #album .brand .icon {
  appearance: none;
  position: absolute; left: 0; top: 8px;
  background: #1a1730; border: 1px solid var(--line);
  border-radius: 10px; width: 34px; height: 34px;
  cursor: pointer; display: grid; place-items: center;
  font-size: 16px; color: var(--text); z-index: 2;
}
#postcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.postcard {
  appearance: none; border: 1px solid #2a2650; background: #12101f;
  border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; color: inherit;
}
.postcard canvas { display: block; width: 100%; height: auto; }
.postcard .meta { padding: 7px 10px 8px; }
.postcard .meta strong { display: block; font-size: 13px; }
.postcard .meta .star { color: var(--accent); font-size: 11px; }
.postcard.empty { opacity: 0.4; cursor: default; }
.postcard.landmark { border-color: #ffd56a; box-shadow: 0 0 0 1px rgba(255,213,106,.3); }
.postcard-view canvas { width: 100%; height: auto; border-radius: 10px; margin-bottom: 8px; }
#cardStars { color: var(--accent); letter-spacing: 4px; margin: 4px 0; }

/* tray wait mark / preview */
.box.waitish { box-shadow: 0 3px 0 #140d08, 0 0 0 2px rgba(200,180,255,.45); }
.box.waitish .prezz {
  position: absolute; right: 3px; top: 1px; font-size: 9px; font-weight: 700; opacity: .75; letter-spacing: 0;
}
.box.gate .prezz, .box .mechmark {
  position: absolute; left: 3px; top: 1px; font-size: 9px; font-weight: 700; opacity: .85;
}
.box.previewing { outline: 3px solid #fff4c0; outline-offset: 2px; }

/* intro card */
#introCard {
  position: absolute; inset: 0; z-index: 16;
  display: grid; place-items: end center;
  background: rgba(6,5,16,.45); padding: 16px 16px 80px;
  pointer-events: auto;
}
#introCard[hidden] { display: none !important; }
.intro-panel {
  width: 100%; background: #fff8e8; color: #2a1a10; border-radius: 16px;
  padding: 14px 14px 12px; box-shadow: 0 12px 32px rgba(0,0,0,.4);
}
.intro-panel h3 { margin: 0 0 6px; font-size: 18px; }
.intro-panel p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: #4a3428; }
.intro-anim {
  height: 64px; border-radius: 10px; background: #1a1630; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.intro-anim .city { position: absolute; inset: auto 10px 8px 10px; height: 28px; background: #2a2650; border-radius: 3px; }
.intro-anim .key {
  position: absolute; left: 16px; top: 14px; width: 18px; height: 18px; border-radius: 4px;
  background: #ffd56a; color: #3a2208; font: 700 10px sans-serif; display: grid; place-items: center;
  animation: introBob 1.2s ease-in-out infinite;
}
.intro-anim .lock {
  position: absolute; right: 28px; top: 12px; width: 22px; height: 22px; border-radius: 4px;
  background: #3a3560; color: #ffd56a; font: 700 11px sans-serif; display: grid; place-items: center;
}
.intro-anim .line {
  position: absolute; left: 34px; right: 50px; top: 22px; height: 0;
  border-top: 2px dashed #ffd56a; opacity: .85;
}
.intro-anim.shutter .door {
  position: absolute; left: 30%; right: 30%; top: 16px; height: 22px; background: repeating-linear-gradient(#2a3040, #2a3040 4px, #1a2030 4px, #1a2030 6px);
  animation: introLift 1.6s ease-in-out infinite;
}
.intro-anim.awaken .dark {
  position: absolute; left: 40%; right: 18%; top: 12px; height: 28px; background: #12101c;
  animation: introWake 1.8s ease-in-out infinite;
}
.intro-anim.blink .lan {
  position: absolute; left: 50%; top: 16px; width: 16px; height: 20px; margin-left: -8px;
  background: #ff8ab8; border-radius: 8px 8px 4px 4px;
  animation: introBlink 1s step-end infinite;
}
.intro-anim.duo .slot2 {
  position: absolute; left: 28%; right: 28%; top: 20px; height: 22px;
  border: 2px solid #ff9a4a; border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 2px;
}
.intro-anim.duo .slot2 i { background: #ff9a4a; border-radius: 3px; display: block; }
.intro-anim.hidden .q {
  position: absolute; left: 50%; top: 14px; margin-left: -14px; width: 28px; height: 28px;
  background: #3a3558; color: #dcd6ff; border-radius: 6px; display: grid; place-items: center;
  font: 700 16px sans-serif; animation: introBob 1s ease-in-out infinite;
}
@keyframes introBob { 50% { transform: translateY(3px); } }
@keyframes introLift { 0%,40% { transform: translateY(0); } 70%,100% { transform: translateY(-16px); opacity: .3; } }
@keyframes introWake { 0%,40% { background: #12101c; } 60%,100% { background: #c9a6ff; } }
@keyframes introBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: .2; } }

#previewTag {
  position: absolute; left: 50%; top: 44px; transform: translateX(-50%);
  background: #1a2030; color: #e8f0ff; border: 1px solid #3a5070;
  padding: 6px 12px; border-radius: 999px; font-size: 12px; pointer-events: none; z-index: 6;
}
#previewTag[hidden] { display: none !important; }

  </style>
</head>
<body>
  <div id="app">
    <section id="menu">
      <div class="brand">
        <h1 id="brandTitle">夜灯将眠</h1>
        <p>把通明的城市，一盏盏关掉</p>
        <p id="progress"></p>
      </div>
      <div class="menu-bar">
        <button class="btn ghost" id="albumBtn" type="button">夜景图鉴</button>
        <div id="pager">
          <button class="btn ghost" id="pagePrev" type="button">上一章</button>
          <span id="pageLab">第 1 章</span>
          <button class="btn ghost" id="pageNext" type="button">下一章</button>
        </div>
      </div>
      <div id="levels"></div>
    </section>

    <section id="album" hidden>
      <div class="brand">
        <button class="icon" id="albumBack" type="button">←</button>
        <h1>夜景图鉴</h1>
        <p id="albumProg">把关掉的城市，收成明信片</p>
      </div>
      <div id="postcards"></div>
      <div id="cardView" class="modal" hidden>
        <div class="panel postcard-view">
          <canvas id="cardCanvas" width="320" height="200"></canvas>
          <div id="cardStars"></div>
          <h2 id="cardName"></h2>
          <p id="cardQuote"></p>
          <button class="btn primary" id="cardClose" type="button">收回册子</button>
        </div>
      </div>
    </section>

    <section id="game" hidden>
      <div class="hud">
        <button class="icon" id="backBtn" aria-label="返回">←</button>
        <div class="titles"><span id="lvNo"></span><span id="lvName"></span></div>
        <div class="stat"><em>剩余</em><span id="leftV">0</span></div>
        <button class="tool" id="speedBtn" type="button">▶ 1×</button>
        <button class="tool" id="soundBtn" type="button">♪</button>
      </div>
      <div id="loadRail"><i id="loadFill"></i></div>
      <div id="stage">
        <canvas id="board"></canvas>
        <div id="toast"></div>
        <div id="slots"></div>
        <div id="coach" hidden></div>
        <div id="introCard" hidden>
          <div class="intro-panel">
            <div class="intro-anim" id="introAnim"></div>
            <h3 id="introTitle"></h3>
            <p id="introLine"></p>
            <button class="btn primary" id="introOk" type="button">知道了</button>
          </div>
        </div>
        <div id="fx"></div>
      </div>
      <div id="tray"></div>

      <div id="loseBox" class="modal" hidden>
        <div class="panel">
          <div class="en">GRID OVERLOAD</div>
          <h2 style="color:#ff6b8a">电网过载了</h2>
          <p>电闸里的颜色都还没露出来，小电工无处下手。</p>
          <button class="btn primary" id="loseRw" type="button">◀ 时光倒流</button>
          <div class="row" style="margin-top:8px">
            <button class="btn ghost" id="loseMenu" type="button">菜单</button>
            <button class="btn" id="loseRetry" type="button">重新开始</button>
            <button class="btn" id="loseAd" type="button">看广告加一个槽</button>
          </div>
          <div class="note">时光倒流会退回最近几步，每关一次。广告是演示用的倒计时，不会真的播放。</div>
        </div>
      </div>

      <div id="winBox" class="modal" hidden>
        <div class="panel">
          <div class="en">CITY ASLEEP</div>
          <h2 id="winTitle">晚安</h2>
          <div id="winStars">★★★</div>
          <p id="winSub">城市已入睡</p>
          <div class="row">
            <button class="btn ghost" id="winAlbum" type="button">看图鉴</button>
            <button class="btn ghost" id="winMenu" type="button">菜单</button>
            <button class="btn" id="winRetry" type="button">再关一次</button>
            <button class="btn primary" id="winNext" type="button" style="min-width:0;flex:1">下一关</button>
          </div>
        </div>
      </div>

      <div id="adBox" class="modal" hidden>
        <div class="panel">
          <div class="en">SIMULATED AD</div>
          <h2>模拟广告</h2>
          <p>这是演示用的倒计时，不是真广告。</p>
          <div id="adSec">5</div>
          <button class="btn ghost" id="adSkip" type="button">跳过并获得槽位</button>
        </div>
      </div>
    </section>

  <script id="core">
// Shared puzzle core for 夜灯将眠 — used by verify.mjs and inlined into index.html
(function (root) {
  const COLORS = [
    { id: "amber", fill: "#ffd56a", glow: "#ffbe3a", ink: "#3a2208", name: "暖黄" },
    { id: "pink", fill: "#ff8ab8", glow: "#ff5e9a", ink: "#4a1028", name: "粉" },
    { id: "cyan", fill: "#7ee7ff", glow: "#3ad4ff", ink: "#073044", name: "青" },
    { id: "orange", fill: "#ff9a4a", glow: "#ff7a1a", ink: "#3a1a00", name: "橙" },
    { id: "mint", fill: "#8dffc1", glow: "#3dff9a", ink: "#06301c", name: "薄荷" },
    { id: "lavender", fill: "#c9a6ff", glow: "#a87cff", ink: "#2a1050", name: "紫" },
  ];

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function emptyGrid(W, H) {
    return Array.from({ length: H }, () => Array.from({ length: W }, () => null));
  }

  function cloneGrid(g) {
    return g.map((row) => row.map((c) => (c ? { ...c } : null)));
  }

  function cloneCols(cols) {
    return cols.map((col) => col.map((t) => ({ ...t })));
  }

  function cloneSlots(slots) {
    return slots.map((s) => (s ? { ...s } : null));
  }

  // Windows sit in a rectangle. y0 is the top row, x0 left.
  // border/fill are color indices; fill may be null for solid border color.
  // lock: building id string. key: this window unlocks that id when turned off.
  function stampBuilding(g, x0, y0, w, h, opt) {
    const border = opt.border;
    const fill = opt.fill == null ? border : opt.fill;
    const lock = opt.lock || null;
    const key = opt.key || null;
    const keyAt = opt.keyAt || null;
    for (let y = y0; y < y0 + h; y++) {
      for (let x = x0; x < x0 + w; x++) {
        const edge = x === x0 || x === x0 + w - 1 || y === y0 || y === y0 + h - 1;
        let c = edge ? border : fill;
        if (opt.pattern && opt.pattern[y - y0] && opt.pattern[y - y0][x - x0] != null) {
          c = opt.pattern[y - y0][x - x0];
        }
        const cell = { c, on: true };
        if (lock) cell.lock = lock;
        if (opt.kind) cell.kind = opt.kind;
        if (keyAt && keyAt[0] === x && keyAt[1] === y && key) cell.key = key;
        g[y][x] = cell;
      }
    }
    if (key && keyAt == null) {
      const kx = x0 + (w >> 1);
      const ky = y0;
      if (g[ky][kx]) {
        g[ky][kx].key = key;
        g[ky][kx].c = opt.keyColor != null ? opt.keyColor : g[ky][kx].c;
        if (opt.keyKind) g[ky][kx].kind = opt.keyKind;
      }
    }
  }

  function countOn(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && c.on) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function countNeed(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && (c.on || c.dormant)) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function isOpen(grid, x, y) {
    const H = grid.length, W = grid[0].length;
    if (x < 0 || y < 0 || x >= W || y >= H) return true;
    const c = grid[y][x];
    if (!c) return true;
    if (c.on) return false;
    return true;
  }

  function blinkOpen(cell, takes) {
    if (!cell || !cell.blink) return true;
    return (takes || 0) % 2 === 1;
  }

  function isReachable(grid, x, y, unlocked, takes) {
    const cell = grid[y][x];
    if (!cell || !cell.on) return false;
    if (cell.lock && !(unlocked && unlocked[cell.lock])) return false;
    if (!blinkOpen(cell, takes)) return false;
    for (const [dx, dy] of DIRS) {
      if (isOpen(grid, x + dx, y + dy)) return true;
    }
    return false;
  }

  function findTarget(grid, color, unlocked, takes) {
    const H = grid.length, W = grid[0].length;
    let best = null;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on || cell.c !== color) continue;
        if (!isReachable(grid, x, y, unlocked, takes)) continue;
        const isKey = !!cell.key;
        if (
          !best ||
          (isKey && !best.key) ||
          (isKey === !!best.key && (y < best.y || (y === best.y && x < best.x)))
        ) {
          best = { x, y, key: isKey };
        }
      }
    }
    return best;
  }

  function turnOff(grid, t, unlocked) {
    const cell = grid[t.y][t.x];
    cell.on = false;
    cell.dormant = false;
    if (cell.key) unlocked[cell.key] = true;
    if (cell.awaken) {
      for (const [x, y] of cell.awaken) {
        const d = grid[y] && grid[y][x];
        if (d && d.dormant) {
          d.dormant = false;
          d.on = true;
        }
      }
    }
  }

  function saturate(grid, slots, unlocked, takes) {
    let guard = 0;
    while (guard++ < 4000) {
      let did = false;
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        if (!s || s.n <= 0 || s.hold) continue;
        const t = findTarget(grid, s.c, unlocked, takes);
        if (!t) continue;
        turnOff(grid, t, unlocked);
        s.n--;
        did = true;
      }
      if (!did) break;
    }
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s && s.n <= 0 && !s.hold) {
        if (s.duo && s.pair != null) slots[s.pair] = null;
        slots[i] = null;
      }
    }
  }

  function leftCount(grid) {
    let n = 0;
    for (const row of grid) for (const c of row) if (c && (c.on || c.dormant)) n++;
    return n;
  }

  function canTake(cols, ci) {
    return cols[ci] && cols[ci].length > 0;
  }

  function hasPair(slots, slotCount) {
    for (let i = 0; i < slotCount - 1; i++) if (!slots[i] && !slots[i + 1]) return true;
    return false;
  }

  function canPlaceTicket(slots, slotCount, t) {
    if (!t) return false;
    if (t.duo) return hasPair(slots, slotCount);
    for (let i = 0; i < slotCount; i++) if (!slots[i]) return true;
    return false;
  }

  function place(cols, slots, ci, slotCount) {
    if (!canTake(cols, ci)) return false;
    const t = cols[ci][0];
    if (t.duo) {
      let si = -1;
      for (let i = 0; i < slotCount - 1; i++) {
        if (!slots[i] && !slots[i + 1]) { si = i; break; }
      }
      if (si < 0) return false;
      cols[ci].shift();
      slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id, duo: true, pair: si + 1 };
      slots[si + 1] = { c: t.c, n: 0, hidden: !!t.hidden, id: t.id, duo: true, hold: true, pair: si };
      return true;
    }
    let si = -1;
    for (let i = 0; i < slotCount; i++) if (!slots[i]) { si = i; break; }
    if (si < 0) return false;
    cols[ci].shift();
    slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id };
    return true;
  }

  function frontsUseful(grid, cols, unlocked, takes) {
    const out = [];
    for (let i = 0; i < cols.length; i++) {
      const t = cols[i][0];
      if (t && findTarget(grid, t.c, unlocked, takes)) out.push(i);
    }
    return out;
  }

  function isWon(grid) { return leftCount(grid) === 0; }

  function canPlaceAny(cols, slots, slotCount) {
    for (let i = 0; i < cols.length; i++) {
      if (cols[i].length && canPlaceTicket(slots, slotCount, cols[i][0])) return true;
    }
    return false;
  }

  function isLost(grid, cols, slots, slotCount, unlocked, takes) {
    if (isWon(grid)) return false;
    if (slots.some((s) => s && s.n > 0 && !s.hold && findTarget(grid, s.c, unlocked, takes))) return false;
    return !canPlaceAny(cols, slots, slotCount);
  }

  function stateKey(grid, cols, slots, unlocked, takes) {
    let lights = "";
    for (const row of grid) for (const c of row) lights += c && c.on ? "1" : c && c.dormant ? "d" : "0";
    const cs = cols.map((col) => col.map((t) => t.c + ":" + t.n + (t.duo ? "D" : "")).join(",")).join("|");
    const ss = slots.map((s) => (s ? (s.hold ? "H" : s.c + ":" + s.n + (s.duo ? "D" : "")) : "-")).join(",");
    const uk = Object.keys(unlocked).filter((k) => unlocked[k]).sort().join(",");
    return lights + "#" + cs + "#" + ss + "#" + uk + "#" + ((takes || 0) % 2);
  }

  function solve(level, slotCount, opts) {
    const grid0 = cloneGrid(level.grid);
    const cols0 = cloneCols(level.cols);
    const slots0 = Array(slotCount).fill(null);
    const unlocked0 = { ...(level.unlocked || {}) };
    const seen = new Set();
    let found = null;
    const maxVisits = (opts && opts.maxVisits) || 400000;
    let visits = 0;

    function dfs(grid, cols, slots, unlocked, takes, path) {
      if (found) return;
      if (++visits > maxVisits) return;
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) { found = path.slice(); return; }
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return;
      const key = stateKey(grid, cols, slots, unlocked, takes);
      if (seen.has(key)) return;
      seen.add(key);

      const order = [];
      for (let i = 0; i < cols.length; i++) if (cols[i].length) order.push(i);
      order.sort((a, b) => {
        const ua = findTarget(grid, cols[a][0].c, unlocked, takes) ? 0 : 1;
        const ub = findTarget(grid, cols[b][0].c, unlocked, takes) ? 0 : 1;
        if (ua !== ub) return ua - ub;
        const da = cols[a][0].duo ? 1 : 0;
        const db = cols[b][0].duo ? 1 : 0;
        return da - db;
      });
      for (const i of order) {
        const g2 = cloneGrid(grid);
        const c2 = cloneCols(cols);
        const s2 = cloneSlots(slots);
        const u2 = { ...unlocked };
        if (!place(c2, s2, i, slotCount)) continue;
        dfs(g2, c2, s2, u2, takes + 1, path.concat(i));
        if (found) return;
      }
    }

    dfs(grid0, cols0, slots0, unlocked0, 0, []);
    return { ok: !!found, path: found || [], visits, left: leftCount(grid0) };
  }

  function greedySolve(level, slotCount) {
    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    const path = [];
    for (let guard = 0; guard < 250; guard++) {
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      let choice = -1;
      for (let i = 0; i < cols.length; i++) {
        const t = cols[i][0];
        if (!t || !canPlaceTicket(slots, slotCount, t)) continue;
        if (findTarget(grid, t.c, unlocked, takes)) { choice = i; break; }
      }
      if (choice < 0) {
        for (let i = 0; i < cols.length; i++) {
          if (cols[i][0] && canPlaceTicket(slots, slotCount, cols[i][0])) { choice = i; break; }
        }
      }
      if (choice < 0) return { ok: false, path, reason: "stuck" };
      place(cols, slots, choice, slotCount);
      takes++;
      path.push(choice);
    }
    return { ok: false, path, reason: "timeout" };
  }


  function leftmostSolve(level, slotCount) {
    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    const path = [];
    for (let guard = 0; guard < 250; guard++) {

      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      let choice = -1;
      for (let i = 0; i < cols.length; i++) {
        if (cols[i][0] && canPlaceTicket(slots, slotCount, cols[i][0])) { choice = i; break; }
      }
      if (choice < 0) return { ok: false, path, reason: "stuck" };
      place(cols, slots, choice, slotCount);
      takes++;
      path.push(choice);
    }
    return { ok: false, path, reason: "timeout" };

    const keys = new Set([...Object.keys(n), ...Object.keys(got)]);
    for (const k of keys) if ((n[k] || 0) !== (got[k] || 0)) return { ok: false, n, got };
    return { ok: true, n, got };

      if (k === 0) continue;
      const base = Math.floor(total / k);
      let rem = total - base * k;
      for (let i = 0; i < k; i++) {
        const v = base + (rem > 0 ? 1 : 0);
        if (rem > 0) rem--;
        piles[c].push(v);
      }
    }
    for (const c of Object.keys(need)) {
      if (!n[+c]) throw new Error(level.id + " ticket color " + c + " has no lights");
    }
    level.cols = parsed.map((col, ci) =>
      col.map((it, ri) => {
        const n1 = piles[it.c].shift();
        const hidden = !!(it.hidden || hiddenSet.has(ci + ":" + ri) || hiddenSet.has("c" + it.c));
        const extra = {};
        if (hidden) extra.hidden = true;
        if (it.duo) extra.duo = true;
        return T(it.c, n1, extra);
      })
    );
  }

  const SUFFIX = ["", "·又一夜", "·深秋", "·入冬", "·春雨后", "·夏末"];

  function hashStr(s) {
    let h = 2166136261;
    for (let i = 0; i < String(s).length; i++) h = Math.imul(h ^ String(s).charCodeAt(i), 16777619);
    return h >>> 0;
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function irand(rng, a, b) { return a + ((rng() * (b - a + 1)) | 0); }
  function pick(rng, arr) { return arr[(rng() * arr.length) | 0]; }
  function clamp(n, a, b) { return Math.max(a, Math.min(b, n)); }

  function chapterOf(n) { return Math.ceil(n / 10); }
  function chapterName(n) { return CHAPTERS[(chapterOf(n) - 1) % CHAPTERS.length] + (chapterOf(n) > CHAPTERS.length ? "·" + Math.ceil(chapterOf(n) / CHAPTERS.length) : ""); }

  function roleOf(n) {
    const m = n % 10;
    if (m === 0) return "boss";
    if (n > 1 && (m === 1 || m === 2)) return "relax";
    if (m === 5) return "pit";
    const intro = INTROS.find((x) => x.at === n);
    if (intro) return "teach";
    return "normal";
  }

  function unlockedMechs(n) {
    const out = [];
    for (const it of INTROS) if (n >= it.at) out.push(it.id);
    return out;
  }

  function pickMechs(n, role, rng) {
    const unlocked = unlockedMechs(n);
    if (n <= 20) return []; // hand levels
    if (role === "teach") return [];
    const comboCap = clamp(1 + Math.floor((n - 20) / 20), 1, 3);
    let k = 1;
    if (role === "relax") k = 1;
    else if (role === "pit") k = Math.min(2, Math.max(1, comboCap));
    else if (role === "boss") k = Math.min(unlocked.length, Math.max(2, comboCap));
    else k = (n % 3 === 0 && comboCap > 1) ? Math.min(2, comboCap) : 1;
    if (n < 30 && role !== "boss") k = 1;
    const pool = unlocked.slice();
    const chosen = [];
    // cycle the primary mechanic by level so we don't keep drawing the same one
    if (pool.length) {
      const primary = pool[(n * 3 + Math.floor(n / 7)) % pool.length];
      chosen.push(primary);
      pool.splice(pool.indexOf(primary), 1);
    }
    while (chosen.length < k && pool.length) {
      const i = (rng() * pool.length) | 0;
      chosen.push(pool.splice(i, 1)[0]);
    }
    return chosen;
  }

  function baseScore(n) {
    return clamp(18 + Math.sqrt(n) * 3.15, 14, 72);
  }

  function pacingOf(n) {
    const role = roleOf(n);
    const base = baseScore(n);
    let target = base;
    if (role === "boss") target = base + 14;
    else if (role === "pit") target = base + 7;
    else if (role === "relax") target = Math.max(16, base - 10);
    else if (role === "teach") target = Math.max(14, base - 8);
    target = clamp(target, 12, 86);
    const colors = n <= 8 ? 3 : n <= 20 ? 4 : clamp(3 + Math.floor(n / 40), 3, 6);
    const bury = role === "boss" ? 2 : role === "pit" ? 2 : role === "relax" || role === "teach" ? 0 : (n > 40 ? 1 : 0);
    return {
      n, role, target,
      lo: target - 12,
      hi: target + 12,
      colors,
      bury,
      blds: role === "boss" ? 4 : role === "relax" ? 3 : 3 + (n > 50 ? 1 : 0),
      W: role === "boss" ? 18 : 16 + (n > 80 ? 1 : 0),
      H: role === "boss" ? 12 : 11,
    };
  }

  function themeFor(n) {
    const base = THEME_POOL[(n - 1) % THEME_POOL.length];
    const cycle = Math.floor((n - 1) / THEME_POOL.length);
    const suffix = SUFFIX[cycle % SUFFIX.length];
    const name = (n % 10 === 0 ? "地标·" : "") + base.name + suffix;
    return { ...base, name, landmark: n % 10 === 0, landmarkType: base.landmark, quote: base.quote };
  }

  function replayPeakAndThink(level, path, slotCount) {
    let grid = C.cloneGrid(level.grid);
    let cols = C.cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    let peak = 0;
    let think = 0;
    for (const ci of path) {
      C.saturate(grid, slots, unlocked, takes);
      const useful = C.frontsUseful(grid, cols, unlocked, takes);
      if (useful.length && useful.indexOf(ci) < 0) think++;
      if (!C.place(cols, slots, ci, slotCount)) break;
      takes++;
      C.saturate(grid, slots, unlocked, takes);
      const used = slots.filter(Boolean).length;
      if (used > peak) peak = used;
    }
    return { peak, think };
  }

  function scoreDifficulty(level, sol, greedy, left) {
    const slotCount = 5;
    const rt = sol && sol.ok ? replayPeakAndThink(level, sol.path, slotCount) : { peak: 0, think: 0 };
    const colors = new Set();
    if (level.grid) {
      for (const row of level.grid) for (const c of row) if (c && (c.on || c.dormant)) colors.add(c.c);
    }
    const mechs = (level.mechs && level.mechs.length) ? level.mechs.length : (level.mechanic ? 1 : 0);
    let s = 0;
    if (greedy && !greedy.ok) s += 24;
    if (left && !left.ok) s += 12;
    s += clamp(rt.think * 5, 0, 20);
    s += clamp(Math.log10((sol && sol.visits) || 1) * 8, 0, 16);
    s += clamp((rt.peak - 2) * 5, 0, 14);
    s += (colors.size - 3) * 3;
    s += mechs * 4;
    if (level.pacing && level.pacing.bury) s += level.pacing.bury * 3;
    return { score: clamp(Math.round(s), 0, 100), peak: rt.peak, think: rt.think, visits: sol ? sol.visits : 0, greedyOk: !!(greedy && greedy.ok), leftOk: !!(left && left.ok) };
  }

  function recItem(item) { return typeof item === "number" ? { c: item } : item; }

  function assign(level, recipe, hiddenSet) {
    hiddenSet = hiddenSet || new Set();
    const { n } = C.countNeed(level.grid);
    const parsed = recipe.map((col) => col.map(recItem));
    const need = {};
    for (const col of parsed) for (const it of col) need[it.c] = (need[it.c] || 0) + 1;
    const piles = {};
    for (const [cs, total] of Object.entries(n)) {
      const c = +cs, k = need[c] || 0;
      piles[c] = [];
      if (k === 0 && total > 0) throw new Error("color leftover " + c);
      if (k === 0) continue;
      const base = Math.floor(total / k);
      let rem = total - base * k;
      for (let i = 0; i < k; i++) { piles[c].push(base + (rem > 0 ? 1 : 0)); if (rem > 0) rem--; }
    }
    for (const c of Object.keys(need)) if (!n[+c]) throw new Error("no lights " + c);
    let tid = hashStr(level.id) % 100000;
    level.cols = parsed.map((col, ci) => col.map((it, ri) => {
      const hidden = !!(it.hidden || hiddenSet.has(ci + ":" + ri));
      const extra = {};
      if (hidden) extra.hidden = true;
      if (it.duo) extra.duo = true;
      return { c: it.c, n: piles[it.c].shift(), id: ++tid, ...extra };
    }));
    return level;
  }

  function findCell(g, pred) {
    for (let y = 0; y < g.length; y++)
      for (let x = 0; x < g[0].length; x++)
        if (g[y][x] && pred(g[y][x], x, y)) return [x, y];
    return null;
  }

  function buildGrid(rng, pacing, mechs) {
    const W = pacing.W, H = pacing.H;
    const g = C.emptyGrid(W, H);
    const nB = clamp(pacing.blds, 3, 5);
    const colors = [];
    for (let i = 0; i < pacing.colors; i++) colors.push(i % 6);
    // place buildings
    const blds = [];
    let x = 0;
    const remain = nB;
    for (let i = 0; i < remain; i++) {
      const left = W - x;
      const slotsLeft = remain - i;
      const maxW = Math.max(2, Math.floor((left - (slotsLeft - 1)) / slotsLeft) + 1);
      const bw = clamp(irand(rng, 3, Math.min(7, maxW)), 2, left - (slotsLeft - 1));
      const bh = irand(rng, Math.max(5, H - 6), H - 1);
      const y = H - bh;
      const border = colors[i % colors.length];
      const fill = colors[(i + 1 + ((rng() * 2) | 0)) % colors.length];
      C.stampBuilding(g, x, y, bw, bh, { border, fill });
      blds.push({ x, y, w: bw, h: bh, border, fill });
      x += bw + 1;
      if (x >= W - 1) break;
    }
    if (!blds.length) throw new Error("no buildings");

    const used = mechs.slice();
    // apply spatial mechanics
    const leftB = blds[0];
    const midB = blds[Math.floor(blds.length / 2)] || blds[0];
    const rightB = blds[blds.length - 1];

    if (used.includes("lock") && blds.length >= 2) {
      const id = "L" + pacing.n;
      for (let yy = rightB.y; yy < rightB.y + rightB.h; yy++)
        for (let xx = rightB.x; xx < rightB.x + rightB.w; xx++)
          if (g[yy][xx]) { g[yy][xx].lock = id; g[yy][xx].kind = g[yy][xx].kind || "zone"; }
      const kx = leftB.x + (leftB.w >> 1);
      const ky = leftB.y;
      if (g[ky][kx]) { g[ky][kx].key = id; g[ky][kx].kind = "key"; g[ky][kx].c = leftB.border; }
    }

    if (used.includes("shutter")) {
      const id = "S" + pacing.n;
      const b = midB;
      const y0 = b.y + Math.max(2, (b.h * 0.35) | 0);
      const y1 = Math.min(b.y + b.h - 2, y0 + Math.max(2, (b.h * 0.35) | 0));
      for (let yy = y0; yy < y1; yy++)
        for (let xx = b.x; xx < b.x + b.w; xx++)
          if (g[yy][xx]) { g[yy][xx].lock = id; g[yy][xx].kind = "shutter"; }
      // button on leftmost building, not overlapping existing key if possible
      const bx = leftB.x + 1;
      const by = Math.min(H - 2, leftB.y + leftB.h - 2);
      if (g[by][bx]) { g[by][bx].key = id; g[by][bx].kind = "button"; }
    }

    if (used.includes("breaker") && blds.length >= 2) {
      const id = "B" + pacing.n;
      const b = rightB;
      for (let yy = b.y; yy < b.y + b.h; yy++)
        for (let xx = b.x; xx < b.x + b.w; xx++)
          if (g[yy][xx]) { g[yy][xx].lock = id; g[yy][xx].kind = "zone"; }
      const bx = leftB.x;
      const by = leftB.y;
      if (g[by][bx]) { g[by][bx].key = id; g[by][bx].kind = "breaker"; }
    }

    if (used.includes("awaken")) {
      const b = midB;
      const cells = [];
      const ix0 = b.x + 1, ix1 = b.x + b.w - 1;
      const iy0 = b.y + 2, iy1 = b.y + b.h - 1;
      for (let yy = iy0; yy < iy1; yy++)
        for (let xx = ix0; xx < ix1; xx++)
          if (g[yy][xx] && !g[yy][xx].lock) {
            g[yy][xx].on = false;
            g[yy][xx].dormant = true;
            g[yy][xx].kind = "screen";
            cells.push([xx, yy]);
          }
      if (cells.length) {
        const sx = leftB.x + (leftB.w >> 1);
        const sy = Math.min(H - 1, leftB.y + 1);
        if (g[sy][sx]) { g[sy][sx].awaken = cells; g[sy][sx].kind = g[sy][sx].kind || "switch"; }
        else if (g[leftB.y][leftB.x]) { g[leftB.y][leftB.x].awaken = cells; g[leftB.y][leftB.x].kind = "switch"; }
      }
    }

    if (used.includes("blink")) {
      const b = (used.includes("lock") || used.includes("breaker")) ? midB : rightB;
      for (let xx = b.x; xx < b.x + b.w; xx++) {
        if (g[b.y] && g[b.y][xx]) { g[b.y][xx].blink = true; g[b.y][xx].kind = g[b.y][xx].kind || "lantern"; }
        if (b.h > 3 && g[b.y + 1] && g[b.y + 1][xx] && rng() > 0.35) {
          g[b.y + 1][xx].blink = true;
          g[b.y + 1][xx].kind = g[b.y + 1][xx].kind || "lantern";
        }
      }
    }

    return { grid: g, W, H };
  }

  function gateColors(grid) {
    const set = new Set();
    for (const row of grid) for (const c of row) {
      if (c && (c.key || (c.awaken && c.awaken.length))) set.add(c.c);
    }
    return [...set];
  }

      s: 0.5 + Math.random() * 1.8,
      b: 0.35 + Math.random() * 0.65,
    }));
  }

  /* ---------- layout ---------- */
  function resize() {
    const wrap = $("#stage");
    if (!wrap) return;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    board.width = Math.max(1, w * dpr);
    board.height = Math.max(1, h * dpr);
    board.style.width = w + "px";
    board.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout(w, h);
    glowDirty = true;
    skyKey = "";
  }

  function layout(w, h) {
    if (!LV) { geo = { w, h }; return; }
    const slotBand = 70;
    const streetY = h - slotBand;
    const sky = Math.max(52, h * 0.11);
    const cityH = Math.max(100, streetY - sky - 6);
    const cs = Math.max(9, Math.min((w - 12) / LV.W, cityH / LV.H));
    const ox = (w - cs * LV.W) / 2;
    const oy = streetY - 8 - cs * LV.H;
    geo = { w, h, cs, ox, oy, sky, street: slotBand, streetY };
  }

  function cellXY(x, y) {
    return { x: geo.ox + (x + 0.5) * geo.cs, y: geo.oy + (y + 0.5) * geo.cs };
  }
  function slotPt(i) {
    const el = $$("#slots .slot")[i];
    if (!el || !geo) return { x: geo.w * (i + 0.5) / slotCount, y: geo.h - 8 };
    const r = el.getBoundingClientRect();
    const b = board.getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top - b.top + 6 };
  }

  /* ---------- decor ---------- */
  function buildDecor(L) {
    const r = rnd(seedOf(L.id + ":" + L.name));
    const th = themeOf(L);
    // connected buildings
    const seen = Array.from({ length: L.H }, () => Array(L.W).fill(false));
    const blds = [];
    const inb = (x, y) => y >= 0 && y < L.H && x >= 0 && x < L.W && L.grid[y][x];
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        if (!inb(x, y) || seen[y][x]) continue;
        const cells = [];
        const q = [[x, y]];
        seen[y][x] = true;
        let x0 = x, y0 = y, x1 = x, y1 = y;
        while (q.length) {
          const [cx, cy] = q.pop();
          cells.push([cx, cy]);
          x0 = Math.min(x0, cx); y0 = Math.min(y0, cy);
          x1 = Math.max(x1, cx); y1 = Math.max(y1, cy);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = cx + dx, ny = cy + dy;
            if (inb(nx, ny) && !seen[ny][nx]) { seen[ny][nx] = true; q.push([nx, ny]); }
          }
        }
        const wall = th.wall[(blds.length) % th.wall.length];
        blds.push({
          cells, x0, y0, x1, y1,
          wall, wall2: lerpC(wall, "#000000", 0.25),
          roof: (r() * 5) | 0,
          tower: r() > 0.55,
          antenna: r() > 0.4,
          ac: 1 + ((r() * 3) | 0),
          sign: th.signs[blds.length % th.signs.length],
          signY: y0 + 1 + ((r() * Math.max(1, (y1 - y0 - 2))) | 0),
          pipe: r() > 0.35,
        });
      }
    }
    function makeSky(count, hMin, hMax, dark, startX) {
      const arr = [];
      let x = startX;
      for (let i = 0; i < count && x < 1.12; i++) {
        const w = 0.045 + r() * 0.09;
        const h = hMin + r() * (hMax - hMin);
        const wins = [];
        const cols = 2 + ((r() * 4) | 0);
        const rows = 4 + ((r() * 8) | 0);
        for (let j = 0; j < cols * rows; j++) if (r() > 0.28) wins.push(j);
        arr.push({
          x, w, h, roof: (r() * 4) | 0,
          wall: lerpC(th.wall[0], dark, 0.25 + r() * 0.35),
          edge: lerpC(th.wall[1] || th.wall[0], "#8a90b0", 0.12),
          cols, rows, wins, lit: 0.45 + r() * 0.5,
          spire: r() > 0.65,
        });
        x += w + 0.004 + r() * 0.02;
      }
      return arr;
    }
    const skylineFar = makeSky(16, 0.58, 1.12, "#0a0a18", -0.02);
    const skylineMid = makeSky(12, 0.32, 0.72, "#12101c", -0.05);
    const lamps = [];
    for (let i = 0; i < 5; i++) lamps.push({ t: (i + 0.5) / 5 + (r() - 0.5) * 0.06 });
    return { blds, skylineFar, skylineMid, lamps, seed: r };
  }

  /* ---------- menu ---------- */
  function openMenu() {
    screen = "menu";
    LV = null;
    $("#game").hidden = true;
    if ($("#album")) $("#album").hidden = true;
    $("#menu").hidden = false;
    renderMenu();
  }

  function pageCount() {
    if (save.all) return Math.ceil(MAX_MENU / PAGE);
    const vis = Math.max(PAGE, Math.min(MAX_MENU, (save.unlocked || 1) + PAGE - 1));
    return Math.max(1, Math.ceil(vis / PAGE));
  }
  function renderMenu() {
    const cleared = Object.keys(save.stars).length;
    const prog = $("#progress");
    const pages = pageCount();
    if (menuPage >= pages) menuPage = pages - 1;
    if (menuPage < 0) menuPage = 0;
    const chap = menuPage + 1;
    const chapName = G && G.chapterName ? G.chapterName(menuPage * PAGE + 1) : ("第 " + chap + " 章");
    if (prog) prog.textContent = save.all
      ? `已入睡 ${cleared} 座城 · 图鉴 ${cleared} · 测试解锁`
      : `已入睡 ${cleared} 座城 · 图鉴可回看`;
    if ($("#pageLab")) $("#pageLab").textContent = `第 ${chap} 章 · ${chapName}`;
    if ($("#pagePrev")) $("#pagePrev").disabled = menuPage <= 0;
    if ($("#pageNext")) $("#pageNext").disabled = menuPage >= pages - 1;
    const box = $("#levels");
    box.innerHTML = "";
    const start = menuPage * PAGE;
    for (let i = start; i < start + PAGE; i++) {
      if (i >= MAX_MENU) break;
      let L;
      try { L = levelAt(i); } catch (e) { continue; }
      if (!L) continue;
      const open = isOpenLevel(i);
      const b = document.createElement("button");
      const starsN = save.stars[i] || 0;
      b.className = "card" + (starsN ? " done" : "") + (open && !starsN && i === (save.unlocked - 1) ? " start" : "") + (open ? "" : " locked") + (L.landmark ? " landmark" : "");
      b.type = "button";
      const cv = document.createElement("canvas");
      cv.width = 280;
      cv.height = 150;
      drawThumb(cv, L, open);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<span class="no">第 ${i + 1} 关 · ${L.tier || ""}</span><strong>${L.name}</strong>`;
      if (L.landmark) meta.innerHTML += `<span class="badge">地标</span>`;
      if (!open) meta.innerHTML += `<span class="lock">锁</span>`;
      else if (starsN) meta.innerHTML += `<span class="star">${"★".repeat(starsN)}${"☆".repeat(3 - starsN)}</span>`;
      b.append(cv, meta);
      b.onclick = () => { if (open) openLevel(i); };
      box.appendChild(b);
    }

  function drawThumb(cv, L, open) {
    const c = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const th = themeOf(L);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky0);
    g.addColorStop(1, th.sky2);
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    c.fillStyle = "rgba(255,255,255,.5)";
    for (let i = 0; i < 16; i++) c.fillRect((i * 47) % W, (i * 29) % (H * 0.4), 1.4, 1.4);
    const cs = Math.min((W - 16) / L.W, (H - 22) / L.H);
    const ox = (W - cs * L.W) / 2, oy = 12 + (H - 22 - cs * L.H);
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        const cell = L.grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        c.fillStyle = th.wall[0];
        c.fillRect(px, py, cs + 0.5, cs + 0.5);
        if (cell.on || cell.dormant) {
          c.fillStyle = cell.dormant ? "rgba(40,40,60,.8)" : C.COLORS[cell.c].fill;
          c.globalAlpha = open ? 1 : 0.45;
          c.fillRect(px + 0.8, py + 0.8, Math.max(1, cs - 1.6), Math.max(1, cs - 1.6));
          c.globalAlpha = 1;
        }
      }
    }
  }

  function openLevel(i, force) {

  function snapshot() {
    return {
      grid: C.cloneGrid(grid),
      cols: C.cloneCols(cols),
      slots: C.cloneSlots(slots),
      unlocked: { ...unlocked },
      slotCount, takes,
    };
  }
  function restore(s) {
    grid = C.cloneGrid(s.grid);
    cols = C.cloneCols(s.cols);
    slots = C.cloneSlots(s.slots);
    for (const sl of slots) if (sl) { sl._busy = false; sl._wait = false; }
    unlocked = { ...s.unlocked };
    slotCount = s.slotCount;
    takes = s.takes || 0;
    workers = [];
    parts = [];
    over = false;
    won = false;
    paused = false;
    glowDirty = true;
    $("#loseBox").hidden = true;
    renderSlots();
    renderTray();
    updateHud();
    resize();

  function startCoach() {
    coach = { i: 0, wait: 0 };
    showCoach();
  }
  function coachPick() {
    const u = C.frontsUseful(grid, cols, unlocked, takes);
    return u.length ? u[0] : 0;
  }
  function showCoach() {
    const el = $("#coach");
    if (!coach || over || won) { el.hidden = true; return; }
    const steps = [
      { k: "tap", html: "点<b>最前排</b>的工单，派出同色的小电工" },
      { k: "read", html: "小电工只会关<b>露在外面</b>的灯，从外往里、从上往下" },
      { k: "read", html: "电闸只有 <b>5</b> 个槽。关不到的颜色会占着，<b>全堵住就电网过载了</b>" },
    ];
    const s = steps[coach.i];
    if (!s) { el.hidden = true; coach = null; toast("把整座城的灯关完就过关，晚安。", true); return; }
    el.hidden = false;
    el.innerHTML = `<div class="bubble">${s.html}${s.k === "read" ? '<div class="next">点一下继续</div>' : ""}</div>`;
    $$(".box").forEach((b) => b.classList.remove("point"));
    if (s.k === "tap") {
      const ci = coachPick();
      const btn = $(`.tcol[data-c="${ci}"] .box[data-k="0"]`);
      if (btn) btn.classList.add("point");
    }
  }
  function coachNext() {
    if (!coach) return;
    coach.i++;
    showCoach();
  }
  function coachBlocks(ci) {
    if (!coach) return false;
    const steps = ["tap", "read", "read"];
    const k = steps[coach.i];
    if (!k || k === "read") return k === "read";
    return ci !== coachPick();
  }

  function flyCard(fromEl, color, text, ink) {
