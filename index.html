    }
  }

  function drawThumb(cv, L, open) {
    const c = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const th = themeOf(L);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky0);
    g.addColorStop(1, th.sky2);
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    c.fillStyle = "rgba(255,255,255,.5)";
    for (let i = 0; i < 16; i++) c.fillRect((i * 47) % W, (i * 29) % (H * 0.4), 1.4, 1.4);
    const type = L.landmarkType || (th && th.landmark);
    if (type && window.NightLandmarks) {
      c.save();
      window.NightLandmarks.draw(c, type, W * 0.72, H - 8, Math.min(W, H) * 0.72, { wall: (th.wall && th.wall[0]) || "#0a0c14", accent: th.accent, lit: open ? 0.85 : 0.2 });
      c.restore();
    }

    const cs = Math.min((W - 16) / L.W, (H - 22) / L.H);
    const ox = (W - cs * L.W) / 2, oy = 12 + (H - 22 - cs * L.H);
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        const cell = L.grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        c.fillStyle = th.wall[0];
        c.fillRect(px, py, cs + 0.5, cs + 0.5);
        if (cell.on || cell.dormant) {
          c.fillStyle = cell.dormant ? "rgba(40,40,60,.8)" : C.COLORS[cell.c].fill;
          c.globalAlpha = open ? 1 : 0.45;
          c.fillRect(px + 0.8, py + 0.8, Math.max(1, cs - 1.6), Math.max(1, cs - 1.6));
          c.globalAlpha = 1;
        }
      }
    }
  }

  function openLevel(i, force) {
    if (!force && !isOpenLevel(i)) return;
    try { ac(); } catch (e) {}
    li = i;
    screen = "game";
    $("#menu").hidden = true;
    if ($("#album")) $("#album").hidden = true;
    $("#game").hidden = false;
    loadLevel(i);
  }

  function loadLevel(i) {
    const src = levelAt(i);
    LV = src;
    resetView();
    preview = null;
    holdTimer = 0;
    holdCi = -1;
    if ($("#previewTag")) $("#previewTag").hidden = true;
    if ($("#introCard")) $("#introCard").hidden = true;
    grid = C.cloneGrid(src.grid);
    cols = C.cloneCols(src.cols);
    slots = Array(SLOT_N).fill(null);
    unlocked = { ...(src.unlocked || {}) };
    slotCount = SLOT_N;
    over = false;
    won = false;
    paused = false;
    history = [];
    usedRewind = false;
    usedAd = false;
    workers = [];
    parts = [];
    afterglow = [];
    lah = [];
    meteors = [];
    playTime = 0;
    startTotal = C.leftCount(grid);
    coach = null;
    winTimer = 0;
    takes = 0;
    shakeT = 0;
    glowDirty = true;
    decor = buildDecor(src);
    cars = [0, 1, 2].map((k) => ({ t: k * 0.33, v: 0.04 + (k % 2) * 0.02, dir: k % 2 ? 1 : -1 }));
    skyKey = "";
    $("#loseBox").hidden = true;
    $("#winBox").hidden = true;
    $("#adBox").hidden = true;
    $("#coach").hidden = true;
    $$(".fly").forEach((el) => el.remove());
    renderSlots();
    renderTray();
    updateHud();
    resize();
    if (src.coach) startCoach();
    else if (showChapterIfNeeded(i)) {} else if (!showIntroIfNeeded(i)) toast(src.hint, true);
  }

  function snapshot() {
    return {
      grid: C.cloneGrid(grid),
      cols: C.cloneCols(cols),
      slots: C.cloneSlots(slots),
      unlocked: { ...unlocked },
      slotCount, takes,
    };
  }
  function restore(s) {
    grid = C.cloneGrid(s.grid);
    cols = C.cloneCols(s.cols);
    slots = C.cloneSlots(s.slots);
    for (const sl of slots) if (sl) { sl._busy = false; sl._wait = false; }
    unlocked = { ...s.unlocked };
    slotCount = s.slotCount;
    takes = s.takes || 0;
    workers = [];
    parts = [];
    over = false;
    won = false;
    paused = false;
    glowDirty = true;
    $("#loseBox").hidden = true;
    renderSlots();
    renderTray();
    updateHud();
    resize();
  }

  function startCoach() {
    coach = { i: 0, wait: 0 };
    showCoach();
  }
  function coachPick() {
    const u = C.frontsUseful(grid, cols, unlocked, takes);
    return u.length ? u[0] : 0;
  }
  function showCoach() {
    const el = $("#coach");
    if (!coach || over || won) { el.hidden = true; return; }
    const steps = [
      { k: "tap", html: "点<b>最前排</b>的工单，派出同色的小电工" },
      { k: "read", html: "小电工只会关<b>露在外面</b>的灯，从外往里、从上往下" },
      { k: "read", html: "电闸只有 <b>5</b> 个槽。关不到的颜色会占着，<b>全堵住就电网过载了</b>" },
    ];
    const s = steps[coach.i];
    if (!s) { el.hidden = true; coach = null; toast("把整座城的灯关完就过关，晚安。", true); return; }
    el.hidden = false;
    el.innerHTML = `<div class="bubble">${s.html}${s.k === "read" ? '<div class="next">点一下继续</div>' : ""}</div>`;
    $$(".box").forEach((b) => b.classList.remove("point"));
    if (s.k === "tap") {
      const ci = coachPick();
      const btn = $(`.tcol[data-c="${ci}"] .box[data-k="0"]`);
      if (btn) btn.classList.add("point");
    }
  }
  function coachNext() {
    if (!coach) return;
    coach.i++;
    showCoach();
  }
  function coachBlocks(ci) {
    if (!coach) return false;
    const steps = ["tap", "read", "read"];
    const k = steps[coach.i];
    if (!k || k === "read") return k === "read";
    return ci !== coachPick();
  }

  /* ---------- hud / tray / slots ---------- */
  function updateHud() {
    if (!LV) return;
    $("#lvNo").textContent = `第${li + 1}关 · ${LV.tier}`;
    $("#lvName").textContent = LV.name;
    $("#leftV").textContent = C.leftCount(grid);
    $("#speedBtn").textContent = speed === 1 ? "▶ 1×" : speed === 2 ? "▶ 2×" : "▶ 3×";
    $("#soundBtn").textContent = muted ? "×" : "♪";
    const used = slots.filter((s) => s && !s.hold).length + slots.filter((s) => s && s.hold).length;
    const fill = $("#loadFill");
    if (fill) {
      fill.style.width = (used / slotCount * 100) + "%";
      fill.classList.toggle("hot", used >= slotCount - 1);
    }
  }

  function renderSlots() {
    const bar = $("#slots");
    bar.style.gridTemplateColumns = `repeat(${slotCount}, 1fr)`;
    bar.innerHTML = "";
    for (let i = 0; i < slotCount; i++) {
      const s = slots[i];
      const d = document.createElement("div");
      d.className = "slot" + (s ? " full" : "") + (s && s._wait ? " wait" : "") + (s && s.duo && !s.hold ? " duo" : "") + (s && s.hold ? " hold" : "");
      if (s) {
        const col = C.COLORS[s.c];
        if (s.hold) {
          d.innerHTML = `<button class="box in" style="background:${col.fill};color:${col.ink}"><span class="tag">招牌</span></button>`;
        } else {
          const patCls = (col.pat && col.pat !== "solid") ? (" pat-" + col.pat) : "";
          d.innerHTML = `<button class="box in${patCls}" style="background:${col.fill};color:${col.ink}">${s._wait ? '<span class="sleeper">💤</span>' : ""}${s.n}${s._wait ? '<i class="zz">zz</i>' : ""}${s.duo ? '<span class="tag">双槽</span>' : ""}</button>`;
        }
      }
      bar.appendChild(d);
    }
  }

  function renderTray() {
    const tr = $("#tray");
    tr.innerHTML = "";
    cols.forEach((col, ci) => {
      const d = document.createElement("div");
      d.className = "tcol";
      d.dataset.c = ci;
      const vis = col.slice(0, 3);
      vis.forEach((t, k) => {
        const colr = C.COLORS[t.c];
        const btn = document.createElement("button");
        btn.type = "button";
        const hidden = !!t.hidden;
        btn.className = "box" + (t.duo ? " duo" : "");
        btn.style.background = hidden ? "#3a3558" : colr.fill;
        btn.style.color = hidden ? "#dcd6ff" : colr.ink;
        if (!hidden && colr.pat && colr.pat !== "solid") btn.classList.add("pat-" + colr.pat);
        btn.dataset.k = k;
        btn.textContent = hidden ? "?" : String(t.n);
        if (k === 0) {
          const isGate = colorIsGate(t.c);
          if (isGate) {
            btn.classList.add("gate");
            const m = document.createElement("span");
            m.className = "mechmark";
            m.textContent = gateMark(t.c);
            btn.appendChild(m);
          }
          if (colorHasBlink(t.c)) {
            const m = document.createElement("span");
            m.className = "mechmark";
            m.style.right = "3px"; m.style.left = "auto";
            m.textContent = "闪";
            btn.appendChild(m);
          }
          bindHold(btn, ci);
        } else { btn.tabIndex = -1; btn.classList.add("back"); }
        d.appendChild(btn);
      });
      if (col.length > 3) {
        const m = document.createElement("div");
        m.className = "more";
        m.textContent = "+" + (col.length - 3);
        d.appendChild(m);
      }
      tr.appendChild(d);
    });
    if (coach) showCoach();
  }

  function ensureAppToast() {
    let el = $("#appToast");
    if (el) return el;
    el = document.createElement("div");
    el.id = "appToast";
    ($("#app") || document.body).appendChild(el);
    return el;
  }
  function toast(msg, soft) {
    toastMsg = msg;
    toastT = soft ? 2.2 : 1.6;
    const inGame = $("#game") && !$("#game").hidden;
    const el = inGame && $("#toast") ? $("#toast") : ensureAppToast();
    el.textContent = msg;
    el.hidden = false;
    el.classList.add("show");
    el.classList.toggle("soft", !!soft);
    if (!soft) SFX.toast();
    if (el.id === "appToast") {
      clearTimeout(el._hide);
      el._hide = setTimeout(() => { el.classList.remove("show"); }, (soft ? 2200 : 1600) + 200);
    }
  }

  function flyCard(fromEl, color, text, ink) {
    if (!fromEl) return;
    const r = fromEl.getBoundingClientRect();
    // snapshot dest before renderSlots replaces the nodes
    const dest = $$("#slots .slot").find((s) => !s.classList.contains("full")) || $("#slots .slot");
    const d = dest ? dest.getBoundingClientRect() : r;
    const el = document.createElement("div");
    el.className = "fly";
    el.style.left = r.left + "px";
    el.style.top = r.top + "px";
    el.style.width = r.width + "px";
    el.style.height = r.height + "px";
    el.style.background = color;
    el.style.color = ink;
    el.style.fontSize = "18px";
    el.textContent = text;
    document.body.appendChild(el);
    requestAnimationFrame(() => {
      el.style.left = d.left + "px";
      el.style.top = d.top + "px";
      el.style.transform = "scale(0.88)";
      el.style.opacity = "0.2";
    });
    setTimeout(() => el.remove(), 420);
  }

  /* ---------- interaction ---------- */
  function tapBox(ci, k) {
    if (over || won || paused) return;
    if (coach && coachBlocks(ci)) return;
    if (k > 0) return;
    if (!cols[ci] || !cols[ci][0]) return;
    const t0 = cols[ci][0];
    if (!C.canPlaceTicket(slots, slotCount, t0)) {
      toast(t0.duo ? "这块大招牌要两个挨着的槽" : "电闸槽满了");
      SFX.wait();
      return;
    }
    const from = $(`.tcol[data-c="${ci}"] .box[data-k="0"]`);
    const colr = C.COLORS[t0.c];
    flyCard(from, t0.hidden ? "#3a3558" : colr.fill, t0.hidden ? "?" : String(t0.n), t0.hidden ? "#dcd6ff" : colr.ink);
    history.push(snapshot());
    if (history.length > 24) history.shift();
    const revealed = t0.hidden;
    C.place(cols, slots, ci, slotCount);
    takes++;
    SFX.seat();
    SFX.tap();
    if (revealed) toast("工单现形：" + C.COLORS[slots.find((s) => s && s.c === t0.c && !s.hold).c].name, true);
    if (coach && coach.i === 0) coachNext();
    renderTray();
    renderSlots();
    updateHud();
  }

  function spawnWorker(si, target) {
    const start = slotPt(si);
    const dest = cellXY(target.x, target.y);
    const streetY = geo.streetY;
    const go = [
      { x: start.x, y: start.y },
      { x: start.x, y: streetY },
      { x: dest.x, y: streetY },
      { x: dest.x, y: dest.y },
    ];
    workers.push({
      si, color: slots[si].c, tx: target.x, ty: target.y,
      path: go, s: 0, len: polyLen(go), st: "go", t: 0,
      x: start.x, y: start.y, a: -Math.PI / 2, ph: Math.random() * 6,
      kind: si % 2 === 0 ? "van" : "climb",
      vanX: dest.x,
    });
    slots[si]._busy = true;
    slots[si]._wait = false;
  }

  function polyLen(pts) {
    let n = 0;
    for (let i = 1; i < pts.length; i++) n += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
    return n;
  }
  function atPoly(pts, s) {
    let left = s;
    for (let i = 1; i < pts.length; i++) {
      const d = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
      if (left <= d || i === pts.length - 1) {
        const k = d ? left / d : 1;
        const x = pts[i - 1].x + (pts[i].x - pts[i - 1].x) * k;
        const y = pts[i - 1].y + (pts[i].y - pts[i - 1].y) * k;
        const a = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x);
        return { x, y, a };
      }
      left -= d;
    }
    const last = pts[pts.length - 1];
    return { x: last.x, y: last.y, a: 0 };
  }

  function burst(x, y, col, n) {
    for (let i = 0; i < (n || 10); i++) {
      parts.push({
        x, y,
        vx: (Math.random() - 0.5) * 160,
        vy: -Math.random() * 140 - 20,
        life: 0.35 + Math.random() * 0.28,
        max: 0.65,
        c: col,
        sz: 1.6 + Math.random() * 2.6,
      });
    }
  }

  function step(dt) {
    if (over || paused || !LV || !geo) {
      if (won && winTimer > 0) {
        winTimer -= dt;
        if (winTimer <= 0) showWin();
      }
      stepFx(dt);
      return;
    }
    playTime += dt;
    if (shakeT > 0) shakeT -= dt;
    const rushing = cols.every((c) => !c.length);
    const sp = rushing ? Math.max(speed, 8) : speed;

    for (let i = 0; i < slotCount; i++) {
      const s = slots[i];
      if (s && s._busy && !workers.some((w) => w.si === i)) s._busy = false;
      if (!s || s.n <= 0 || s._busy || s.hold) continue;
      const t = C.findTarget(grid, s.c, unlocked, takes);
      if (!t) {
        if (!s._wait) {
          s._wait = true;
          const anyBlink = (function () {
            for (const row of grid) for (const c of row) if (c && c.on && c.c === s.c && c.blink) return true;
            return false;
          })();
          toast(anyBlink && takes % 2 === 0 ? "灯笼还在亮着，等它暗下去再关" : "这种颜色还埋在里面，小电工在等", true);
        }
        continue;
      }
      spawnWorker(i, t);
    }

    const climb = geo.cs * 22 * sp;
    for (let k = workers.length - 1; k >= 0; k--) {
      const w = workers[k];
      w.ph += dt * 16;
      if (w.st === "go") {
        w.s = Math.min(w.len, w.s + climb * dt);
        const p = atPoly(w.path, w.s);
        w.x = p.x; w.y = p.y; w.a = p.a;
        if (w.s >= w.len - 0.1) { w.st = "work"; w.t = 0; }
      } else if (w.st === "work") {
        w.t += dt * sp;
        if (w.t > 0.08 && !w.did) {
          w.did = true;
          const cell = grid[w.ty][w.tx];
          if (cell && cell.on && cell.c === w.color) {
            const wasKey = !!cell.key;
            const kind = cell.kind;
            const willAwaken = !!(cell.awaken && cell.awaken.length);
            C.turnOff(grid, { x: w.tx, y: w.ty }, unlocked);
            glowDirty = true;
            const col = C.COLORS[w.color].glow;
            burst(w.x, w.y, col, 12);
            afterglow.push({ x: w.x, y: w.y, c: col, t: 1 });
            shakeT = Math.max(shakeT, 0.08);
            SFX.spark();
            SFX.off();
            if (wasKey) {
              SFX.unlock();
              const msg = kind === "button" ? "叮，电梯门开了，中间几层能关了"
                : kind === "breaker" ? "总闸拉开了，整片都有电了"
                : kind === "beacon" ? "航标灭了，那边解锁了"
                : kind === "switch" ? "开关一拉，有些灯亮起来了"
                : "咔哒，锁开了";
              toast(msg, true);
            }
            if (willAwaken) {
              SFX.awaken();
              if (!wasKey) toast("那边一下子亮起来了", true);
            }
            if (slots[w.si]) slots[w.si].n--;
          }
        }
        if (w.t > 0.16) {
          const s = slots[w.si];
          if (s && s.n > 0) {
            const nxt = C.findTarget(grid, s.c, unlocked, takes);
            if (nxt) {
              const dest = cellXY(nxt.x, nxt.y);
              const go = [{ x: w.x, y: w.y }, { x: dest.x, y: w.y }, { x: dest.x, y: dest.y }];
              w.tx = nxt.x; w.ty = nxt.y;
              w.path = go; w.s = 0; w.len = polyLen(go); w.st = "go"; w.t = 0; w.did = false;
            } else {
              w.st = "back"; w.t = 0;
              const sp0 = slotPt(w.si);
              w.path = [{ x: w.x, y: w.y }, { x: w.x, y: geo.streetY }, { x: sp0.x, y: geo.streetY }, { x: sp0.x, y: sp0.y }];
              w.s = 0; w.len = polyLen(w.path);
            }
          } else {
            w.st = "back"; w.t = 0;
            const sp0 = slotPt(w.si);
            w.path = [{ x: w.x, y: w.y }, { x: w.x, y: geo.streetY }, { x: sp0.x, y: geo.streetY }, { x: sp0.x, y: sp0.y }];
            w.s = 0; w.len = polyLen(w.path);
          }
        }
      } else if (w.st === "back") {
        w.s = Math.min(w.len, w.s + climb * 1.15 * dt);
        const p = atPoly(w.path, w.s);
        w.x = p.x; w.y = p.y; w.a = p.a;
        if (w.s >= w.len - 0.1) {
          if (slots[w.si]) slots[w.si]._busy = false;
          workers.splice(k, 1);
        }
      }
    }

    for (let i = 0; i < slotCount; i++) {
      if (slots[i] && slots[i].n <= 0 && !slots[i].hold && !slots[i]._busy && !workers.some((w) => w.si === i && w.st !== "back")) {
        const pt = slotPt(i);
        lah.push({ x: pt.x, y: pt.y - 12, t: 0.7, text: "啦" });
        if (slots[i].duo && slots[i].pair != null) slots[slots[i].pair] = null;
        slots[i] = null;
        SFX.pop();
      }
    }

    const left = C.leftCount(grid);
    const busy = workers.length > 0;
    if (left === 0 && !busy && !won) {
      won = true;
      winTimer = 0.55;
    } else if (!won && !busy && C.isLost(grid, cols, slots, slotCount, unlocked, takes)) {
      showLose();
    }

    if (toastT > 0) {
      toastT -= dt;
      if (toastT <= 0) $("#toast").classList.remove("show");
    }
    if (winTimer > 0) {
      winTimer -= dt;
      if (winTimer <= 0) showWin();
    }
    stepFx(dt);
    const sig = slots.map((s) => (s ? s.c + ":" + s.n + (s._wait ? "w" : "") : "-")).join("|") + "#" + slotCount;
    if (sig !== step._slotSig) { step._slotSig = sig; renderSlots(); updateHud(); }
    else if (Math.floor(playTime * 8) !== step._hudN) { step._hudN = Math.floor(playTime * 8); updateHud(); }
  }

  function stepFx(dt) {
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 220 * dt;
      if (p.life <= 0) parts.splice(i, 1);
    }
    for (let i = afterglow.length - 1; i >= 0; i--) {
      afterglow[i].t -= dt * 2.6;
      if (afterglow[i].t <= 0) afterglow.splice(i, 1);
    }
    for (let i = lah.length - 1; i >= 0; i--) {
      lah[i].t -= dt;
      if (lah[i].t <= 0) lah.splice(i, 1);
    }
    if (LV && Math.random() < dt * (0.15 + darkK() * 0.6) && meteors.length < 2) {
      meteors.push({ x: 0.1 + Math.random() * 0.7, y: 0.02 + Math.random() * 0.12, vx: 0.25 + Math.random() * 0.2, vy: 0.18 + Math.random() * 0.12, t: 0.7 });
    }
    for (let i = meteors.length - 1; i >= 0; i--) {
      const m = meteors[i];
      m.x += m.vx * dt; m.y += m.vy * dt; m.t -= dt;
      if (m.t <= 0 || m.x > 1.2) meteors.splice(i, 1);
    }
    cars.forEach((c) => {
      c.t += c.v * c.dir * dt;
      if (c.t > 1.15) { c.t = -0.1; }
      if (c.t < -0.15) { c.t = 1.1; }
    });
  }

  function showLose() {
    if (over || won) return;
    over = true;
    SFX.lose();
    $("#loseRw").hidden = usedRewind || history.length === 0;
    $("#loseBox").hidden = false;
  }
  function showWin() {
    over = true;
    won = true;
    const starsN = (usedRewind && usedAd) ? 1 : (usedRewind || usedAd) ? 2 : 3;
    const prev = save.stars[li] || 0;
    if (starsN > prev) save.stars[li] = starsN;
    if (save.unlocked < li + 2) save.unlocked = Math.min(MAX_MENU, li + 2);
    persist();
    SFX.win();
    if (LV && LV.theme === "newyear") {
      for (let i = 0; i < 40; i++) {
        const col = C.COLORS[i % C.COLORS.length].glow;
        burst(geo.w * (0.2 + Math.random() * 0.6), geo.sky * (0.3 + Math.random() * 0.4), col, 8);
      }
    }
    $("#winBox").hidden = false;
    $("#winNext").hidden = li >= MAX_MENU - 1;
    const chapterEnd = LV && (li + 1) % PAGE === 0;
    if (chapterEnd && geo) {
      for (let i = 0; i < 36; i++) {
        const col = C.COLORS[i % C.COLORS.length].glow;
        burst(geo.w * (0.15 + Math.random() * 0.7), (geo.sky || 80) * (0.2 + Math.random() * 0.6), col, 8);
      }
    }
    $("#winTitle").textContent = chapterEnd && LV.cityName ? (LV.cityName + "已入睡") : "晚安";
    const starEl = $("#winStars");
    if (starEl) starEl.innerHTML = "★".repeat(starsN) + `<span class="dim">${"★".repeat(3 - starsN)}</span>`;
    $("#winSub").textContent = chapterEnd
      ? ((LV.close || LV.quote || "这座城把星空要了回来。") + (LV.character ? " — " + LV.character : ""))
      : ((LV.quote || "城市已入睡。") + " · " + LV.name);
  }

  function rewind() {
    if (usedRewind || !history.length) return;
    usedRewind = true;
    const steps = Math.min(3, history.length);
    let s = null;
    for (let i = 0; i < steps; i++) s = history.pop();
    restore(s);
    toast("时光倒流，回到 " + steps + " 步之前", true);
  }

  function addSlotFromAd() {
    if (slotCount >= 7) { toast("槽位已经加满了", true); return; }
    slotCount++;
    slots.push(null);
    usedAd = true;
    over = false;
    won = false;
    $("#loseBox").hidden = true;
    renderSlots();
    toast("多了一个电闸槽", true);
    SFX.seat();
  }
  function openAd() {
    adFor = "slot";
    adLeft = 5;
    $("#adBox").hidden = false;
    $("#adSec").textContent = "5";
  }
  function tickAd(dt) {
    if ($("#adBox").hidden) return;
    adLeft -= dt;
    const n = Math.max(0, Math.ceil(adLeft));
    $("#adSec").textContent = String(n);
    if (adLeft <= 0) {
      $("#adBox").hidden = true;
      addSlotFromAd();
    }
  }

  /* ---------- render ---------- */
  function darkK() {
    if (!LV) return 0;
    const left = C.leftCount(grid);
    return 1 - left / Math.max(1, startTotal);
  }

  function draw() {
    if (!geo) return;
    const { w, h } = geo;
    const k = LV ? darkK() : 0;
    const th = themeOf(LV);
    ctx.save();
    if (shakeT > 0) {
      const s = shakeT * 10;
      ctx.translate((Math.random() - 0.5) * s, (Math.random() - 0.5) * s);
    }
    // sky
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, lerpC(th.sky0, "#050510", k * 0.75));
    g.addColorStop(0.5, lerpC(th.sky1, "#070616", k * 0.75));
    g.addColorStop(1, lerpC(th.sky2, "#06050e", k * 0.8));
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);

    // milky way — soft dust, no hard polygon
    if (k > 0.15) {
      ctx.save();
      ctx.globalAlpha = (k - 0.15) * 0.55;
      const yy0 = (geo.sky || 80) * 0.15;
      for (let i = 0; i < 80; i++) {
        const u = i / 80;
        const px = w * (0.05 + u * 0.85);
        const py = yy0 + u * (geo.sky || 80) * 0.7 + Math.sin(i * 1.7) * 10;
        const rr = (i % 5 === 0) ? 1.6 : 0.7;
        ctx.fillStyle = "rgba(220,230,255," + (0.15 + (i % 7) * 0.05) + ")";
        ctx.beginPath();
        ctx.arc(px, py, rr, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    const starA = 0.2 + 0.8 * k;
    for (const s of stars) {
      const tw = 0.55 + 0.45 * Math.sin(playTime * s.s + s.p);
      ctx.globalAlpha = starA * s.b * tw;
      ctx.fillStyle = "#fff8e8";
      ctx.beginPath();
      ctx.arc(s.x * w, s.y * (geo.sky || h * 0.3) * 1.35, s.r * (0.7 + 0.6 * k), 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const m of meteors) {
      ctx.strokeStyle = `rgba(255,245,220,${Math.max(0, m.t)})`;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(m.x * w, m.y * h);
      ctx.lineTo((m.x - m.vx * 0.12) * w, (m.y - m.vy * 0.12) * h);
      ctx.stroke();
    }

    // moon
    const mx = w * 0.82, my = (geo.sky || 80) * 0.38;
    const mr = 16 + 12 * k;
    ctx.fillStyle = `rgba(255,244,214,${0.5 + 0.45 * k})`;
    ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(230,214,170,${0.25 + 0.2 * k})`;
    ctx.beginPath(); ctx.arc(mx - mr * 0.28, my - mr * 0.18, mr * 0.22, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + mr * 0.22, my + mr * 0.2, mr * 0.14, 0, Math.PI * 2); ctx.fill();

    drawSkyline(k, th);
    if (LV && grid) {
      drawLandmark(k, th);
      drawCity(k, th);
      drawMechOverlay();
    }
    drawStreet(k, th);

    for (const a of afterglow) {
      ctx.globalAlpha = Math.max(0, a.t);
      ctx.fillStyle = a.c;
      ctx.beginPath(); ctx.arc(a.x, a.y, 6 + (1 - a.t) * 8, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (const p of parts) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.c;
      ctx.fillRect(p.x, p.y, p.sz, p.sz);
    }
    ctx.globalAlpha = 1;

    if (LV && grid) workers.forEach(drawWorker);

    for (const t of lah) {
      ctx.globalAlpha = Math.max(0, t.t / 0.7);
      ctx.fillStyle = "#fff4c0";
      ctx.font = "bold 16px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(t.text, t.x, t.y - (0.7 - t.t) * 28);
    }
    ctx.globalAlpha = 1;
    ctx.textAlign = "left";
    ctx.restore();
  }

  function drawSkyline(k, th) {
    if (!decor || !geo) return;
    const key = (LV && LV.id) + ":" + ((k * 8) | 0) + ":" + geo.w + ":" + geo.h;
    if (skyKey !== key) {
      skyCv.width = Math.max(1, geo.w);
      skyCv.height = Math.max(1, geo.h);
      skyCtx.clearRect(0, 0, skyCv.width, skyCv.height);
      const streetY = geo.streetY || geo.h - 70;
      const horizon = streetY - 6;
      const fill = skyCtx;
      const paint = (list, heightMul, winA, shade) => {
        for (const b of list) {
          const x = b.x * geo.w;
          const bw = Math.max(8, b.w * geo.w);
          const bh = b.h * horizon * heightMul;
          const y = horizon - bh;
          fill.fillStyle = lerpC(b.wall, "#050508", shade + k * 0.25);
          fill.fillRect(x, y, bw, bh + 2);
          // left highlight so silhouettes read against the sky
          fill.fillStyle = hexA(b.edge || "#8890aa", 0.18);
          fill.fillRect(x, y, 1.4, bh);
          if (b.roof === 0) {
            fill.fillStyle = lerpC(b.wall, "#050508", shade + k * 0.25);
            fill.beginPath();
            fill.moveTo(x - 1, y);
            fill.lineTo(x + bw / 2, y - Math.min(16, bw * 0.35));
            fill.lineTo(x + bw + 1, y);
            fill.fill();
          } else if (b.roof === 1 || b.spire) {
            fill.fillStyle = lerpC(b.wall, "#050508", shade);
            fill.fillRect(x + bw * 0.42, y - 16, Math.max(2, bw * 0.12), 16);
            if (b.spire) {
              fill.fillStyle = hexA(th.accent, 0.45 * (1 - k * 0.5));
              fill.fillRect(x + bw * 0.42 + 0.5, y - 18, 2, 2);
            }
          } else if (b.roof === 2) {
            fill.fillStyle = lerpC(b.wall, "#050508", shade);
            fill.fillRect(x, y - 5, bw, 5);
          }
          const cw = bw / (b.cols + 1), ch = bh / (b.rows + 2);
          fill.fillStyle = hexA(th.accent, winA * b.lit * (1 - k * 0.7));
          for (const i of b.wins) {
            const cx = i % b.cols, cy = (i / b.cols) | 0;
            fill.fillRect(x + cw * (cx + 0.45), y + ch * (cy + 0.8), Math.max(1.4, cw * 0.5), Math.max(1.4, ch * 0.5));
          }
        }
      };
      paint(decor.skylineFar || [], 0.70, 0.08, 0.62);
      paint(decor.skylineMid || decor.skyline || [], 0.52, 0.12, 0.50);
      skyKey = key;
    }
    ctx.drawImage(skyCv, 0, 0);
  }

  function drawCity(k, th) {
    const { cs, ox, oy } = geo;
    // facades first
    if (decor) {
      for (const b of decor.blds) {
        const x = ox + b.x0 * cs, y = oy + b.y0 * cs;
        const bw = (b.x1 - b.x0 + 1) * cs, bh = (b.y1 - b.y0 + 1) * cs;
        ctx.fillStyle = b.wall;
        ctx.fillRect(x - 2, y - 2, bw + 4, bh + 6);
        // left pipe
        if (b.pipe) {
          ctx.fillStyle = "#2a2a38";
          ctx.fillRect(x - 4, y + 8, 3, bh - 10);
        }
        // roof
        ctx.fillStyle = lerpC(b.wall2, th.accent, 0.08);
        const rx = x - 3, ry = y, rw = bw + 6;
        if (b.roof === 0) {
          ctx.beginPath();
          ctx.moveTo(rx - 2, ry);
          ctx.lineTo(rx + rw / 2, ry - Math.min(18, cs * 1.4));
          ctx.lineTo(rx + rw + 2, ry);
          ctx.closePath();
          ctx.fill();
        } else if (b.roof === 1) {
          ctx.fillRect(rx, ry - 6, rw, 6);
          ctx.fillStyle = b.wall2;
          ctx.fillRect(rx + rw * 0.35, ry - 16, rw * 0.3, 10);
        } else if (b.roof === 2) {
          ctx.fillRect(rx, ry - 5, rw, 5);
          if (b.tower) {
            ctx.fillStyle = "#2a2838";
            ctx.fillRect(rx + rw * 0.6, ry - 20, cs * 0.7, 16);
            ctx.beginPath(); ctx.arc(rx + rw * 0.6 + cs * 0.35, ry - 20, cs * 0.38, Math.PI, 0); ctx.fill();
          }
        } else if (b.roof === 3) {
          ctx.beginPath();
          ctx.moveTo(rx, ry);
          ctx.lineTo(rx + 4, ry - 8);
          ctx.lineTo(rx + rw - 4, ry - 8);
          ctx.lineTo(rx + rw, ry);
          ctx.fill();
        } else {
          ctx.fillRect(rx, ry - 4, rw, 4);
        }
        if (b.antenna) {
          ctx.strokeStyle = "#4a4860";
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(x + bw * 0.2, y - 4);
          ctx.lineTo(x + bw * 0.2, y - 18 - (cs > 12 ? 6 : 0));
          ctx.stroke();
          ctx.fillStyle = hexA(th.accent, 0.5 + 0.5 * Math.sin(playTime * 3 + b.x0));
          ctx.beginPath(); ctx.arc(x + bw * 0.2, y - 18, 1.8, 0, Math.PI * 2); ctx.fill();
        }
        // AC units
        ctx.fillStyle = "#2a3040";
        for (let i = 0; i < b.ac; i++) {
          const ax = x + 4 + i * Math.max(10, cs * 1.1);
          const ay = oy + (b.y1 + 0.15) * cs - 5;
          if (ax < x + bw - 8) ctx.fillRect(ax, ay, 8, 5);
        }
        // neon signboard sits on the roof, not over windows
        if (b.sign && bw > cs * 1.6) {
          const tw = Math.min(bw - 4, Math.max(28, b.sign.length * Math.max(8, cs * 0.7) + 10));
          const thh = Math.max(11, cs * 0.7);
          const sx = x + (bw - tw) / 2;
          const sy = y - thh - 6;
          ctx.fillStyle = "rgba(10,8,20,0.88)";
          ctx.fillRect(sx, sy, tw, thh);
          ctx.strokeStyle = hexA(th.accent, 0.55 + 0.35 * (1 - k));
          ctx.lineWidth = 1;
          ctx.strokeRect(sx + 0.5, sy + 0.5, tw - 1, thh - 1);
          ctx.save();
          ctx.font = `bold ${Math.max(8, cs * 0.5)}px "PingFang SC","Noto Sans SC",sans-serif`;
          ctx.fillStyle = hexA(th.accent, 0.55 + 0.4 * (1 - k));
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(b.sign, x + bw / 2, sy + thh / 2);
          ctx.textBaseline = "alphabetic";
          ctx.restore();
        }
      }
    }

    // bloom of playable lights
    const sig = lightKey();
    if (glowDirty || sig !== lightSig) {
      rebuildBloom();
      lightSig = sig;
      glowDirty = false;
    }
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.85;
    ctx.drawImage(bloomCv, 0, 0, geo.w, geo.h);
    ctx.restore();

    // windows
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const cell = grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        const pad = Math.max(1, cs * 0.16);
        const locked = cell.lock && !unlocked[cell.lock];
        const blinkDim = cell.blink && (takes % 2 === 1);
        const style = hash(x * 73 + y * 911 + seedOf(LV.id)) % 5;

        // shutter overlay later
        if (cell.dormant) {
          ctx.fillStyle = "rgba(18,16,30,0.95)";
          ctx.fillRect(px + pad, py + pad, cs - pad * 2, cs - pad * 2);
          ctx.strokeStyle = "rgba(80,80,110,0.35)";
          ctx.strokeRect(px + pad, py + pad, cs - pad * 2, cs - pad * 2);
          continue;
        }
        if (!cell.on) {
          ctx.fillStyle = "rgba(10,10,20,0.92)";
          ctx.fillRect(px + pad * 0.8, py + pad * 0.8, cs - pad * 1.6, cs - pad * 1.6);
          continue;
        }
        const col = C.COLORS[cell.c];
        let a = locked ? 0.28 : 1;
        if (cell.blink) a *= blinkDim ? 0.35 : 1;
        ctx.globalAlpha = a;
        ctx.fillStyle = col.fill;
        const wx = px + pad, wy = py + pad, ww = cs - pad * 2, wh = cs - pad * 2;
        if (style === 1) {
          ctx.fillRect(wx, wy, ww, wh);
          ctx.fillStyle = "rgba(10,8,20,0.35)";
          ctx.fillRect(wx + ww / 2 - 0.6, wy, 1.2, wh);
          ctx.fillRect(wx, wy + wh / 2 - 0.6, ww, 1.2);
        } else if (style === 2) {
          ctx.beginPath();
          ctx.roundRect ? ctx.roundRect(wx, wy, ww, wh, 2) : ctx.rect(wx, wy, ww, wh);
          ctx.fill();
        } else if (style === 3) {
          const tw = ww / 3;
          for (let i = 0; i < 3; i++) ctx.fillRect(wx + i * tw + 0.4, wy, tw - 0.8, wh);
        } else if (style === 4) {
          ctx.fillRect(wx, wy, ww, wh * 0.45);
          ctx.fillRect(wx, wy + wh * 0.55, ww, wh * 0.45);
        } else {
          ctx.fillRect(wx, wy, ww, wh);
        }
        if (C.drawColorPattern && col.pat) C.drawColorPattern(ctx, wx, wy, ww, wh, col.pat, col.ink, locked ? 0.35 : 0.5);
        ctx.globalAlpha = 1;
        // special kinds
        if (cell.key || cell.kind === "button" || cell.kind === "breaker" || cell.kind === "switch" || cell.kind === "beacon") {
          ctx.strokeStyle = "#fff4c0";
          ctx.lineWidth = 1.2;
          ctx.strokeRect(wx - 1, wy - 1, ww + 2, wh + 2);
          ctx.fillStyle = "#fff8e0";
          ctx.font = `bold ${Math.max(7, cs * 0.42)}px sans-serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          const mark = cell.kind === "breaker" ? "闸" : cell.kind === "button" ? "梯" : cell.kind === "switch" ? "开" : cell.kind === "beacon" ? "标" : "钥";
          ctx.fillText(mark, px + cs / 2, py + cs / 2);
          ctx.textBaseline = "alphabetic";
        }
        if (cell.kind === "sign" && cell.on) {
          ctx.fillStyle = hexA("#fff4c0", 0.35 + 0.25 * Math.sin(playTime * 4 + x));
          ctx.fillRect(wx, wy, ww, 1.5);
        }
        if (cell.kind === "shutter" && locked) {
          ctx.fillStyle = "rgba(20,22,30,0.72)";
          ctx.fillRect(px, py, cs, cs);
          ctx.strokeStyle = "rgba(70,80,100,0.8)";
          ctx.lineWidth = 1;
          for (let i = 1; i < 4; i++) {
            ctx.beginPath();
            ctx.moveTo(px, py + (cs * i) / 4);
            ctx.lineTo(px + cs, py + (cs * i) / 4);
            ctx.stroke();
          }
        }
        if (locked && cell.kind === "zone") {
          ctx.fillStyle = "rgba(0,0,0,0.35)";
          ctx.fillRect(px, py, cs, cs);
        }
      }
    }
    if (LV.landmark) drawLandmarkOutline(ox, oy, cs, th);
    ctx.textAlign = "left";
  }

  // Landmark silhouette outline: keeps the shape readable even when locks/shutters dim the windows.
  function drawLandmarkOutline(ox, oy, cs, th) {
    const H = LV.H, W = LV.W;
    const has = (x, y) => x >= 0 && y >= 0 && x < W && y < H && !!grid[y][x];
    // landmark = cells right of the first fully empty column after the gatehouse
    let split = 0;
    for (let x = 0; x < W; x++) {
      let any = false;
      for (let y = 0; y < H; y++) if (grid[y][x]) { any = true; break; }
      if (!any && x > 0) { split = x; break; }
    }
    ctx.save();
    ctx.strokeStyle = hexA((th && th.accent) || "#fff4c0", 0.75);
    ctx.lineWidth = Math.max(1.2, cs * 0.12);
    ctx.shadowColor = (th && th.accent) || "#fff4c0";
    ctx.shadowBlur = Math.max(2, cs * 0.5);
    ctx.beginPath();
    for (let y = 0; y < H; y++) {
      for (let x = split; x < W; x++) {
        if (!grid[y][x]) continue;
        const px = ox + x * cs, py = oy + y * cs;
        if (!has(x, y - 1)) { ctx.moveTo(px, py); ctx.lineTo(px + cs, py); }
        if (!has(x - 1, y)) { ctx.moveTo(px, py); ctx.lineTo(px, py + cs); }
        if (!has(x + 1, y)) { ctx.moveTo(px + cs, py); ctx.lineTo(px + cs, py + cs); }
      }
    }
    ctx.stroke();
    ctx.restore();
  }

  function lightKey() {
    if (!grid) return "";
    let s = takes + ":";
    for (const row of grid) for (const c of row) s += c && c.on ? (c.c + (c.blink ? "b" : "") + (c.lock && !unlocked[c.lock] ? "L" : "")) : ".";
    return s;
  }
  function rebuildBloom() {
    const scale = 0.35;
    bloomCv.width = Math.max(1, (geo.w * scale) | 0);
    bloomCv.height = Math.max(1, (geo.h * scale) | 0);
    bloomCtx.clearRect(0, 0, bloomCv.width, bloomCv.height);
    if (!grid || !LV) return;
    const { cs, ox, oy } = geo;
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on) continue;
        if (cell.lock && !unlocked[cell.lock]) continue;
        if (cell.blink && takes % 2 === 1) continue;
        const px = (ox + (x + 0.5) * cs) * scale;
        const py = (oy + (y + 0.5) * cs) * scale;
        const spr = glowSprites[cell.c];
        const sz = cs * 3.2 * scale;
        bloomCtx.drawImage(spr, px - sz / 2, py - sz / 2, sz, sz);
      }
    }
  }

  function drawStreet(k, th) {
    const y = geo.streetY || geo.h - 70;
    const w = geo.w, h = geo.h;
    const water = !!(LV && (LV.water || themeOf(LV).water));
    if (water) {
      const wh = 28;
      const wy = y - wh;
      const wg = ctx.createLinearGradient(0, wy, 0, y);
      wg.addColorStop(0, hexA(th.waterHi || "#2a5080", 0.0));
      wg.addColorStop(0.2, hexA(th.water || "#101c32", 0.55));
      wg.addColorStop(1, hexA(th.water || "#101c32", 0.9));
      ctx.fillStyle = wg;
      ctx.fillRect(0, wy, w, wh + 2);
      // reflections of lights
      if (grid && LV) {
        ctx.save();
        ctx.beginPath(); ctx.rect(0, wy, w, wh); ctx.clip();
        ctx.globalAlpha = 0.5 * (1 - k * 0.25);
        ctx.translate(0, y + (y - 8) - (geo.oy + LV.H * geo.cs));
        ctx.scale(1, -0.45);
        // rough: draw colored strips under buildings
        for (let yy = 0; yy < LV.H; yy++) {
          for (let xx = 0; xx < LV.W; xx++) {
            const cell = grid[yy][xx];
            if (!cell || !cell.on) continue;
            if (cell.lock && !unlocked[cell.lock]) continue;
            ctx.fillStyle = C.COLORS[cell.c].fill;
            const px = geo.ox + xx * geo.cs, py = geo.oy + yy * geo.cs;
            ctx.fillRect(px, py, geo.cs, geo.cs);
          }
        }
        ctx.restore();
        // ripples
        ctx.strokeStyle = hexA("#c8e4ff", 0.12);
        ctx.lineWidth = 1;
        for (let i = 0; i < 4; i++) {
          const ry = wy + 4 + i * 5 + Math.sin(playTime * 1.4 + i) * 1.2;
          ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(w, ry); ctx.stroke();
        }
      }
    }
    // quay / pavement
    ctx.fillStyle = "#12101c";
    ctx.fillRect(0, y - 3, w, 6);
    ctx.fillStyle = "#1a1730";
    ctx.fillRect(0, y, w, h - y);
    // lamps
    if (decor) {
      for (const lp of decor.lamps) {
        const lx = lp.t * w;
        ctx.fillStyle = "#2a2838";
        ctx.fillRect(lx - 1.2, y - 26, 2.4, 26);
        ctx.fillStyle = hexA("#ffd56a", 0.35 + 0.35 * (1 - k));
        ctx.beginPath(); ctx.arc(lx, y - 26, 3.2, 0, Math.PI * 2); ctx.fill();
        const lg = ctx.createRadialGradient(lx, y - 26, 1, lx, y - 26, 18);
        lg.addColorStop(0, hexA("#ffd56a", 0.25 * (1 - k * 0.5)));
        lg.addColorStop(1, hexA("#ffd56a", 0));
        ctx.fillStyle = lg;
        ctx.fillRect(lx - 18, y - 44, 36, 44);
      }
    }
    // cars
    for (const c of cars) {
      const cx = c.t * w;
      const cy = y - 4;
      ctx.fillStyle = "#1a1828";
      ctx.fillRect(cx, cy - 6, 16, 6);
      ctx.fillStyle = c.dir > 0 ? "#ff5a4a" : "#ffd56a";
      ctx.globalAlpha = 0.8;
      ctx.fillRect(c.dir > 0 ? cx : cx + 13, cy - 4, 3, 2);
      ctx.globalAlpha = 1;
    }
  }

  function drawWorker(w) {
    const col = C.COLORS[w.color].fill;
    const onStreet = Math.abs(w.y - geo.streetY) < 20 && (w.st === "go" || w.st === "back");
    if (w.kind === "van" && (onStreet || w.st === "go" || w.st === "back" || w.st === "work")) {
      const vx = onStreet ? w.x : w.vanX;
      const vy = geo.streetY;
      if (Math.abs((onStreet ? w.x : vx) - w.vanX) < geo.w) drawVan(onStreet ? w.x : w.vanX, vy, col, w.a > 0);
    }
    let bumpX = 0, bumpY = 0;
    const near = workers.filter((o) => Math.hypot(o.x - w.x, o.y - w.y) < 18);
    const idx = near.indexOf(w);
    if (near.length > 1 && idx >= 0) {
      bumpX = (idx - (near.length - 1) / 2) * 12;
      bumpY = (idx % 2) * 8;
    }
    ctx.save();
    ctx.translate(w.x + bumpX, w.y + bumpY);
    ctx.scale(1.65, 1.65);
    const walk = Math.sin(w.ph) * 2;
    // wand
    ctx.strokeStyle = col;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(6, -2);
    ctx.lineTo(11, -8 + (w.st === "work" ? -2 : 0));
    ctx.stroke();
    if (w.st === "work") {
      ctx.fillStyle = "#fff4c0";
      ctx.globalAlpha = 0.7 + 0.3 * Math.sin(playTime * 30);
      ctx.beginPath(); ctx.arc(11, -10, 3.2, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    // toolbox
    ctx.fillStyle = "#3a2a10";
    ctx.fillRect(4, 1, 5, 4);
    ctx.fillStyle = col;
    ctx.fillRect(4, 1, 5, 1.4);
    // body
    ctx.fillStyle = "#1c1a28";
    ctx.fillRect(-4, -2 + walk * 0.2, 8, 9);
    ctx.fillStyle = "#2a4060";
    ctx.fillRect(-4, -1, 8, 4);
    // head + hat
    ctx.fillStyle = "#f1d2b0";
    ctx.beginPath(); ctx.arc(0, -5.2, 3.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#ffd56a";
    ctx.fillRect(-3.8, -9.2, 7.6, 2.6);
    ctx.fillRect(-1.1, -11.2, 2.2, 2);
    // legs
    ctx.fillStyle = "#2a2738";
    ctx.fillRect(-3.2, 7, 2.4, 4.5 + walk);
    ctx.fillRect(1, 7, 2.4, 4.5 - walk);
    ctx.restore();
  }

  function drawVan(x, y, col, flip) {
    ctx.save();
    ctx.translate(x, y + 2);
    if (flip) ctx.scale(-1, 1);
    ctx.fillStyle = "#1a1830";
    ctx.fillRect(-14, -12, 28, 13);
    ctx.fillStyle = col;
    ctx.fillRect(-14, -12, 28, 4);
    ctx.fillStyle = "#7ee7ff";
    ctx.globalAlpha = 0.7;
    ctx.fillRect(4, -9, 8, 4);
    ctx.globalAlpha = 1;
    // boom
    ctx.strokeStyle = "#4a4860";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, -12);
    ctx.lineTo(8, -22);
    ctx.stroke();
    ctx.fillStyle = "#2a2738";
    ctx.beginPath(); ctx.arc(-7, 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(8, 2, 3, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }


  function colorIsGate(color) {
    if (!grid) return false;
    for (const row of grid) for (const c of row)
      if (c && c.c === color && (c.key || (c.awaken && c.awaken.length))) return true;
    return false;
  }
  function gateMark(color) {
    if (!grid) return "";
    for (const row of grid) for (const c of row) {
      if (c && c.c === color && (c.key || (c.awaken && c.awaken.length))) {
        if (c.kind === "button") return "梯";
        if (c.kind === "breaker") return "闸";
        if (c.kind === "switch" || (c.awaken && c.awaken.length)) return "亮";
        if (c.kind === "beacon") return "标";
        return "钥";
      }
    }
    return "钥";
  }
  function colorHasBlink(color) {
    if (!grid) return false;
    for (const row of grid) for (const c of row) if (c && c.on && c.c === color && c.blink) return true;
    return false;
  }
  function mechHue(kind, lockId) {
    const map = (G && G.MECH_META) || {};
    if (kind === "shutter") return (map.shutter || {}).hue || "#7ee7ff";
    if (kind === "breaker" || kind === "zone") return (map.breaker || {}).hue || "#8dffc1";
    if (kind === "switch" || kind === "screen") return (map.awaken || {}).hue || "#c9a6ff";
    if (kind === "button") return (map.shutter || {}).hue || "#7ee7ff";
    return (map.lock || {}).hue || "#ffd56a";
  }

  function bindHold(btn, ci) {
    const start = (e) => {
      if (over || won || paused) return;
      if (e && e.pointerType === "mouse" && e.button !== 0) return;
      holdCi = ci;
      clearTimeout(holdTimer);
      holdTimer = setTimeout(() => startPreview(ci), 280);
    };
    const end = (e) => {
      const ready = holdCi === ci;
      const had = preview && preview.ci === ci;
      clearTimeout(holdTimer);
      holdTimer = 0;
      holdCi = -1;
      if (had) { endPreview(); return; }
      if (ready) tapBox(ci, 0);
    };
    const cancel = () => {
      clearTimeout(holdTimer);
      holdTimer = 0;
      holdCi = -1;
      endPreview();
    };
    btn.onpointerdown = start;
    btn.onpointerup = end;
    btn.onpointercancel = cancel;
  }
  function startPreview(ci) {
    if (!cols[ci] || !cols[ci][0] || !grid) return;
    const t = cols[ci][0];
    const cells = [];
    for (let y = 0; y < LV.H; y++)
      for (let x = 0; x < LV.W; x++)
        if (grid[y][x] && grid[y][x].on && grid[y][x].c === t.c && C.isReachable(grid, x, y, unlocked, takes))
          cells.push([x, y]);
    preview = { ci, cells, waiting: !cells.length, duo: !!t.duo, canPlace: C.canPlaceTicket(slots, slotCount, t) };
    const tag = $("#previewTag");
    if (tag) tag.hidden = true;
    const btn = $(`.tcol[data-c="${ci}"] .box[data-k="0"]`);
    if (btn) btn.classList.add("previewing");
  }
  function endPreview() {
    if (!preview) return;
    const ci = preview.ci;
    preview = null;
    const tag = $("#previewTag");
    if (tag) tag.hidden = true;
    $$(".box.previewing").forEach((b) => b.classList.remove("previewing"));
  }

    if (id === "hidden") return '<div class="city"></div><div class="q">?</div>';

  function drawLandmark(k, th) {
    if (!LV || !geo) return;
    const type = LV.landmarkType || (th && th.landmark);
    if (!type || !window.NightLandmarks) return;
    const special = !!LV.landmark;
    const s = Math.min(geo.w * 0.42, Math.max(90, (geo.oy || 80) * (special ? 0.85 : 0.62)));
    // sit in the sky above the shortest roof on the right, or just above playable tops
    let cx = geo.w * 0.78, ground = (geo.oy || 80) - 4;
    if (grid && LV && geo.cs) {
      let bestRoof = 0, bestX = cx, found = false;
      const x0 = Math.floor(LV.W * 0.45);
      for (let gx = x0; gx < LV.W; gx++) {
        let roof = LV.H;
        for (let gy = 0; gy < LV.H; gy++) {
          if (grid[gy][gx]) { roof = gy; break; }
        }
        if (roof >= bestRoof) { bestRoof = roof; bestX = geo.ox + (gx + 0.5) * geo.cs; found = true; }
      }
      if (found && bestRoof > 1) {
        cx = bestX;
        ground = geo.oy + bestRoof * geo.cs - 2;
      } else {
        // fully built skyline: draw behind / above the roofs at the right third
        cx = geo.ox + LV.W * geo.cs * 0.78;
        ground = geo.oy - 2;
      }
    }
    // keep silhouette in the sky band if there is room
    if (ground - s < 12) ground = Math.min(ground + (s - ground + 16), (geo.oy || 80) - 2);
    const lit = 1 - (k || 0) * 0.75;
    window.NightLandmarks.draw(ctx, type, cx, ground, s, {
      wall: (th && th.wall && th.wall[0]) || "#0a0c14",
      accent: (th && th.accent) || "#ffd56a",
      lit: special ? Math.max(0.25, lit) : Math.max(0.15, lit * 0.7),
    });
  }

  function drawMechOverlay() {
    if (!grid || !geo || !LV) return;
    const { cs, ox, oy } = geo;
    const groups = {};
    const switches = [];
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const c = grid[y][x];
        if (!c) continue;
        if (c.lock) {
          const g = groups[c.lock] || (groups[c.lock] = { id: c.lock, cells: [], key: null, kind: c.kind, locked: !unlocked[c.lock] });
          g.cells.push([x, y]);
          if (c.kind === "shutter") g.kind = "shutter";
          if (c.kind === "zone") g.kind = g.kind || "zone";
        }
        if (c.key) {
          const g = groups[c.key] || (groups[c.key] = { id: c.key, cells: [], key: null, kind: c.kind, locked: !unlocked[c.key] });
          g.key = [x, y];
          g.keyKind = c.kind;
        }
        if (c.awaken && c.awaken.length) switches.push({ x, y, cells: c.awaken });
      }
    }
    // lock / shutter / breaker links
    Object.values(groups).forEach((g) => {
      if (!g.cells.length) return;
      const hue = mechHue(g.kind || g.keyKind);
      const mark = (g.kind === "shutter" || g.keyKind === "button") ? "梯"
        : (g.kind === "zone" || g.keyKind === "breaker") ? "闸"
        : "钥";
      // bounding box
      let x0 = 99, y0 = 99, x1 = 0, y1 = 0;
      g.cells.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
      const cx = ox + ((x0 + x1 + 1) / 2) * cs;
      const cy = oy + ((y0 + y1 + 1) / 2) * cs;
      if (g.locked) {
        ctx.save();
        ctx.strokeStyle = hue;
        ctx.globalAlpha = 0.7;
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(ox + x0 * cs + 1, oy + y0 * cs + 1, (x1 - x0 + 1) * cs - 2, (y1 - y0 + 1) * cs - 2);
        ctx.setLineDash([]);
        // padlock
        ctx.globalAlpha = 0.9;
        ctx.fillStyle = hue;
        ctx.font = `bold ${Math.max(9, cs * 0.55)}px sans-serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        g._cx = cx; g._cy = cy; g._x0 = x0; g._y0 = y0; g._x1 = x1; g._y1 = y1;
        ctx.fillText("锁", cx, cy - cs * 0.15);
        ctx.restore();
      }
      if (g.key) {
        const kx = ox + (g.key[0] + 0.5) * cs;
        const ky = oy + (g.key[1] + 0.5) * cs;
        ctx.save();
        ctx.strokeStyle = hue;
        ctx.globalAlpha = g.locked ? 0.8 : 0.3;
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 4]);
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(cx, cy); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = hue;
        ctx.strokeStyle = "#140d08";
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(kx, ky - cs * 0.45, Math.max(6, cs * 0.32), 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.fillStyle = "#1a1020";
        ctx.font = `bold ${Math.max(7, cs * 0.32)}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText(mark, kx, ky - cs * 0.45);
        ctx.restore();
      }
    });
    // awaken: dark cells + line from switch
    switches.forEach((s) => {
      const still = s.cells.some(([x, y]) => grid[y][x] && grid[y][x].dormant);
      const hue = "#c9a6ff";
      let x0 = 99, y0 = 99, x1 = 0, y1 = 0;
      s.cells.forEach(([x, y]) => { x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y); });
      const cx = ox + ((x0 + x1 + 1) / 2) * cs;
      const cy = oy + ((y0 + y1 + 1) / 2) * cs;
      const kx = ox + (s.x + 0.5) * cs, ky = oy + (s.y + 0.5) * cs;
      if (still) {
        ctx.save();
        ctx.strokeStyle = hue;
        ctx.globalAlpha = 0.75;
        ctx.lineWidth = 1.4;
        ctx.setLineDash([4, 3]);
        ctx.strokeRect(ox + x0 * cs + 1, oy + y0 * cs + 1, (x1 - x0 + 1) * cs - 2, (y1 - y0 + 1) * cs - 2);
        ctx.beginPath(); ctx.moveTo(kx, ky); ctx.lineTo(cx, cy); ctx.stroke();
        ctx.setLineDash([]);
        let dy = 0;
        Object.values(groups).forEach((g) => {
          if (!g.locked || g._x0 == null) return;
          const overlap = !(x1 < g._x0 || x0 > g._x1 || y1 < g._y0 || y0 > g._y1);
          if (overlap) dy = cs * 0.7;
        });
        ctx.fillStyle = hue;
        ctx.font = `bold ${Math.max(9, cs * 0.5)}px sans-serif`;
        ctx.textAlign = "center"; ctx.textBaseline = "middle";
        ctx.fillText("待亮", cx, cy + dy);
        if (dy) {
          ctx.font = `bold ${Math.max(7, cs * 0.32)}px sans-serif`;
          ctx.globalAlpha = 0.95;
          ctx.fillStyle = "#f3efe4";
          ctx.fillText("先开锁，再开灯", cx, cy - cs * 0.85);
        }
        ctx.beginPath(); ctx.arc(kx, ky - cs * 0.45, Math.max(6, cs * 0.32), 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#1a1020";
        ctx.font = `bold ${Math.max(7, cs * 0.32)}px sans-serif`;
        ctx.fillText("亮", kx, ky - cs * 0.45);
        ctx.restore();
      }
    });
    // blink pulse rings + badge
    for (let y = 0; y < LV.H; y++) {
      for (let x = 0; x < LV.W; x++) {
        const c = grid[y][x];
        if (!c || !c.on || !c.blink) continue;
        const dim = takes % 2 === 1;
        ctx.save();
        ctx.globalAlpha = dim ? 0.95 : 0.7;
        ctx.strokeStyle = "#ffd0e4";
        ctx.lineWidth = dim ? 2 : 1.4;
        ctx.strokeRect(ox + x * cs + 1.2, oy + y * cs + 1.2, cs - 2.4, cs - 2.4);
        const leftEdge = x === 0 || !grid[y][x - 1] || !grid[y][x - 1].blink;
        const topEdge = y === 0 || !grid[y - 1][x] || !grid[y - 1][x].blink;
        if (leftEdge && topEdge) {
          const bx = ox + x * cs + 1, by = oy + y * cs - Math.max(9, cs * 0.42);
          const bw = Math.max(16, cs * 0.72), bh = Math.max(10, cs * 0.42);
          ctx.globalAlpha = 1;
          ctx.fillStyle = "#2a1020";
          ctx.strokeStyle = "#ff8ab8";
          ctx.lineWidth = 1;
          ctx.beginPath();
          if (ctx.roundRect) ctx.roundRect(bx, by, bw, bh, 3);
          else ctx.rect(bx, by, bw, bh);
          ctx.fill(); ctx.stroke();
          ctx.fillStyle = "#ffd0e4";
          ctx.font = `bold ${Math.max(8, cs * 0.34)}px sans-serif`;
          ctx.textAlign = "center"; ctx.textBaseline = "middle";
          ctx.fillText("闪", bx + bw / 2, by + bh / 2 + 0.5);
        }
        ctx.restore();
      }
    }
    // hold-to-preview no longer reveals whether the ticket can work.
  }

  /* ---------- loop ---------- */
  function frame(t) {
    const dt = Math.min(0.05, (t - lastT) / 1000 || 0.016);
    lastT = t;
    acc += dt;
    tickAd(dt);
    if (screen === "game") step(dt);
    draw();
    requestAnimationFrame(frame);
  }

  /* ---------- events ---------- */
  $("#backBtn").onclick = openMenu;
  $("#speedBtn").onclick = () => { if (over) return; speed = speed === 1 ? 2 : speed === 2 ? 3 : 1; updateHud(); };
  $("#soundBtn").onclick = () => { muted = !muted; try { ac(); } catch (e) {} updateHud(); };
  $("#loseMenu").onclick = openMenu;
  $("#loseRetry").onclick = () => loadLevel(li);
  $("#winMenu").onclick = openMenu;
  $("#winRetry").onclick = () => loadLevel(li);
  if ($("#winAlbum")) $("#winAlbum").onclick = () => { openAlbum(); };
  $("#winNext").onclick = () => {
    const n = li + 1;
    if (n < MAX_MENU && isOpenLevel(n)) openLevel(n);
    else openMenu();
  };
  $("#loseRw").onclick = rewind;
  $("#loseAd").onclick = openAd;
  $("#adSkip").onclick = () => { $("#adBox").hidden = true; addSlotFromAd(); };
  $("#coach").onclick = () => { if (coach) coachNext(); };

  const brand = $("#brandTitle") || $(".brand h1");
  if (brand) {
    brand.addEventListener("click", () => {
      const now = Date.now();
      titleClicks = titleClicks.filter((t) => now - t < 2500);
      titleClicks.push(now);
      if (titleClicks.length >= 5) {
        titleClicks = [];
        save.all = true;
        persist();
        renderMenu();
        toast("测试用：已全部解锁", true);
      }
    });
  }

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", () => setTimeout(resize, 80));

  if ($("#pagePrev")) $("#pagePrev").onclick = () => { menuPage--; renderMenu(); };
  if ($("#pageNext")) $("#pageNext").onclick = () => { menuPage++; renderMenu(); };
  if ($("#albumBtn")) $("#albumBtn").onclick = openAlbum;
  if ($("#albumBack")) $("#albumBack").onclick = openMenu;
  if ($("#cardClose")) $("#cardClose").onclick = () => { $("#cardView").hidden = true; };
  if ($("#introOk")) $("#introOk").onclick = dismissIntro;
  if ($("#storyOk")) $("#storyOk").onclick = dismissStory;
  if ($("#worldMap")) {
    $("#worldMap").addEventListener("click", (ev) => {
      const WW = window.NightWorld;
      if (!WW) return;
      const cv = $("#worldMap");
      const r = cv.getBoundingClientRect();
      const x = (ev.clientX - r.left) * (cv.width / r.width);
      const y = (ev.clientY - r.top) * (cv.height / r.height);
      let best = -1, bestD = 18;
      WW.CITIES.forEach((city, i) => {
        const p = projectCity(city, cv.width, cv.height);
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < bestD) { bestD = d; best = i; }
      });
      if (best >= 0) {
        const open = save.all || best * PAGE < save.unlocked || save.stars[best * PAGE] != null || best === 0;
        if (open) { menuPage = best; renderMenu(); }
        else toast("还没走到这座城", true);
      }
    });
  }

  /* ---------- boot ---------- */
  seedStars();
  solutions = [];
  function afterBank() {
    renderMenu();
    resize();
  }
  if (window.NIGHT_BANK_B64 && G && G.loadBankB64) {
    G.loadBankB64(window.NIGHT_BANK_B64, window.NIGHT_BANK_META).then(afterBank).catch((e) => { console.warn(e); afterBank(); });
  } else {
    afterBank();
  }
  requestAnimationFrame((t) => { lastT = t; requestAnimationFrame(frame); });

  window.__DEMO__ = {
    startLevel: (i) => openLevel(i, true),
    tap: (ci) => tapBox(ci, 0),
    state: () => ({
      screen, li, left: grid ? C.leftCount(grid) : 0, over, won,
      slots: slots.map((s) => (s ? { c: s.c, n: s.n, wait: !!s._wait, duo: !!s.duo, hold: !!s.hold } : null)),
      fronts: cols ? cols.map((c) => (c[0] ? { c: c[0].c, n: c[0].n, hidden: !!c[0].hidden, duo: !!c[0].duo } : null)) : [],
      slotCount, usedRewind, usedAd, takes, coach: coach && coach.i,
      name: LV && LV.name, unlocked: save.unlocked, stars: { ...save.stars }, all: save.all,
    }),
    solutions: solutions.map((s) => s.path),
    solution(i) {
      if (i < solutions.length && solutions[i]) return solutions[i].path;
      const lv = levelAt(i);
      const r = C.solve(lv, 5);
      return r.path || [];
    },
    skipCoach() { coach = null; const el = document.getElementById("coach"); if (el) el.hidden = true; const ic = document.getElementById("introCard"); if (ic) ic.hidden = true; const sc = document.getElementById("storyCard"); if (sc) sc.hidden = true; },
    openAlbum,
    setPage: (p) => { menuPage = p; renderMenu(); },
    preview: (ci) => startPreview(ci),
    endPreview,

    showLose,
    setSpeed: (n) => { speed = n; if (LV) updateHud(); },
    rewind,
    addSlotFromAd,
    openAd,
    loadLevel,
    unlockAll() { save.all = true; persist(); renderMenu(); },
    COLORS: C.COLORS,
  };
})();

  </script>
</body>
</html>
