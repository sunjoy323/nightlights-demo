<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#07061a" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect fill='%2307061a' width='32' height='32' rx='6'/%3E%3Ccircle cx='20' cy='12' r='7' fill='%23ffd56a'/%3E%3Ccircle cx='16' cy='10' r='6' fill='%2307061a'/%3E%3Crect x='8' y='20' width='3' height='3' fill='%23ffd56a'/%3E%3Crect x='13' y='20' width='3' height='3' fill='%237ee7ff'/%3E%3Crect x='18' y='20' width='3' height='3' fill='%23ff8ab8'/%3E%3C/svg%3E" />
  <title>夜灯将眠</title>
  <style>
:root {
  --bg: #07061a;
  --panel: #12101f;
  --line: #2c2750;
  --text: #f3efe4;
  --muted: #8a84a8;
  --ink: #140d08;
  --accent: #ffd56a;
  --danger: #ff6b8a;
  --ok: #8dffc1;
  --radius: 14px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", ui-rounded, system-ui, sans-serif;
  user-select: none; overflow: hidden;
}
button { font: inherit; color: inherit; }
button:focus, .box:focus { outline: none; }
#app {
  width: min(430px, 100%);
  height: 100%;
  height: 100dvh;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  position: relative;
  background: #07061a;
  box-shadow: 0 0 0 1px #1a1630;
}
#menu, #game { flex: 1; display: flex; flex-direction: column; min-height: 0; }
#menu[hidden], #game[hidden], [hidden] { display: none !important; }

/* menu */
#menu { overflow: auto; padding: 22px 16px 28px; }
.brand { text-align: center; margin-bottom: 6px; }
.brand h1 {
  font-size: 30px; letter-spacing: 0.18em; font-weight: 700; margin: 0 0 6px;
  text-shadow: 0 0 24px rgba(255, 213, 106, .28);
  cursor: default;
}
.brand p { margin: 0; color: var(--muted); font-size: 13px; letter-spacing: 0.06em; }
#progress { margin: 10px 0 0; color: var(--accent); font-size: 12px; letter-spacing: 0.08em; }
#levels {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 16px;
}
.card {
  appearance: none; border: 1px solid #2a2650; background: #12101f;
  border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer;
  text-align: left; display: block; width: 100%;
  transition: transform .12s ease, border-color .12s;
}
.card:active { transform: scale(0.97); }
.card canvas { display: block; width: 100%; height: auto; background: #0a0a22; }
.card .meta { display: flex; flex-direction: column; gap: 2px; padding: 7px 10px 8px; position: relative; }
.card .no { color: var(--muted); font-size: 10px; letter-spacing: 0.04em; }
.card strong { font-size: 14px; font-weight: 700; line-height: 1.25; }
.card .star { position: absolute; right: 8px; top: 8px; color: var(--accent); font-size: 11px; letter-spacing: 1px; }
.card.start { border-color: #ffd56a; box-shadow: 0 0 0 1px rgba(255,213,106,.35); }
.card.done { border-color: #3a5a48; }
.card.locked { opacity: 0.55; cursor: default; filter: grayscale(.35); }
.card.locked .meta strong { color: var(--muted); }
.card .lock { position: absolute; right: 8px; top: 8px; font-size: 12px; opacity: .8; }

/* game hud */
.hud {
  display: flex; align-items: center; gap: 7px;
  padding: 8px 10px 4px;
  flex: 0 0 auto;
}
.hud .icon, .hud .tool {
  appearance: none; background: #1a1730; border: 1px solid var(--line);
  border-radius: 10px; width: 34px; height: 34px; cursor: pointer;
  display: grid; place-items: center; font-size: 15px;
}
.hud .titles { flex: 1; min-width: 0; }
#lvNo { display: block; font-size: 10px; color: var(--muted); letter-spacing: 0.04em; }
#lvName { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hud .stat {
  background: #1a1730; border: 1px solid var(--line); border-radius: 10px;
  padding: 3px 7px; text-align: right;
}
.hud .stat em { display: block; font-style: normal; font-size: 9px; color: var(--muted); }
#leftV { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 15px; }
#loadRail {
  height: 3px; margin: 0 12px 4px; background: #1a1730; border-radius: 99px; overflow: hidden;
  flex: 0 0 auto;
}
#loadFill { display: block; height: 100%; width: 0; background: var(--accent); box-shadow: 0 0 8px rgba(255,213,106,.5); transition: width .2s, background .2s; }
#loadFill.hot { background: var(--danger); box-shadow: 0 0 8px rgba(255,107,138,.5); }

#stage { flex: 1; min-height: 0; position: relative; }
#board { display: block; width: 100%; height: 100%; }
#slots {
  position: absolute; left: 10px; right: 10px; bottom: 8px;
  display: grid; gap: 6px;
  pointer-events: none;
}
#toast {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%) translateY(-8px);
  background: #2a1630; color: #ffe8ee; border: 1px solid #6a3048;
  padding: 8px 14px; border-radius: 999px; font-size: 13px; opacity: 0;
  pointer-events: none; white-space: nowrap; max-width: 92%; overflow: hidden; text-overflow: ellipsis;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.soft { background: #1a2030; border-color: #3a5070; color: #e8f0ff; }

#slots.pad { min-height: 0; }
.slot {
  height: 52px; border: 1.5px dashed #3a3560; border-radius: 10px;
  background:
    linear-gradient(180deg, rgba(40,36,70,.45), rgba(12, 10, 24, .82));
  display: grid; place-items: center;
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.03);
  position: relative;
}
.slot.full { border-style: solid; border-color: #4a4570; }
.slot.wait { border-color: #6a6080; }
.slot.duo { border-color: #ff9a4a; box-shadow: 0 0 0 1px rgba(255,154,74,.35); }
.slot.hold { border-style: solid; border-color: #ff9a4a; opacity: .85; }
.slot .box { width: 100%; height: 100%; border-radius: 9px; font-size: 20px; font-weight: 700; position: relative; }
.slot .tag {
  position: absolute; left: 4px; bottom: 2px; font-size: 8px; font-weight: 700;
  letter-spacing: 0.04em; opacity: .7;
}
.zz {
  position: absolute; right: 4px; top: 2px; font-size: 10px; font-style: normal;
  color: #3a2208; opacity: .7; font-weight: 700;
}
.sleeper {
  position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
  font-size: 14px; opacity: .85;
}

#tray {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
  padding: 6px 14px 10px;
  background: linear-gradient(180deg, transparent, rgba(8,6,20,.55));
}
.tcol { display: flex; flex-direction: column; gap: 7px; position: relative; }
.box {
  appearance: none; height: 46px; border-radius: 8px; border: 2px solid #140d08;
  cursor: pointer; font-weight: 800; font-size: 18px; letter-spacing: 0.5px;
  box-shadow: 0 3px 0 #140d08, 0 4px 0 rgba(0,0,0,.25);
  transition: transform .08s, box-shadow .08s;
  position: relative;
}
.box:active { transform: translateY(2px); box-shadow: 0 1px 0 #140d08; }
.box.back { opacity: .92; cursor: default; box-shadow: 0 2px 0 #140d08; }
.box.back:active { transform: none; }
.box.duo::before {
  content: "双槽"; position: absolute; left: 4px; top: 2px;
  font-size: 8px; font-weight: 700; letter-spacing: 0; opacity: .7;
}
.box.point {
  outline: 3px solid #fff4c0; outline-offset: 3px;
  animation: pulse 1s ease-in-out infinite;
  position: relative; z-index: 3;
}
.box.point::after {
  content: ""; position: absolute; right: -18px; top: 50%; width: 28px; height: 28px;
  transform: translateY(-20%);
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path fill='%23fff4c0' stroke='%23140d08' stroke-width='2' d='M8 2l4 14 3-2 6 12 4-2-6-12 5-1z'/></svg>") center/contain no-repeat;
  pointer-events: none;
}
@keyframes pulse { 50% { outline-color: rgba(255,244,192,.35); } }
.more { text-align: center; font-size: 11px; color: var(--muted); margin-top: -2px; }

#coach {
  position: absolute; left: 16px; right: 16px; bottom: 72px;
  z-index: 5; pointer-events: auto;
}
#coach .bubble {
  background: #fff8e8; color: #2a1a10; border-radius: 14px;
  padding: 12px 14px; font-size: 14px; line-height: 1.5;
  box-shadow: 0 8px 24px rgba(0,0,0,.35);
}
#coach .bubble b { color: #9a3a10; }
#coach .next { margin-top: 4px; font-size: 12px; color: #8a6a50; }

#fx {
  position: absolute; inset: 0; pointer-events: none; z-index: 8; overflow: hidden;
}
.fly {
  position: fixed; z-index: 40; pointer-events: none; border-radius: 8px;
  display: grid; place-items: center; font-weight: 800; border: 2px solid #140d08;
  transition: left .38s cubic-bezier(.2,.8,.2,1), top .38s cubic-bezier(.2,.8,.2,1), transform .38s, opacity .38s;
}

/* overlays */
.modal {
  position: absolute; inset: 0; background: rgba(6, 5, 16, .62);
  display: grid; place-items: center; z-index: 20; padding: 20px;
}
.panel {
  width: min(340px, 100%); background: #161326; border: 1px solid #3a3560;
  border-radius: 18px; padding: 22px 18px 16px; text-align: center;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.panel .en { font-size: 11px; letter-spacing: 0.22em; color: var(--muted); }
.panel h2 { margin: 6px 0 8px; font-size: 28px; font-weight: 750; }
#winBox h2 { font-size: 40px; letter-spacing: 0.28em; text-shadow: 0 0 28px rgba(255,213,106,.45); }
.panel p { margin: 0 0 12px; color: var(--muted); font-size: 13px; line-height: 1.55; }
#winStars { font-size: 28px; letter-spacing: 6px; color: var(--accent); margin: 0 0 12px; text-shadow: 0 0 16px rgba(255,213,106,.45); }
#winStars .dim { color: #3a3560; text-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 10px 14px;
  background: #2a2650; cursor: pointer; font-weight: 650; font-size: 14px;
}
.btn:active { transform: scale(0.98); }
.btn.primary { background: var(--accent); color: #2a1a08; min-width: 100%; }
.btn.ghost { background: transparent; border: 1px solid #3a3560; }
.btn.danger { background: #3a2030; }
.note { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.4; }

#adBox .panel { background: #0c0b18; }
#adSec { font-size: 48px; font-weight: 800; color: var(--accent); margin: 8px 0; }

@media (max-height: 700px) {
  .box { height: 40px; font-size: 16px; }
  .slot { height: 46px; }
  .brand h1 { font-size: 24px; }
  #levels { gap: 8px; }
}

/* menu bar / pager */
.menu-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 14px 0 0; }
#pager { display: flex; align-items: center; gap: 6px; }
#pager .btn, .menu-bar .btn { padding: 6px 10px; font-size: 12px; }
#pageLab { font-size: 12px; color: var(--accent); letter-spacing: 0.06em; white-space: nowrap; }
.card.landmark { border-color: #ffd56a; }
.card .badge {
  position: absolute; left: 8px; top: 8px; font-size: 9px; letter-spacing: 0.08em;
  background: #ffd56a; color: #2a1a08; border-radius: 6px; padding: 1px 5px; font-weight: 700;
}

/* album */
#album { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: auto; padding: 18px 16px 28px; }
#album[hidden] { display: none !important; }
#album .brand { position: relative; }
#albumBack, #album .brand .icon {
  appearance: none;
  position: absolute; left: 0; top: 8px;
  background: #1a1730; border: 1px solid var(--line);
  border-radius: 10px; width: 34px; height: 34px;
  cursor: pointer; display: grid; place-items: center;
  font-size: 16px; color: var(--text); z-index: 2;
}
#postcards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
.postcard {
  appearance: none; border: 1px solid #2a2650; background: #12101f;
  border-radius: 14px; padding: 0; overflow: hidden; cursor: pointer; text-align: left; color: inherit;
}
.postcard canvas { display: block; width: 100%; height: auto; }
.postcard .meta { padding: 7px 10px 8px; }
.postcard .meta strong { display: block; font-size: 13px; }
.postcard .meta .star { color: var(--accent); font-size: 11px; }
.postcard.empty { opacity: 0.4; cursor: default; }
.postcard.landmark { border-color: #ffd56a; box-shadow: 0 0 0 1px rgba(255,213,106,.3); }
.postcard-view canvas { width: 100%; height: auto; border-radius: 10px; margin-bottom: 8px; }
#cardStars { color: var(--accent); letter-spacing: 4px; margin: 4px 0; }

/* tray wait mark / preview */
.box.waitish { box-shadow: 0 3px 0 #140d08, 0 0 0 2px rgba(200,180,255,.45); }
.box.waitish .prezz {
  position: absolute; right: 3px; top: 1px; font-size: 9px; font-weight: 700; opacity: .75; letter-spacing: 0;
}
.box.gate .prezz, .box .mechmark {
  position: absolute; left: 3px; top: 1px; font-size: 9px; font-weight: 700; opacity: .85;
}
.box.previewing { outline: 3px solid #fff4c0; outline-offset: 2px; }

/* intro card */
#introCard {
  position: absolute; inset: 0; z-index: 16;
  display: grid; place-items: end center;
  background: rgba(6,5,16,.45); padding: 16px 16px 80px;
  pointer-events: auto;
}
#introCard[hidden] { display: none !important; }
.intro-panel {
  width: 100%; background: #fff8e8; color: #2a1a10; border-radius: 16px;
  padding: 14px 14px 12px; box-shadow: 0 12px 32px rgba(0,0,0,.4);
}
.intro-panel h3 { margin: 0 0 6px; font-size: 18px; }
.intro-panel p { margin: 0 0 10px; font-size: 14px; line-height: 1.55; color: #4a3428; }
.intro-anim {
  height: 64px; border-radius: 10px; background: #1a1630; margin-bottom: 10px;
  position: relative; overflow: hidden;
}
.intro-anim .city { position: absolute; inset: auto 10px 8px 10px; height: 28px; background: #2a2650; border-radius: 3px; }
.intro-anim .key {
  position: absolute; left: 16px; top: 14px; width: 18px; height: 18px; border-radius: 4px;
  background: #ffd56a; color: #3a2208; font: 700 10px sans-serif; display: grid; place-items: center;
  animation: introBob 1.2s ease-in-out infinite;
}
.intro-anim .lock {
  position: absolute; right: 28px; top: 12px; width: 22px; height: 22px; border-radius: 4px;
  background: #3a3560; color: #ffd56a; font: 700 11px sans-serif; display: grid; place-items: center;
}
.intro-anim .line {
  position: absolute; left: 34px; right: 50px; top: 22px; height: 0;
  border-top: 2px dashed #ffd56a; opacity: .85;
}
.intro-anim.shutter .door {
  position: absolute; left: 30%; right: 30%; top: 16px; height: 22px; background: repeating-linear-gradient(#2a3040, #2a3040 4px, #1a2030 4px, #1a2030 6px);
  animation: introLift 1.6s ease-in-out infinite;
}
.intro-anim.awaken .dark {
  position: absolute; left: 40%; right: 18%; top: 12px; height: 28px; background: #12101c;
  animation: introWake 1.8s ease-in-out infinite;
}
.intro-anim.blink .lan {
  position: absolute; left: 50%; top: 16px; width: 16px; height: 20px; margin-left: -8px;
  background: #ff8ab8; border-radius: 8px 8px 4px 4px;
  animation: introBlink 1s step-end infinite;
}
.intro-anim.duo .slot2 {
  position: absolute; left: 28%; right: 28%; top: 20px; height: 22px;
  border: 2px solid #ff9a4a; border-radius: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 3px; padding: 2px;
}
.intro-anim.duo .slot2 i { background: #ff9a4a; border-radius: 3px; display: block; }
.intro-anim.hidden .q {
  position: absolute; left: 50%; top: 14px; margin-left: -14px; width: 28px; height: 28px;
  background: #3a3558; color: #dcd6ff; border-radius: 6px; display: grid; place-items: center;
  font: 700 16px sans-serif; animation: introBob 1s ease-in-out infinite;
}
@keyframes introBob { 50% { transform: translateY(3px); } }
@keyframes introLift { 0%,40% { transform: translateY(0); } 70%,100% { transform: translateY(-16px); opacity: .3; } }
@keyframes introWake { 0%,40% { background: #12101c; } 60%,100% { background: #c9a6ff; } }
@keyframes introBlink { 0%,49% { opacity: 1; } 50%,100% { opacity: .2; } }

#previewTag {
  position: absolute; left: 50%; top: 44px; transform: translateX(-50%);
  background: #1a2030; color: #e8f0ff; border: 1px solid #3a5070;
  padding: 6px 12px; border-radius: 999px; font-size: 12px; pointer-events: none; z-index: 6;
}
#previewTag[hidden] { display: none !important; }

/* v4 环球电工 */
#appToast {
  position: fixed; left: 50%; top: 16%; transform: translateX(-50%) translateY(-8px);
  z-index: 80;
  background: #2a1630; color: #ffe8ee; border: 1px solid #6a3048;
  padding: 10px 16px; border-radius: 16px; font-size: 14px; opacity: 0;
  pointer-events: none; max-width: 86%; text-align: center; line-height: 1.45;
  box-shadow: 0 8px 24px rgba(0,0,0,.45);
  transition: opacity .2s, transform .2s;
  white-space: normal;
}
#appToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#appToast.soft { background: #1a2030; border-color: #3a5070; color: #e8f0ff; }
#appToast[hidden] { display: none !important; }

#worldMap {
  width: 100%; height: 150px; border-radius: 14px;
  margin: 12px 0 8px; background: #0a1020;
  display: block; box-shadow: inset 0 0 0 1px rgba(255,213,106,.15);
}
#chapterLine {
  margin: 0 0 4px; font-size: 12px; line-height: 1.55;
  color: #c8c0b0; min-height: 2.6em;
}

#albumCities {
  display: flex; flex-wrap: wrap; gap: 6px;
  margin-top: 12px;
}
.stamp {
  border: 1px solid #3a3560; background: #141022; color: #c8c0b0;
  border-radius: 999px; padding: 4px 10px; font-size: 11px;
}
.stamp.on { border-color: #ffd56a; color: #ffd56a; }
.stamp.got { background: #2a2030; color: #ffe8c0; }
.stamp:disabled { opacity: .4; }
.city-tag { display: block; font-size: 10px; color: var(--accent, #ffd56a); font-style: normal; letter-spacing: 0.06em; }

#storyCard {
  position: absolute; inset: 0; z-index: 17;
  display: grid; place-items: end center;
  background: rgba(6,5,16,.5); padding: 16px 16px 80px;
  pointer-events: auto;
}
#storyCard[hidden] { display: none !important; }


#stage, #board { touch-action: none; }

/* color-blind helper marks on tickets (ink-colored, low contrast so numbers stay readable) */
.box.pat-dots {
  background-image: radial-gradient(circle, rgba(20,10,0,.32) 1.3px, transparent 1.5px);
  background-size: 9px 9px; background-position: 2px 2px;
}
.box.pat-ring {
  background-image: radial-gradient(circle, transparent 5px, rgba(20,10,0,.4) 6px, transparent 7px);
  background-position: center; background-repeat: no-repeat; background-size: 22px 22px;
}
.box.pat-slash {
  background-image: repeating-linear-gradient(-45deg, transparent 0 6px, rgba(20,10,0,.28) 6px 8px);
}
.box.pat-plus {
  background-image:
    linear-gradient(rgba(20,10,0,.35), rgba(20,10,0,.35)),
    linear-gradient(rgba(20,10,0,.35), rgba(20,10,0,.35));
  background-size: 2px 16px, 16px 2px;
  background-repeat: no-repeat;
  background-position: center, center;
}
.box.pat-diamond {
  background-image: linear-gradient(45deg, transparent 40%, rgba(20,10,0,.4) 41%, rgba(20,10,0,.4) 59%, transparent 60%),
    linear-gradient(-45deg, transparent 40%, rgba(20,10,0,.4) 41%, rgba(20,10,0,.4) 59%, transparent 60%);
  background-size: 14px 14px; background-repeat: no-repeat; background-position: center;
}
.box.pat-triangle {
  background-image: linear-gradient(to top, rgba(20,10,0,.0) 35%, rgba(20,10,0,.0) 35%),
    linear-gradient(135deg, transparent 46%, rgba(20,10,0,.4) 47%, transparent 48%),
    linear-gradient(-135deg, transparent 46%, rgba(20,10,0,.4) 47%, transparent 48%);
}
.box.pat-bars {
  background-image: linear-gradient(90deg, transparent 22%, rgba(20,10,0,.35) 22% 32%, transparent 32% 68%, rgba(20,10,0,.35) 68% 78%, transparent 78%);
}

/* v6 hint / repair / win progress */
#hintBtn { position: relative; font-size: 15px; }
#hintBtn .badge-n {
  position: absolute; right: -4px; top: -4px; min-width: 15px; height: 15px; padding: 0 3px;
  border-radius: 99px; background: var(--accent); color: #2a1a08; font: 700 9px/15px sans-serif; font-style: normal;
}
#hintBtn .badge-n.ad { background: #8dffc1; }
#hintBtn.glow { border-color: var(--accent); box-shadow: 0 0 10px rgba(255,213,106,.55); animation: hintGlow 1.2s ease-in-out infinite; }
@keyframes hintGlow { 50% { box-shadow: 0 0 2px rgba(255,213,106,.2); } }
#loadFill.hot { animation: railHot .6s ease-in-out infinite; }

  <script id="core">
// Shared puzzle core for 夜灯将眠 — used by verify.mjs and inlined into index.html
(function (root) {
  const COLORS = [
    { id: "amber", fill: "#ffd56a", glow: "#ffbe3a", ink: "#3a2208", name: "暖黄", pat: "solid" },
    { id: "pink", fill: "#ff8ab8", glow: "#ff5e9a", ink: "#4a1028", name: "粉", pat: "dots" },
    { id: "cyan", fill: "#7ee7ff", glow: "#3ad4ff", ink: "#073044", name: "青", pat: "ring" },
    { id: "orange", fill: "#ff9a4a", glow: "#ff7a1a", ink: "#3a1a00", name: "橙", pat: "slash" },
    { id: "mint", fill: "#8dffc1", glow: "#3dff9a", ink: "#06301c", name: "薄荷", pat: "plus" },
    { id: "lavender", fill: "#c9a6ff", glow: "#a87cff", ink: "#2a1050", name: "紫", pat: "diamond" },
    { id: "crimson", fill: "#ff5d6c", glow: "#ff3348", ink: "#3a0a12", name: "玫", pat: "triangle" },
    { id: "azure", fill: "#5b8cff", glow: "#3a6aff", ink: "#0a1638", name: "蓝", pat: "bars" },
  ];

  // Small, high-contrast marks so colors stay distinguishable for color-blind players.
  function drawColorPattern(ctx, x, y, w, h, pat, ink, alpha) {
    if (!pat || pat === "solid" || w < 4 || h < 4) return;
    ctx.save();
    ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.globalAlpha = (alpha == null ? 0.5 : alpha);
    ctx.strokeStyle = ink;
    ctx.fillStyle = ink;
    ctx.lineWidth = Math.max(1, Math.min(w, h) * 0.12);
    const cx = x + w / 2, cy = y + h / 2, r = Math.min(w, h);
    if (pat === "dots") {
      const spots = r < 8 ? [[0.5, 0.5]] : [[0.3, 0.3], [0.7, 0.3], [0.5, 0.72]];
      for (const [u, v] of spots) {
        ctx.beginPath(); ctx.arc(x + w * u, y + h * v, Math.max(0.8, r * 0.1), 0, Math.PI * 2); ctx.fill();
      }
    } else if (pat === "ring") {
      ctx.beginPath(); ctx.arc(cx, cy, r * 0.22, 0, Math.PI * 2); ctx.stroke();
    } else if (pat === "slash") {
      ctx.beginPath(); ctx.moveTo(x + 1, y + h - 1); ctx.lineTo(x + w - 1, y + 1); ctx.stroke();
      if (r >= 8) { ctx.beginPath(); ctx.moveTo(x + w * 0.2, y + h); ctx.lineTo(x + w, y + h * 0.2); ctx.stroke(); }
    } else if (pat === "plus") {
      ctx.beginPath();
      ctx.moveTo(cx, y + h * 0.2); ctx.lineTo(cx, y + h * 0.8);
      ctx.moveTo(x + w * 0.2, cy); ctx.lineTo(x + w * 0.8, cy);
      ctx.stroke();
    } else if (pat === "diamond") {
      ctx.beginPath();
      ctx.moveTo(cx, y + h * 0.2); ctx.lineTo(x + w * 0.8, cy);
      ctx.lineTo(cx, y + h * 0.8); ctx.lineTo(x + w * 0.2, cy);
      ctx.closePath(); ctx.stroke();
    } else if (pat === "triangle") {
      ctx.beginPath();
      ctx.moveTo(cx, y + h * 0.2); ctx.lineTo(x + w * 0.8, y + h * 0.8); ctx.lineTo(x + w * 0.2, y + h * 0.8);
      ctx.closePath(); ctx.stroke();
    } else if (pat === "bars") {
      const bw = Math.max(1, w * 0.16);
      ctx.fillRect(x + w * 0.22, y + h * 0.2, bw, h * 0.6);
      ctx.fillRect(x + w * 0.62, y + h * 0.2, bw, h * 0.6);
    }
    ctx.restore();
  }

  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];

  function emptyGrid(W, H) {
    return Array.from({ length: H }, () => Array.from({ length: W }, () => null));
  }

  function cloneGrid(g) {
    return g.map((row) => row.map((c) => (c ? { ...c } : null)));
  }

  function cloneCols(cols) {
    return cols.map((col) => col.map((t) => ({ ...t })));
  }

  function cloneSlots(slots) {
    return slots.map((s) => (s ? { ...s } : null));
  }

  // Windows sit in a rectangle. y0 is the top row, x0 left.
  // border/fill are color indices; fill may be null for solid border color.
  // lock: building id string. key: this window unlocks that id when turned off.
  function stampBuilding(g, x0, y0, w, h, opt) {
    const border = opt.border;
    const fill = opt.fill == null ? border : opt.fill;
    const lock = opt.lock || null;
    const key = opt.key || null;
    const keyAt = opt.keyAt || null;
    for (let y = y0; y < y0 + h; y++) {
      for (let x = x0; x < x0 + w; x++) {
        const edge = x === x0 || x === x0 + w - 1 || y === y0 || y === y0 + h - 1;
        let c = edge ? border : fill;
        if (opt.pattern && opt.pattern[y - y0] && opt.pattern[y - y0][x - x0] != null) {
          c = opt.pattern[y - y0][x - x0];
        }
        const cell = { c, on: true };
        if (lock) cell.lock = lock;
        if (opt.kind) cell.kind = opt.kind;
        if (keyAt && keyAt[0] === x && keyAt[1] === y && key) cell.key = key;
        g[y][x] = cell;
      }
    }
    if (key && keyAt == null) {
      const kx = x0 + (w >> 1);
      const ky = y0;
      if (g[ky][kx]) {
        g[ky][kx].key = key;
        g[ky][kx].c = opt.keyColor != null ? opt.keyColor : g[ky][kx].c;
        if (opt.keyKind) g[ky][kx].kind = opt.keyKind;
      }
    }
  }

  function countOn(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && c.on) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function countNeed(grid) {
    const n = {};
    let total = 0;
    for (const row of grid) {
      for (const c of row) {
        if (c && (c.on || c.dormant)) {
          n[c.c] = (n[c.c] || 0) + 1;
          total++;
        }
      }
    }
    return { n, total };
  }

  function isOpen(grid, x, y) {
    const H = grid.length, W = grid[0].length;
    if (x < 0 || y < 0 || x >= W || y >= H) return true;
    const c = grid[y][x];
    if (!c) return true;
    if (c.on) return false;
    return true;
  }

  function blinkOpen(cell, takes) {
    if (!cell || !cell.blink) return true;
    return (takes || 0) % 2 === 1;
  }

  function isReachable(grid, x, y, unlocked, takes) {
    const cell = grid[y][x];
    if (!cell || !cell.on) return false;
    if (cell.lock && !(unlocked && unlocked[cell.lock])) return false;
    if (!blinkOpen(cell, takes)) return false;
    for (const [dx, dy] of DIRS) {
      if (isOpen(grid, x + dx, y + dy)) return true;
    }
    return false;
  }

  function findTarget(grid, color, unlocked, takes) {
    const H = grid.length, W = grid[0].length;
    let best = null;
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const cell = grid[y][x];
        if (!cell || !cell.on || cell.c !== color) continue;
        if (!isReachable(grid, x, y, unlocked, takes)) continue;
        const isKey = !!cell.key;
        if (
          !best ||
          (isKey && !best.key) ||
          (isKey === !!best.key && (y < best.y || (y === best.y && x < best.x)))
        ) {
          best = { x, y, key: isKey };
        }
      }
    }
    return best;
  }

  function turnOff(grid, t, unlocked) {
    const cell = grid[t.y][t.x];
    cell.on = false;
    cell.dormant = false;
    if (cell.key) unlocked[cell.key] = true;
    if (cell.awaken) {
      for (const [x, y] of cell.awaken) {
        const d = grid[y] && grid[y][x];
        if (d && d.dormant) {
          d.dormant = false;
          d.on = true;
        }
      }
    }
  }

  function saturate(grid, slots, unlocked, takes) {
    let guard = 0;
    while (guard++ < 4000) {
      let did = false;
      for (let i = 0; i < slots.length; i++) {
        const s = slots[i];
        if (!s || s.n <= 0 || s.hold) continue;
        const t = findTarget(grid, s.c, unlocked, takes);
        if (!t) continue;
        turnOff(grid, t, unlocked);
        s.n--;
        did = true;
      }
      if (!did) break;
    }
    for (let i = 0; i < slots.length; i++) {
      const s = slots[i];
      if (s && s.n <= 0 && !s.hold) {
        if (s.duo && s.pair != null) slots[s.pair] = null;
        slots[i] = null;
      }
    }
  }

  function leftCount(grid) {
    let n = 0;
    for (const row of grid) for (const c of row) if (c && (c.on || c.dormant)) n++;
    return n;
  }

  function canTake(cols, ci) {
    return cols[ci] && cols[ci].length > 0;
  }

  function hasPair(slots, slotCount) {
    for (let i = 0; i < slotCount - 1; i++) if (!slots[i] && !slots[i + 1]) return true;
    return false;
  }

  function canPlaceTicket(slots, slotCount, t) {
    if (!t) return false;
    if (t.duo) return hasPair(slots, slotCount);
    for (let i = 0; i < slotCount; i++) if (!slots[i]) return true;
    return false;
  }

  function place(cols, slots, ci, slotCount) {
    if (!canTake(cols, ci)) return false;
    const t = cols[ci][0];
    if (t.duo) {
      let si = -1;
      for (let i = 0; i < slotCount - 1; i++) {
        if (!slots[i] && !slots[i + 1]) { si = i; break; }
      }
      if (si < 0) return false;
      cols[ci].shift();
      slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id, duo: true, pair: si + 1 };
      slots[si + 1] = { c: t.c, n: 0, hidden: !!t.hidden, id: t.id, duo: true, hold: true, pair: si };
      return true;
    }
    let si = -1;
    for (let i = 0; i < slotCount; i++) if (!slots[i]) { si = i; break; }
    if (si < 0) return false;
    cols[ci].shift();
    slots[si] = { c: t.c, n: t.n, hidden: !!t.hidden, id: t.id };
    return true;
  }

  function frontsUseful(grid, cols, unlocked, takes) {
    const out = [];
    for (let i = 0; i < cols.length; i++) {
      const t = cols[i][0];
      if (t && findTarget(grid, t.c, unlocked, takes)) out.push(i);
    }
    return out;
  }

  function isWon(grid) { return leftCount(grid) === 0; }

  function canPlaceAny(cols, slots, slotCount) {
    for (let i = 0; i < cols.length; i++) {
      if (cols[i].length && canPlaceTicket(slots, slotCount, cols[i][0])) return true;
    }
    return false;
  }

  function isLost(grid, cols, slots, slotCount, unlocked, takes) {
    if (isWon(grid)) return false;
    if (slots.some((s) => s && s.n > 0 && !s.hold && findTarget(grid, s.c, unlocked, takes))) return false;
    return !canPlaceAny(cols, slots, slotCount);
  }

  function stateKey(grid, cols, slots, unlocked, takes) {
    let lights = "";
    for (const row of grid) for (const c of row) lights += c && c.on ? "1" : c && c.dormant ? "d" : "0";
    const cs = cols.map((col) => col.map((t) => t.c + ":" + t.n + (t.duo ? "D" : "")).join(",")).join("|");
    const ss = slots.map((s) => (s ? (s.hold ? "H" : s.c + ":" + s.n + (s.duo ? "D" : "")) : "-")).join(",");
    const uk = Object.keys(unlocked).filter((k) => unlocked[k]).sort().join(",");
    return lights + "#" + cs + "#" + ss + "#" + uk + "#" + ((takes || 0) % 2);
  }

  function solve(level, slotCount, opts) {
    const st = opts && opts.start;
    const grid0 = cloneGrid(st ? st.grid : level.grid);
    const cols0 = cloneCols(st ? st.cols : level.cols);
    const slots0 = st ? cloneSlots(st.slots) : Array(slotCount).fill(null);
    const unlocked0 = { ...((st ? st.unlocked : level.unlocked) || {}) };
    const takes0 = st ? st.takes || 0 : 0;
    const seen = new Set();
    let found = null;
    const maxVisits = (opts && opts.maxVisits) || 400000;
    let visits = 0;

    function dfs(grid, cols, slots, unlocked, takes, path) {
      if (found) return;
      if (++visits > maxVisits) return;
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) { found = path.slice(); return; }
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return;
      const key = stateKey(grid, cols, slots, unlocked, takes);
      if (seen.has(key)) return;
      seen.add(key);

      const order = [];
      for (let i = 0; i < cols.length; i++) if (cols[i].length) order.push(i);
      order.sort((a, b) => {
        const ua = findTarget(grid, cols[a][0].c, unlocked, takes) ? 0 : 1;
        const ub = findTarget(grid, cols[b][0].c, unlocked, takes) ? 0 : 1;
        if (ua !== ub) return ua - ub;
        const da = cols[a][0].duo ? 1 : 0;
        const db = cols[b][0].duo ? 1 : 0;
        return da - db;
      });
      for (const i of order) {
        const g2 = cloneGrid(grid);
        const c2 = cloneCols(cols);
        const s2 = cloneSlots(slots);
        const u2 = { ...unlocked };
        if (!place(c2, s2, i, slotCount)) continue;
        dfs(g2, c2, s2, u2, takes + 1, path.concat(i));
        if (found) return;
      }
    }

    dfs(grid0, cols0, slots0, unlocked0, takes0, []);
    return { ok: !!found, path: found || [], visits, left: leftCount(grid0) };
  }

  // Attentive casual player: dig toward the shallowest key/switch ticket, else a useful front, else leftmost.
  function smartSolve(level, slotCount, start) {
    const st = start || level;
    const grid = cloneGrid(st.grid);
    const cols = cloneCols(st.cols);
    const slots = start ? cloneSlots(start.slots) : Array(slotCount).fill(null);
    const unlocked = { ...(st.unlocked || {}) };
    const gates = gateColorSet(grid);
    let takes = start ? start.takes || 0 : 0;
    const path = [];
    for (let guard = 0; guard < 300; guard++) {
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      const legal = legalMoves(cols, slots, slotCount);
      if (!legal.length) return { ok: false, path, reason: "stuck" };
      let ch = -1, best = 99;
      for (const i of legal) {
        const d = cols[i].findIndex((t) => gates.has(t.c));
        if (d >= 0 && d < best) { best = d; ch = i; }
      }
      if (ch < 0) for (const i of legal) if (findTarget(grid, cols[i][0].c, unlocked, takes)) { ch = i; break; }
      if (ch < 0) ch = legal[0];
      place(cols, slots, ch, slotCount);
      takes++;
      path.push(ch);
    }
    return { ok: false, path, reason: "timeout" };
  }

  function greedySolve(level, slotCount) {
    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    const path = [];
    for (let guard = 0; guard < 250; guard++) {
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      let choice = -1;
      for (let i = 0; i < cols.length; i++) {
        const t = cols[i][0];
        if (!t || !canPlaceTicket(slots, slotCount, t)) continue;
        if (findTarget(grid, t.c, unlocked, takes)) { choice = i; break; }
      }
      if (choice < 0) {
        for (let i = 0; i < cols.length; i++) {
          if (cols[i][0] && canPlaceTicket(slots, slotCount, cols[i][0])) { choice = i; break; }
        }
      }
      if (choice < 0) return { ok: false, path, reason: "stuck" };
      place(cols, slots, choice, slotCount);
      takes++;
      path.push(choice);
    }
    return { ok: false, path, reason: "timeout" };
  }


  function leftmostSolve(level, slotCount) {
    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0;
    const path = [];
    for (let guard = 0; guard < 250; guard++) {
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) return { ok: true, path };
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return { ok: false, path, reason: "lost" };
      let choice = -1;
      for (let i = 0; i < cols.length; i++) {
        if (cols[i][0] && canPlaceTicket(slots, slotCount, cols[i][0])) { choice = i; break; }
      }
      if (choice < 0) return { ok: false, path, reason: "stuck" };
      place(cols, slots, choice, slotCount);
      takes++;
      path.push(choice);
    }
    return { ok: false, path, reason: "timeout" };
  }

  function ticketSumsOk(level) {
    const { n } = countNeed(level.grid);
    const got = {};
    for (const col of level.cols) for (const t of col) got[t.c] = (got[t.c] || 0) + t.n;
    const keys = new Set([...Object.keys(n), ...Object.keys(got)]);
    for (const k of keys) if ((n[k] || 0) !== (got[k] || 0)) return { ok: false, n, got };
    return { ok: true, n, got };
  }

  let _tid = 1;
  function T(c, n, extra) { return { c, n, id: _tid++, ...(extra || {}) }; }

  function level(def) {
    const g = emptyGrid(def.W, def.H);
    for (const b of def.buildings) stampBuilding(g, b.x, b.y, b.w, b.h, b);
    if (def.decorate) def.decorate(g);
    return {
      id: def.id,
      name: def.name,
      hint: def.hint,
      tier: def.tier,
      W: def.W,
      H: def.H,
      grid: g,

  }

  function recItem(item) {
    return typeof item === "number" ? { c: item } : item;
  }

  function assign(level, recipe, hiddenSet) {
    hiddenSet = hiddenSet || new Set();
    const { n } = countNeed(level.grid);
    const need = {};
    const parsed = recipe.map((col) => col.map(recItem));
    for (const col of parsed) for (const it of col) need[it.c] = (need[it.c] || 0) + 1;
    const piles = {};
    for (const [cs, total] of Object.entries(n)) {
      const c = +cs;
      const k = need[c] || 0;
      piles[c] = [];
      if (k === 0 && total > 0) throw new Error(level.id + " color " + c + " has " + total + " lights but no tickets");
      if (k === 0) continue;
      const base = Math.floor(total / k);
      let rem = total - base * k;
      for (let i = 0; i < k; i++) {
        const v = base + (rem > 0 ? 1 : 0);
        if (rem > 0) rem--;
        piles[c].push(v);
      }
    }
    for (const c of Object.keys(need)) {
      if (!n[+c]) throw new Error(level.id + " ticket color " + c + " has no lights");
    }
    level.cols = parsed.map((col, ci) =>
      col.map((it, ri) => {
        const n1 = piles[it.c].shift();
        const hidden = !!(it.hidden || hiddenSet.has(ci + ":" + ri) || hiddenSet.has("c" + it.c));
        const extra = {};
        if (hidden) extra.hidden = true;
        if (it.duo) extra.duo = true;
        return T(it.c, n1, extra);
      })
    );
  }

  function ticketSig(t) {

  function legalMoves(cols, slots, slotCount) {

      return "W";

    if (groups.size <= 1) return null;
    return sig(cols[chosen][0]);

  function keyPathOf(level, path, slotCount) {

    let grid = cloneGrid(level.grid);
    let cols = cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);

    const keys = [];
    for (const ci of path) {

      if (d) keys.push(d);
      if (!place(cols, slots, ci, slotCount)) break;
      takes++;

    return keys.join(">");

  function countSolutions(level, slotCount, opts) {
    const maxVisits = (opts && opts.maxVisits) || 80000;
    const maxSol = (opts && opts.maxSol) || 16;
    const grid0 = cloneGrid(level.grid);
    const cols0 = cloneCols(level.cols);
    const slots0 = Array(slotCount).fill(null);
    const unlocked0 = { ...(level.unlocked || {}) };
    const seen = new Set();
    const paths = [];
    const keySet = new Set();
    let visits = 0;
    let truncated = false;

    function dfs(grid, cols, slots, unlocked, takes, path) {
      if (paths.length >= maxSol) { truncated = true; return; }
      if (++visits > maxVisits) { truncated = true; return; }
      saturate(grid, slots, unlocked, takes);
      if (isWon(grid)) {
        const p = path.slice();
        paths.push(p);
        keySet.add(keyPathOf(level, p, slotCount));
        return;
      }
      if (isLost(grid, cols, slots, slotCount, unlocked, takes)) return;
      const key = stateKey(grid, cols, slots, unlocked, takes);
      if (seen.has(key)) return;
      seen.add(key);
      for (let i = 0; i < cols.length; i++) {
        if (!cols[i].length) continue;
        const g2 = cloneGrid(grid);
        const c2 = cloneCols(cols);
        const s2 = cloneSlots(slots);
        const u2 = { ...unlocked };
        if (!place(c2, s2, i, slotCount)) continue;
        dfs(g2, c2, s2, u2, takes + 1, path.concat(i));
        if (truncated && paths.length >= maxSol) return;
      }
    }

    dfs(grid0, cols0, slots0, unlocked0, 0, []);
    return {
      count: paths.length,
      truncated,
      visits,
      paths,
      keyCount: keySet.size,
      keys: [...keySet],
      unique: paths.length === 1,
      keyUnique: keySet.size === 1 && paths.length >= 1,
    };
  }

  function randomPlayouts(level, slotCount, trials, seed) {
    let rng = (seed == null ? 1 : seed) >>> 0;
    const rnd = () => { rng = (Math.imul(rng, 1664525) + 1013904223) >>> 0; return rng / 4294967296; };
    let wins = 0;
    for (let t = 0; t < trials; t++) {
      let grid = cloneGrid(level.grid);
      let cols = cloneCols(level.cols);
      let slots = Array(slotCount).fill(null);
      let unlocked = { ...(level.unlocked || {}) };
      let takes = 0, ok = false;
      for (let g = 0; g < 250; g++) {
        saturate(grid, slots, unlocked, takes);
        if (isWon(grid)) { ok = true; break; }
        if (isLost(grid, cols, slots, slotCount, unlocked, takes)) break;
        const legal = legalMoves(cols, slots, slotCount);
        if (!legal.length) break;
        place(cols, slots, legal[(rnd() * legal.length) | 0], slotCount);
        takes++;

      if (ok) wins++;
    }

  function stampMask(g, x0, y0, mask, opt) {
    opt = opt || {};
    const H = g.length, W = g[0].length;
    const rows = mask.map((r) => (typeof r === "string" ? r : r.join("")));
    const mh = rows.length, mw = rows.reduce((m, r) => Math.max(m, r.length), 0);
    const colors = opt.colors || [opt.border || 0, opt.fill == null ? (opt.border || 0) : opt.fill];
    const cells = [];
    for (let y = 0; y < mh; y++) {
      for (let x = 0; x < mw; x++) {
        const ch = rows[y][x];
        if (!ch || ch === "." || ch === " " || ch === "0") continue;
        const gx = x0 + x, gy = y0 + y;
        if (gx < 0 || gy < 0 || gx >= W || gy >= H) continue;
        let c = colors[0];
        if (ch >= "1" && ch <= "9") c = colors[(ch.charCodeAt(0) - 49) % colors.length];
        else {
          const edge = x === 0 || y === 0 || x === mw - 1 || y === mh - 1
            || !rows[y][x - 1] || rows[y][x - 1] === " " || rows[y][x - 1] === "."
            || !rows[y][x + 1] || rows[y][x + 1] === " " || rows[y][x + 1] === "."
            || !rows[y - 1] || !rows[y - 1][x] || rows[y - 1][x] === " " || rows[y - 1][x] === "."
            || !rows[y + 1] || !rows[y + 1][x] || rows[y + 1][x] === " " || rows[y + 1][x] === ".";
          c = edge ? colors[0] : (colors[1] != null ? colors[1] : colors[0]);
          if (opt.band && colors[2] != null) {
            const band = (y / mh);
            if (band < (opt.band[0] || 0.25)) c = colors[2];
          }
        }
        const cell = { c, on: true };
        if (opt.lock) cell.lock = opt.lock;
        if (opt.kind) cell.kind = opt.kind;
        g[gy][gx] = cell;
        cells.push([gx, gy]);
      }
    }
    return { w: mw, h: mh, cells };
  }

  function packLevel(lv) {
    const W = lv.W, H = lv.H;
    const lockIds = [];
    const idxOf = (id) => {
      if (!id) return 0;
      let i = lockIds.indexOf(id);
      if (i < 0) { if (lockIds.length >= 7) return 0; lockIds.push(id); i = lockIds.length; }
      else i = i + 1;
      return i;
    };
    const bytes = [W & 255, H & 255];
    const awakens = [];
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const c = lv.grid[y][x];
        if (!c) { bytes.push(0, 0); continue; }
        const kind = KIND_CODE[c.kind] || 0;
        let u = 1;
        u |= (c.c & 7) << 1;
        if (c.blink) u |= 16;
        if (c.dormant) u |= 32;
        if (c.on) u |= 64;
        u |= (idxOf(c.lock) & 7) << 7;
        u |= (idxOf(c.key) & 7) << 10;
        u |= (kind & 7) << 13;
        bytes.push(u & 255, (u >> 8) & 255);
        if (c.awaken && c.awaken.length) awakens.push({ x, y, cells: c.awaken });
      }
    }
    const cols = lv.cols || [];
    bytes.push(cols.length & 255);
    for (const col of cols) {
      bytes.push(col.length & 255);
      for (const t of col) {
        let f = (t.c & 7);
        if (t.duo) f |= 8;
        if (t.hidden) f |= 16;
        bytes.push(f, t.n & 255);
      }
    }
    bytes.push(awakens.length & 255);
    for (const a of awakens) {
      bytes.push(a.x & 255, a.y & 255, a.cells.length & 255);
      for (const [x, y] of a.cells) bytes.push(x & 255, y & 255);
    }
    return bytes;
  }

  function unpackLevel(bytes, meta) {
    let i = 0;
    const W = bytes[i++], H = bytes[i++];
    const g = emptyGrid(W, H);
    const lockName = (k) => (k ? "K" + k : null);
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const u = bytes[i] | (bytes[i + 1] << 8); i += 2;
        if (!(u & 1)) continue;
        const cell = {
          c: (u >> 1) & 7,
          blink: !!(u & 16),
          dormant: !!(u & 32),
          on: !!(u & 64),
        };
        const lock = (u >> 7) & 7;
        const key = (u >> 10) & 7;
        const kind = (u >> 13) & 7;
        if (lock) cell.lock = lockName(lock);
        if (key) cell.key = lockName(key);
        if (kind) cell.kind = KIND_NAME[kind] || null;
        g[y][x] = cell;
      }
    }
    const nCol = bytes[i++];
    const cols = [];
    let tid = 1;
    for (let c = 0; c < nCol; c++) {
      const nT = bytes[i++];
      const col = [];
      for (let t = 0; t < nT; t++) {
        const f = bytes[i++], n = bytes[i++];
        const tk = { c: f & 7, n, id: tid++ };
        if (f & 8) tk.duo = true;
        if (f & 16) tk.hidden = true;
        col.push(tk);
      }
      cols.push(col);
    }
    const nAw = bytes[i++];
    for (let a = 0; a < nAw; a++) {
      const sx = bytes[i++], sy = bytes[i++], n = bytes[i++];
      const cells = [];
      for (let k = 0; k < n; k++) cells.push([bytes[i++], bytes[i++]]);
      if (g[sy] && g[sy][sx]) g[sy][sx].awaken = cells;
    }
    meta = meta || {};
    return {
      id: meta.id || ("lv-" + (meta.n || 0)),
      name: meta.name || "",
      hint: meta.hint || "",
      tier: meta.tier || "",
      W, H, grid: g, cols, unlocked: {},
      coach: !!meta.coach,
      mechanic: meta.mechanic || null,
      mechs: meta.mechs || [],
      theme: meta.theme || "",
      water: !!meta.water,
      quote: meta.quote || "",
      n: meta.n || 0,
      ...meta,
    };
  }

  const api = {
    COLORS, drawColorPattern, LEVELS, emptyGrid, cloneGrid, cloneCols, cloneSlots,
    stampBuilding, stampMask, countOn, countNeed, isOpen, isReachable, findTarget, turnOff,
    saturate, leftCount, canTake, canPlaceTicket, place, frontsUseful, isWon, isLost,
    solve, greedySolve, leftmostSolve, smartSolve, ticketSumsOk, T,
    countSolutions, randomPlayouts, keyPathOf, ticketSig, legalMoves, gateColorSet,
    packLevel, unpackLevel,
  };
