    if (n > TUTORIAL) {
      // Shutter only covers a mid-band, so wait-colors on that building stay reachable.
      // After the tutorial, always have a full-building gate (lock or breaker).
      const GATES = ["lock", "breaker"];
      if (!chosen.some((m) => GATES.includes(m))) {
        const g = (unlocked.find((m) => GATES.includes(m))) || "lock";
        if (!chosen.includes(g)) chosen.unshift(g);
        if (role === "teachMech" && INTROS.find((x) => x.at === n)) {
          const id = INTROS.find((x) => x.at === n).id;
          if (!chosen.includes(id)) chosen.push(id);
        }
      }
    }
    return chosen;
  }

  function colorCountOf(n, role) {
    if (n <= TUTORIAL) return 2;
    const chap = Math.floor((n - 1) / 20);
    const pos = ((n - 1) % 20) + 1;
    // palette unlocks slowly; sawtooth inside each chapter
    const base = clamp(4 + Math.floor(chap / 8), 4, 7);
    let bump = 0;
    if (pos === 20) bump = 2;
    else if (pos === 10) bump = 1;
    else if (pos === 5 || pos === 15) bump = 1;
    else if (pos <= 3) bump = -1;
    else if (pos % 4 === 0) bump = 1;
    if (role === "teachMech") bump = Math.min(bump, 0);
    return clamp(base + bump, 4, C.COLORS.length);
  }

  function pacingOf(n) {
    const role = roleOf(n);
    // mid-high band after tutorial; no relax dip
    let target = 42;
    if (n <= TUTORIAL) target = 12 + n * 4;
    else if (role === "teachMech") target = 48;
    else if (role === "normal") target = clamp(50 + Math.sqrt(Math.max(0, n - TUTORIAL)) * 1.1, 50, 70);
    else if (role === "pit") target = clamp(60 + Math.sqrt(n) * 1.0, 60, 80);
    else if (role === "boss") target = clamp(70 + Math.sqrt(n) * 0.9, 70, 86);
    else if (role === "chapterBoss") target = clamp(76 + Math.sqrt(n) * 0.9, 76, 90);
    const colors = colorCountOf(n, role);
    const bury = n <= TUTORIAL ? 0 : (isBoss(role) ? 2 : role === "pit" ? 2 : role === "teachMech" ? 1 : 1);
    const chap = Math.floor((n - 1) / 20);
    const grow = clamp(Math.floor(chap / 5), 0, 4);
    let W = 20 + grow, H = 16 + grow, blds = 4;
    if (role === "pit") { W += 1; H += 1; blds = 4; }
    if (role === "boss") { W = 22 + grow; H = 18 + grow; blds = 2; }
    if (role === "chapterBoss") { W = 23 + grow; H = 19 + grow; blds = 2; }
    if (role === "teachMech") { W = 20 + Math.min(2, grow); H = 16 + Math.min(2, grow); }
    if (n <= TUTORIAL) { W = 16; H = 12; }
    return {
      n, role, target,
      lo: target - (isBoss(role) ? 10 : 14),
      hi: target + 14,
      colors, bury,
      blds,
      W, H,
    };
  }

  function themeFor(n) {
    const city = W.cityOf(n);
    const th = W.themeOfCity(city);
    const name = W.districtName(n);
    const landmark = W.isLandmarkLevel(n);
    return {
      ...th,
      name,
      landmark,
      landmarkType: city.landmark,
      landmarkName: city.landmarkName,
      quote: landmark ? city.quote : city.quote,
      character: city.character,
      open: city.open,
      close: city.close,
      city: city.id,
      cityName: city.name,
      water: !!city.water,
    };
  }

  function replayPeakAndThink(level, path, slotCount) {
    let grid = C.cloneGrid(level.grid);
    let cols = C.cloneCols(level.cols);
    let slots = Array(slotCount).fill(null);
    let unlocked = { ...(level.unlocked || {}) };
    let takes = 0, peak = 0, think = 0;
    for (const ci of path) {
      C.saturate(grid, slots, unlocked, takes);
      const useful = C.frontsUseful(grid, cols, unlocked, takes);
      if (useful.length && useful.indexOf(ci) < 0) think++;
      if (!C.place(cols, slots, ci, slotCount)) break;
      takes++;
      C.saturate(grid, slots, unlocked, takes);
      const used = slots.filter(Boolean).length;
      if (used > peak) peak = used;
    }
    return { peak, think };
  }

  function scoreDifficulty(level, sol, greedy, left, extra) {
    const rt = sol && sol.ok ? replayPeakAndThink(level, sol.path, 5) : { peak: 0, think: 0 };
    const colors = new Set();
    if (level.grid) for (const row of level.grid) for (const c of row) if (c && (c.on || c.dormant)) colors.add(c.c);
    const mechs = (level.mechs && level.mechs.length) ? level.mechs.length : (level.mechanic ? 1 : 0);
    let s = 0;
    if (greedy && !greedy.ok) s += 26;
    if (left && !left.ok) s += 10;
    s += clamp(rt.think * 6, 0, 24);
    s += clamp(Math.log10((sol && sol.visits) || 1) * 8, 0, 16);
    s += clamp((rt.peak - 2) * 5, 0, 14);
    s += (colors.size - 3) * 3;
    s += mechs * 4;
    if (level.pacing && level.pacing.bury) s += level.pacing.bury * 3;
    if (extra && extra.rand != null) s += clamp((0.1 - extra.rand) * 80, 0, 12);
    if (extra && extra.sols != null) s += clamp((6 - extra.sols) * 2, 0, 10);
    return {
      score: clamp(Math.round(s), 0, 100),
      peak: rt.peak, think: rt.think,
      visits: sol ? sol.visits : 0,
      greedyOk: !!(greedy && greedy.ok),
      leftOk: !!(left && left.ok),
    };
  }

  function recItem(item) { return typeof item === "number" ? { c: item } : item; }

  function splitCounts(total, k, rng) {
    k = Math.max(1, Math.min(k, total));
    if (k === 1) return [total];
    const raw = [];
    for (let i = 0; i < k; i++) raw.push(0.35 + rng());
    if (k >= 3) raw[0] *= 1.6 + rng();
    if (k >= 4 && rng() < 0.7) raw[1] *= 0.45 + rng() * 0.3;
    const sum = raw.reduce((a, b) => a + b, 0);
    const out = raw.map((w) => Math.max(1, Math.round(total * w / sum)));
    let diff = total - out.reduce((a, b) => a + b, 0);
    let i = 0;
    while (diff !== 0 && i < 200) {
      const j = i % k;
      if (diff > 0) { out[j]++; diff--; }
      else if (out[j] > 1) { out[j]--; diff++; }
      i++;
    }
    return out;
  }

  function assign(level, recipe, hiddenSet, rng) {
    hiddenSet = hiddenSet || new Set();
    rng = rng || mulberry32(hashStr("split:" + (level.id || level.n || 0)));
    const { n } = C.countNeed(level.grid);
    const parsed = recipe.map((col) => col.map(recItem));
    const need = {};
    for (const col of parsed) for (const it of col) need[it.c] = (need[it.c] || 0) + 1;
    const piles = {};
    for (const [cs, total] of Object.entries(n)) {
      const c = +cs, k = need[c] || 0;
      piles[c] = [];
      if (k === 0 && total > 0) throw new Error("color leftover " + c);
      if (k === 0) continue;
      const parts = splitCounts(total, k, rng);
      for (const v of parts) piles[c].push(v);
    }
    for (const c of Object.keys(need)) if (!n[+c]) throw new Error("no lights " + c);
    let tid = hashStr(level.id) % 100000;
    level.cols = parsed.map((col, ci) => col.map((it, ri) => {
      const hidden = !!(it.hidden || hiddenSet.has(ci + ":" + ri));
      const extra = {};
      if (hidden) extra.hidden = true;
      if (it.duo) extra.duo = true;
      return { c: it.c, n: piles[it.c].shift(), id: ++tid, ...extra };
    }));
    return level;
  }

  function bboxOf(g, pred) {
    let x0 = 99, y0 = 99, x1 = 0, y1 = 0, n = 0;
    for (let y = 0; y < g.length; y++)
      for (let x = 0; x < g[0].length; x++)
        if (g[y][x] && (!pred || pred(g[y][x], x, y))) {
          n++; x0 = Math.min(x0, x); y0 = Math.min(y0, y); x1 = Math.max(x1, x); y1 = Math.max(y1, y);
        }
    return n ? { x0, y0, x1, y1, n } : null;
  }

  function placeKeyCell(g, b, props) {
    const tryAt = (x, y) => {
      if (g[y] && g[y][x] && !g[y][x].key) { Object.assign(g[y][x], props); return true; }
      return false;
    };
    for (let x = b.x; x < b.x + b.w; x++) if (tryAt(x, b.y)) return;
    if (tryAt(b.x, b.y + Math.min(1, b.h - 1))) return;
    if (tryAt(b.x + b.w - 1, b.y + Math.min(1, b.h - 1))) return;
    if (g[b.y] && g[b.y][b.x]) Object.assign(g[b.y][b.x], props);
  }



  function nColorsUnlock(n) {
    if (n <= 20) return 5;
    if (n <= 80) return 6;
    if (n <= 200) return 7;
    return C.COLORS.length;
  }

  // v7 pixel-art facades. Zones: B body, A accent, C crown, F frame, S shopfront, R roof.
  const STYLES = {
    "中国": ["pagoda", "tower", "slab", "deco", "twin"],
    "东亚": ["pagoda", "tower", "slab", "twin"],
    "东南亚": ["dome", "tower", "twin", "pagoda"],
    "南亚": ["dome", "slab", "tower"],
    "西亚": ["dome", "tower", "slab"],
    "欧亚": ["dome", "mansard", "tower"],
    "欧洲": ["mansard", "gable", "dome", "deco"],
    "北美": ["deco", "tower", "slab", "twin"],
  };
  const LOW = ["gable", "mansard", "slab"];
  const TALL = ["tower", "deco", "pagoda", "twin", "dome"];

  function artMask(kind, w, h, rng) {
    const M = Array.from({ length: h }, () => Array(w).fill(null));
    const set = (x, y, z) => { if (x >= 0 && y >= 0 && x < w && y < h) M[y][x] = z; };
    const c0 = (w - 1) >> 1, c1 = w >> 1;
    const spire = (n) => { for (let y = 0; y < n; y++) { set(c0, y, "C"); set(c1, y, "C"); } return n; };
    const pat = ["ribbon", "column", "grid", "split", "plain"][(rng() * 5) | 0];
    const body = (x, y, x0, x1, y0) => {
      if (x === x0 || x === x1) return "F";
      const lx = x - x0, ly = y - y0;
      if (pat === "ribbon") return ly % 3 === 0 ? "A" : "B";
      if (pat === "column") return lx % 2 === 0 ? "A" : "B";
      if (pat === "grid") return lx % 2 === 0 && ly % 2 === 1 ? "A" : "B";
      if (pat === "split") return y < y0 + (h - y0) * 0.45 ? "A" : "B";
      return "B";
    };
    const row = (y, x0, x1, z, y0) => { for (let x = x0; x <= x1; x++) set(x, y, z || body(x, y, x0, x1, y0)); };
    if (kind === "twin" && w < 7) kind = "tower";
    if (kind === "tower") {
      const sp = spire(w >= 5 && rng() < 0.6 ? 1 + ((rng() * 2) | 0) : 0);
      let prev = -1;
      for (let y = sp; y < h; y++) {
        const f = (y - sp) / Math.max(1, h - sp);
        let ins = f < 0.16 ? 2 : f < 0.36 ? 1 : 0;
        while (ins > 0 && w - 2 * ins < 3) ins--;
        row(y, ins, w - 1 - ins, ins !== prev ? "C" : null, sp);
        prev = ins;
      }
    } else if (kind === "deco") {
      const steps = clamp(Math.floor((w - 3) / 2), 1, 3);
      let y = spire(rng() < 0.7 ? 1 + ((rng() * 2) | 0) : 0);
      const y0 = y;
      for (let s = 0; s < steps && y < h - 3; s++) {
        const ins = steps - s;
        row(y++, ins, w - 1 - ins, "C");
        row(y++, ins, w - 1 - ins, null, y0);
      }
      for (; y < h; y++) row(y, 0, w - 1, null, y0);
    } else if (kind === "slab") {
      let y = 0;
      if (w >= 5 && rng() < 0.6) { row(y++, Math.floor(w * 0.3), Math.ceil(w * 0.7) - 1, "C"); }
      row(y, 0, w - 1, "C");
      for (let yy = y + 1; yy < h; yy++) row(yy, 0, w - 1, null, y);
    } else if (kind === "gable") {
      const rh = clamp(Math.ceil(w / 2), 2, Math.max(2, Math.floor(h * 0.4)));
      const c = (w - 1) / 2;
      for (let r = 0; r < rh; r++) {
        const half = (r + 1) * (w / 2) / rh;
        for (let x = 0; x < w; x++) if (Math.abs(x - c) < half) set(x, r, "R");
      }
      for (let y = rh; y < h; y++) row(y, 0, w - 1, null, rh);
    } else if (kind === "mansard") {
      for (let x = 1; x < w - 1; x++) set(x, 0, x % 2 ? "A" : "R");
      row(1, 0, w - 1, "R");
      for (let y = 2; y < h; y++) row(y, 0, w - 1, null, 2);
    } else if (kind === "pagoda") {
      const sp = spire(1 + (rng() < 0.5 ? 1 : 0));
      const lv = Math.max(2, Math.floor((h - sp) / 3));
      const lh = (h - sp) / lv;
      for (let y = sp; y < h; y++) {
        const i = Math.min(lv - 1, Math.floor((y - sp) / lh));
        const eave = (y - sp) - Math.floor(i * lh) === 0;
        const ins = Math.min(Math.floor((w - 3) / 2), lv - 1 - i);
        if (eave) row(y, Math.max(0, ins - 1), w - 1 - Math.max(0, ins - 1), "R");
        else row(y, ins, w - 1 - ins, null, sp);
      }
    } else if (kind === "dome") {
      const fin = spire(1);
      const rh = clamp(Math.floor(w / 2), 2, Math.max(2, Math.floor(h * 0.35)));
      for (let r = 0; r < rh; r++) {
        const t = (r + 1) / rh;
        const half = (w / 2) * Math.sqrt(1 - (1 - t) * (1 - t));
        for (let x = 0; x < w; x++) if (Math.abs(x - (w - 1) / 2) < Math.max(0.6, half)) set(x, fin + r, "R");
      }
      const y0 = fin + rh;
      for (let y = y0; y < h; y++) for (let x = 0; x < w; x++) set(x, y, x === 0 || x === w - 1 ? "F" : x % 2 ? "B" : "A");
    } else if (kind === "twin") {
      const tw = Math.floor((w - 1) / 2);
      const pod = Math.floor(h * 0.72), bridge = Math.floor(h * 0.42);
      for (let y = 0; y < h; y++) {
        if (y >= pod) row(y, 0, w - 1, null, pod);
        else if (y === bridge) row(y, 0, w - 1, "A");
        else {
          row(y, 0, tw - 1, y === 0 ? "C" : null, 0);
          row(y, w - tw, w - 1, y === 0 ? "C" : null, 0);
        }
      }
    }
    for (let x = 0; x < w; x++) if (M[h - 1][x]) M[h - 1][x] = "S";
    stampIcon(M, w, h, rng);
    return M;
  }

  const ICONS5 = [
    [".#.#.", "#####", "#####", ".###.", "..#.."],
    ["..#..", ".###.", "#####", ".###.", "..#.."],
    ["..#..", "..#..", "#####", ".###.", ".#.#."],
    [".###.", "##...", "##...", "##...", ".###."],
    ["..##.", "..#.#", "..#..", "###..", "###.."],
    ["#...#", ".#.#.", "..#..", ".#.#.", "#...#"],
  ];
  const ICONS3 = [[".#.", "###", ".#."], ["#.#", ".#.", "#.#"], ["###", "#.#", "###"]];
  // A neon motif in the body: the window grid doubles as a pixel picture.
  function stampIcon(M, w, h, rng) {
    const icons = w >= 7 ? ICONS5 : w >= 5 ? ICONS3 : null;
    if (!icons || rng() < 0.25) return;
    const ic = icons[(rng() * icons.length) | 0];
    const s = ic.length;
    const free = (y) => M[y] && M[y].slice(1, w - 1).every((z) => z === "B" || z === "A");
    const ys = [];
    for (let y = 1; y + s < h - 1; y++) {
      let ok = true;
      for (let k = 0; k < s && ok; k++) ok = free(y + k);
      if (ok) ys.push(y);
    }
    if (!ys.length) return;
    const y0 = ys[Math.floor(ys.length * (0.2 + rng() * 0.3))];
    const x0 = (w - s) >> 1;
    for (let k = 0; k < s; k++) for (let j = 0; j < s; j++) {
      M[y0 + k][x0 + j] = ic[k][j] === "#" ? "I" : "B";
    }
  }

  function zoneColors(pal, k) {
    const L = pal.length, p = (i) => pal[(k + i) % L];
    if (L === 1) return { B: p(0), A: p(0), C: p(0), F: p(0), S: p(0), R: p(0), I: p(0) };
    if (L === 2) return { B: p(0), A: p(1), C: p(1), F: p(0), S: p(1), R: p(1), I: p(1) };
    return { B: p(0), A: p(1), C: p(2), F: p(1), S: p(2), R: p(2), I: p(2) };
  }

  function stampArt(g, x0, y0, M, zc) {
    for (let y = 0; y < M.length; y++)
      for (let x = 0; x < M[0].length; x++) {
        const z = M[y][x];
        if (!z || !g[y0 + y] || x0 + x >= g[0].length) continue;
        g[y0 + y][x0 + x] = { c: zc[z], on: true };
      }
  }

  // Landmarks at night: lit contour, ledge rows in a second tone, mask zones inside.
  function paintLandmark(g, cells, wp) {
    const inL = new Set(cells.map(([x, y]) => x + "," + y));
    const rowW = {};
    for (const [, y] of cells) rowW[y] = (rowW[y] || 0) + 1;
    const L = wp.length;
    const zoneOf = {};
    for (const [x, y] of cells) zoneOf[x + "," + y] = g[y][x].c;
    const zones = [...new Set(Object.values(zoneOf))];
    for (const [x, y] of cells) {
      const edge = !inL.has(x - 1 + "," + y) || !inL.has(x + 1 + "," + y) || !inL.has(x + "," + (y - 1)) || !inL.has(x + "," + (y + 1));
      const ledge = rowW[y - 1] != null && rowW[y - 1] !== rowW[y];
      const zi = zones.indexOf(zoneOf[x + "," + y]);
      g[y][x].c = edge ? wp[0] : ledge && L > 2 ? wp[2] : wp[(1 + zi) % L];
    }
  }

  function buildGrid(rng, pacing, mechs, city) {

    const landmark = !!(pacing.n % 10 === 0 && LM && city && LM.MASKS[city.landmark]);
    let W = pacing.W, H = pacing.H;
    let mask = null, mw = 0, mh = 0;
    if (landmark) {
      mask = LM.MASKS[city.landmark];
      const sz = LM.maskSize(mask);
      mw = sz.w; mh = sz.h;
      W = Math.max(W, mw + 5);
      H = Math.max(H, mh);
    }
    const g = C.emptyGrid(W, H);
    const needKey = mechs.some((m) => m === "lock" || m === "shutter" || m === "breaker" || m === "awaken");
    const needExtra = mechs.some((m) => m === "shutter" || m === "awaken");
    const palN = C.COLORS.length;
    const reserved = (needKey ? 1 : 0) + (needExtra ? 1 : 0);
    const want = pacing.colors;
    const paintN = clamp(want - reserved, 3, palN - reserved);
    const unlockedPal = nColorsUnlock(pacing.n);
    const bag = [];
    for (let i = 0; i < unlockedPal; i++) bag.push(i);
    for (let i = bag.length - 1; i > 0; i--) {
      const j = (rng() * (i + 1)) | 0;
      const tmp = bag[i]; bag[i] = bag[j]; bag[j] = tmp;
    }
    const colors = bag.slice(0, paintN);
    const rest = bag.filter((c) => colors.indexOf(c) < 0);
    for (let i = 0; i < palN; i++) if (rest.indexOf(i) < 0 && colors.indexOf(i) < 0) rest.push(i);
    const keyColor = needKey ? (rest[0] != null ? rest[0] : (paintN % palN)) : colors[colors.length - 1];
    const extraColor = needExtra ? (rest[1] != null && rest[1] !== keyColor ? rest[1] : (rest[0] != null && rest[0] !== keyColor ? rest[0] : (keyColor + 1) % palN)) : keyColor;
    // Split paint colors: useful (reachable buildings) vs wait (locked landmark / right building only).
    // Sharing a palette across all buildings made locked colors immediately useful, so greedy could cruise.
    const waitN = clamp(colors.length - 2, 1, Math.min(4, colors.length - 1));
    const usefulPal = colors.slice(0, colors.length - waitN);
    const waitPal = colors.slice(colors.length - waitN);
    if (!usefulPal.length) usefulPal.push(colors[0]);
    const blds = [];
    const styles = STYLES[city && city.region] || ["tower", "slab", "gable", "deco", "dome"];
    const pick = (pool) => {
      const own = pool.filter((k) => styles.includes(k));
      const src = own.length ? own : pool;
      return src[(rng() * src.length) | 0];
    };

    // always a left gatehouse / workshop for keys & switches
    const gw = landmark ? clamp(irand(rng, 4, 5), 3, Math.max(3, W - mw - 1)) : 0;
    if (landmark) {
      const gh = irand(rng, Math.max(8, H - 5), H);
      const gy = H - gh;
      stampArt(g, 0, gy, artMask(pick(LOW), gw, gh, rng), zoneColors(usefulPal, 0));
      blds.push({ x: 0, y: gy, w: gw, h: gh, gate: true });
      const lx = W - mw;
      const ly = Math.max(0, H - mh);
      const mc = [waitPal[0], waitPal[1 % waitPal.length], waitPal[2 % waitPal.length]];
      const st = C.stampMask(g, lx, ly, mask, { colors: mc });
      paintLandmark(g, st.cells, waitPal);
      blds.push({ x: lx, y: ly, w: mw, h: mh, landmark: true });
    } else {
      const nB = W >= 26 ? 4 : 3;
      const room = W - (nB - 1);
      const ws = [];
      let left = room;
      for (let i = 0; i < nB; i++) {
        const rest = nB - i - 1;
        const avg = left / (nB - i);
        const bw = i === nB - 1 ? left : clamp(Math.round(avg + (rng() - 0.5) * 3), 4, left - rest * 4);
        ws.push(bw);
        left -= bw;
      }
      let x = 0;
      for (let i = 0; i < nB; i++) {
        const bw = ws[i];
        const last = i === nB - 1;
        const kind = i === 0 ? pick(bw >= 6 ? LOW : ["slab", "gable"]) : last ? pick(TALL) : pick(rng() < 0.5 ? TALL : LOW);
        const frac = i === 0 ? 0.5 + rng() * 0.2 : last ? 0.88 + rng() * 0.12 : 0.6 + rng() * 0.35;
        const bh = clamp(Math.round(H * frac), 7, H);
        const y = H - bh;
        const pal = last ? waitPal : usefulPal;
        stampArt(g, x, y, artMask(kind, bw, bh, rng), zoneColors(pal, i));
        blds.push({ x, y, w: bw, h: bh, kind });
        x += bw + 1;
      }
    }
    if (!blds.length) throw new Error("no buildings");

    const leftB = blds[0];
    const midB = blds[Math.floor(blds.length / 2)] || blds[0];
    const rightB = blds[blds.length - 1];
    const used = mechs.slice();

    if (used.includes("lock") && blds.length >= 2) {
      const id = "L" + pacing.n;
      const b = rightB;
      const y0 = b.y + (landmark ? Math.max(1, (b.h * 0.15) | 0) : 0);
      for (let yy = y0; yy < b.y + b.h; yy++)
        for (let xx = b.x; xx < b.x + b.w; xx++)
          if (g[yy][xx]) { g[yy][xx].lock = id; g[yy][xx].kind = g[yy][xx].kind || "zone"; }
      placeKeyCell(g, leftB, { key: id, kind: "key", c: keyColor });
    }

    if (used.includes("shutter")) {
      const id = "S" + pacing.n;
      // Gate the wait-palette building (the last one). Only use mid when lock/breaker already owns the right building.
      const b = landmark ? rightB : ((used.includes("lock") || used.includes("breaker")) ? midB : rightB);
      const y0 = b.y + Math.max(2, (b.h * 0.3) | 0);
      const y1 = Math.min(b.y + b.h - 2, y0 + Math.max(2, (b.h * 0.3) | 0));
      for (let yy = y0; yy < y1; yy++)
        for (let xx = b.x; xx < b.x + b.w; xx++)
          if (g[yy][xx]) { g[yy][xx].lock = id; g[yy][xx].kind = "shutter"; g[yy][xx].c = extraColor; }
      placeKeyCell(g, leftB, { key: id, kind: "button", c: keyColor });
    }

    if (used.includes("breaker") && blds.length >= 2) {
      const id = "B" + pacing.n;
      const b = rightB;
      // if already locked by "lock", apply breaker to a mid band only when both present
      const already = used.includes("lock");
      const y0 = already ? b.y + ((b.h * 0.45) | 0) : b.y;
      for (let yy = y0; yy < b.y + b.h; yy++)
        for (let xx = b.x; xx < b.x + b.w; xx++)
          if (g[yy][xx]) { g[yy][xx].lock = id; g[yy][xx].kind = "zone"; }
      placeKeyCell(g, leftB, { key: id, kind: "breaker", c: keyColor });
    }

    if (used.includes("awaken")) {
      const b = landmark ? rightB : midB;
      const cells = [];
      const ix0 = b.x + (landmark ? Math.max(0, (b.w * 0.15) | 0) : 0);
      const ix1 = b.x + b.w - (landmark ? Math.max(0, (b.w * 0.15) | 0) : 0);
      const iy0 = b.y + Math.max(1, (b.h * 0.25) | 0);
      const iy1 = Math.min(b.y + b.h - 1, iy0 + Math.max(3, (b.h * 0.4) | 0));
      for (let yy = iy0; yy < iy1; yy++)
        for (let xx = ix0; xx < ix1; xx++)
          if (g[yy] && g[yy][xx] && !g[yy][xx].lock) {
            g[yy][xx].on = false;
            g[yy][xx].dormant = true;
            g[yy][xx].kind = "screen";
            g[yy][xx].c = extraColor;
            cells.push([xx, yy]);
          }
      if (cells.length) {
        placeKeyCell(g, leftB, { awaken: cells, kind: "switch", c: keyColor });
      }
    }

    if (used.includes("blink")) {
      const b = rightB;
      for (let xx = b.x; xx < b.x + b.w; xx++) {
        let top = -1;
        for (let yy = b.y; yy < b.y + b.h; yy++) if (g[yy] && g[yy][xx]) { top = yy; break; }
        if (top < 0) continue;
        for (const yy of [top, top + 1]) {
          const c = g[yy] && g[yy][xx];
          if (!c || c.key || c.dormant || (yy > top && rng() < 0.4)) continue;
          c.blink = true;
          c.kind = c.kind || "lantern";
        }
      }
    }

    return { grid: g, W, H, blds };
  }

  function gateColors(grid) {
    const set = new Set();
    for (const row of grid) for (const c of row) {
      if (c && (c.key || (c.awaken && c.awaken.length))) set.add(c.c);
    }
    return [...set];
  }

  function colorClasses(grid) {
    const useful = new Set();
    const locked = new Set();
    const present = new Set();
    const keys = new Set();
    for (let y = 0; y < grid.length; y++) {
      for (let x = 0; x < grid[0].length; x++) {
        const c = grid[y][x];
        if (!c || !(c.on || c.dormant)) continue;
        present.add(c.c);
        if (c.key || (c.awaken && c.awaken.length)) keys.add(c.c);
        if (c.lock) locked.add(c.c);
        if (c.on && C.isReachable(grid, x, y, {}, 0)) useful.add(c.c);
      }
    }
    return { useful, locked, present, keys };
  }

  function buildRecipe(rng, level, pacing, mechs) {
    const { n } = C.countNeed(level.grid);
    const colors = Object.keys(n).map(Number).sort((a, b) => a - b);
    if (!colors.length) throw new Error("no colors");
    const cls = colorClasses(level.grid);
    const gates = [...cls.keys];
    const duoColor = mechs.includes("duo")
      ? (colors.find((c) => cls.useful.has(c) && !cls.keys.has(c) && n[c] >= 16) ?? colors.find((c) => cls.useful.has(c) && !cls.keys.has(c)))
      : null;
    const hide = mechs.includes("hidden");

    const parts = {};
    for (const c of colors) {
      const total = n[c];
      let k = 2;
      if (total >= 14) k = 3;
      if (total >= 24) k = 4;
      if (total >= 40) k = 5;
      if (total >= 70) k = 6;
      if (cls.locked.has(c) && !cls.useful.has(c) && total >= 8) k = Math.max(k, Math.min(isBoss(pacing.role) ? 7 : 6, Math.max(4, Math.floor(total / 10))));
      if (cls.keys.has(c)) k = Math.max(1, Math.min(2, total));
      if (duoColor === c) k = 2;
      if (k > total) k = Math.max(1, total);
      parts[c] = k;
    }

    let tickets = [];
    for (const c of colors) {
      for (let i = 0; i < parts[c]; i++) {
        const t = { c };
        if (duoColor === c) t.duo = true;
        tickets.push(t);
      }
    }

    const keyT = tickets.filter((t) => cls.keys.has(t.c));
    const usefulT = tickets.filter((t) => !cls.keys.has(t.c) && cls.useful.has(t.c));
    const waitT = tickets.filter((t) => !cls.keys.has(t.c) && !cls.useful.has(t.c));
    const cols = [[], [], [], []];
    // 5 slots: at most 4 unusable waits can sit in front of the key.
    const keyDepth = keyT.length
      ? 4
      : 0;
    // All four fronts should be waiting colors so random is tempted to fill the slots.
    // The key sits at the bottom of column 3, behind keyDepth waiting tickets.
    const reserve = waitT.slice(0, keyDepth);
    const restW = waitT.slice(keyDepth);
    // one waiting front on columns 0-2 first, then leftover waits, useful tucked behind in col 0
    for (let i = 0; i < 3; i++) {
      if (restW.length) cols[i].push(restW.shift());
    }
    restW.forEach((t, i) => cols[i % 3].push(t));
    usefulT.forEach((t) => cols[0].push(t));
    reserve.forEach((t) => cols[3].push(t));
    keyT.forEach((t) => cols[3].push(t));
    if (!waitT.length && !keyT.length && usefulT.length >= 5) {
      for (let i = 0; i < 4; i++) cols[i] = [];
      usefulT.forEach((t, i) => cols[i % 4].push(t));
    }
    for (let ci = 0; ci < 4; ci++) {
      if (!cols[ci].length) {
        const src = cols.slice().sort((a, b) => b.length - a.length)[0];
        if (src && src.length > 1) cols[ci].push(src.pop());
      }
    }

    const hiddenSet = new Set();
    if (hide) {
      for (let ci = 0; ci < 4; ci++) {
        for (let ri = 1; ri < cols[ci].length; ri++) {
          if (rng() < (isBoss(pacing.role) ? 0.75 : 0.5)) hiddenSet.add(ci + ":" + ri);
        }
      }
      if (isBoss(pacing.role) || pacing.role === "pit") hiddenSet.add("3:0");
    }
    return { recipe: cols, hiddenSet };
  }

  function hintFor(mechs, role, th) {
    if (role === "chapterBoss") return "今晚要把" + (th && th.landmarkName ? th.landmarkName : "地标") + "的灯关完。先看标记，别着急点。";
    if (isBoss(role)) return "今晚的地标要细想。先看哪些灯已经贴着夜空。";
    if (!mechs.length) return "先看哪些灯已经贴着夜空。";
    const bits = mechs.map((m) => (MECH_META[m] && MECH_META[m].label) || m);
    if (isBoss(role)) return "今晚机关叠在一起：" + bits.join("、") + "。先看标记再下手。";
    return "今晚要注意：" + bits.join("、") + "。";
  }

  function attachWorld(lv, n) {
    const th = themeFor(n);
    const city = W.cityOf(n);
    const role = roleOf(n);
    lv.n = n;
    lv.name = th.name;
    lv.theme = th.id;
    lv.themeDef = th;
    lv.water = !!th.water;
    lv.quote = (role === "chapterBoss" ? city.close : city.quote);
    lv.character = city.character;
    lv.chapter = W.chapterOf(n);
    lv.chapterName = city.name;
    lv.city = city.id;
    lv.cityName = city.name;
    lv.landmark = W.isLandmarkLevel(n);
    lv.landmarkType = city.landmark;
    lv.landmarkName = city.landmarkName;
    lv.region = city.region;
    lv.open = city.open;
    lv.close = city.close;
    if (!lv.tier) {
      lv.tier = tierName(n);
    }
    if (!lv.hint) lv.hint = hintFor(lv.mechs || [], role, th);
    return lv;
  }

  function enrich(L, n) {
    attachWorld(L, n);
    if (!L.mechs) L.mechs = L.mechanic ? String(L.mechanic).split("+") : [];
    L._enriched = true;
    return L;
  }

  function tryOnce(n, attempt, gridOverride) {
    const pacing = pacingOf(n);
    const rng = mulberry32(hashStr("nl5:" + n + ":" + attempt));
    const mechs = gridOverride ? (gridOverride.mechs || pickMechs(n, pacing.role, rng)) : pickMechs(n, pacing.role, rng);
    const th = themeFor(n);
    const city = W.cityOf(n);
    let built;
    if (gridOverride) {
      built = { grid: C.cloneGrid(gridOverride.grid), W: gridOverride.W, H: gridOverride.H };
    } else {
      built = buildGrid(rng, pacing, mechs, city);
    }
    const lv = {
      id: (gridOverride && gridOverride.id) || ("gen-" + n),
      name: th.name,
      hint: hintFor(mechs, pacing.role, th),
      tier: tierName(n),
      W: built.W,
      H: built.H,
      grid: built.grid,
      cols: null,
      unlocked: {},
      coach: n <= 3,
      mechanic: mechs.join("+") || null,
      mechs,
      n,
      generated: !gridOverride,
      pacing,
    };
    attachWorld(lv, n);
    const { recipe, hiddenSet } = buildRecipe(rng, lv, pacing, mechs);
    assign(lv, recipe, hiddenSet, rng);
    if (!C.ticketSumsOk(lv).ok) return null;
    return lv;
  }

  function evaluate(lv, opts) {
    opts = opts || {};
    const sol = C.solve(lv, 5, { maxVisits: opts.maxVisits || 80000 });
    if (!sol.ok) return { ok: false, reason: "unsolvable", sol };
    const greedy = C.greedySolve(lv, 5);
    const left = C.leftmostSolve(lv, 5);
    const n = lv.n || 0;
    if (n > TUTORIAL && greedy.ok && !opts.keepGoing) {
      const sc = scoreDifficulty(lv, sol, greedy, left, { rand: 1, sols: 99 });
      return { ok: true, sol, greedy, left, rand: { rate: 1, wins: 0, trials: 0 }, cnt: { count: 99, unique: false, keyUnique: false, keyCount: 99 }, diff: sc, failHard: true };
    }
    const randTrials = opts.randTrials || 80;
    const rand = C.randomPlayouts(lv, 5, randTrials, hashStr("rnd:" + lv.n));
    if (n > TUTORIAL && (isBoss(roleOf(n)) ? rand.rate >= 0.02 - 1e-9 : rand.rate > 0.10 + 1e-9) && !opts.keepGoing) {
      const sc = scoreDifficulty(lv, sol, greedy, left, { rand: rand.rate, sols: 99 });
      return { ok: true, sol, greedy, left, rand, cnt: { count: 99, unique: false, keyUnique: false, keyCount: 99 }, diff: sc, failHard: true };
    }
    const cnt = C.countSolutions(lv, 5, { maxVisits: opts.countVisits || 60000, maxSol: opts.maxSol || 16 });
    const sc = scoreDifficulty(lv, sol, greedy, left, { rand: rand.rate, sols: cnt.count });
    return { ok: true, sol, greedy, left, rand, cnt, diff: sc };
  }

  function passesHard(n, ev) {
    const role = roleOf(n);
    if (n <= TUTORIAL) return ev.sol && ev.sol.ok;
    if (!ev.sol || !ev.sol.ok) return false;
    if (ev.greedy && ev.greedy.ok) return false;
    const randCap = isBoss(role) ? 0.02 : (role === "teachMech" ? 0.10 : 0.10);
    if (ev.rand && (isBoss(role) ? ev.rand.rate >= randCap - 1e-9 : ev.rand.rate > randCap + 1e-9)) return false;
    if (isBoss(role)) {
      if (!(ev.cnt && (ev.cnt.unique || ev.cnt.keyUnique))) return false;
    } else {
      const keyCap = role === "pit" ? 4 : 6;
      if (ev.cnt && ev.cnt.keyCount > keyCap) return false;
    }
    return true;
  }

  const cache = {};
  let BANK = null;

  function setBank(bank) { BANK = bank; }

  function installBankFromRaw(raw, meta) {
    const u8 = raw instanceof Uint8Array ? raw : new Uint8Array(raw);
    const list = Array.isArray(meta) ? meta : [];
    const packs = {};
    let i = 0, n = 1;
    while (i + 2 <= u8.length) {
      const len = u8[i] | (u8[i + 1] << 8);
      i += 2;
      if (i + len > u8.length) break;
      const bytes = u8.slice(i, i + len);
      const recMeta = list.find((m) => m && m.n === n) || list[n - 1] || { n };
      packs[n] = { bytes, meta: recMeta };
      i += len;
      n++;
    }
    setBank({ packs });
    return n - 1;
  }

  function b64ToU8(b64) {
    if (typeof Buffer !== "undefined") return Uint8Array.from(Buffer.from(b64, "base64"));
    const bin = atob(b64);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  function inflateRaw(u8) {
    if (typeof require === "function") {
      try {
        const zlib = require("zlib");
        const out = zlib.inflateRawSync(Buffer.from(u8));
        return Promise.resolve(out instanceof Uint8Array ? out : Uint8Array.from(out));
      } catch (e) { /* fall through to browser API */ }
    }
    if (typeof DecompressionStream === "undefined") return Promise.reject(new Error("no inflate"));
    const ds = new DecompressionStream("deflate-raw");
    return new Response(new Blob([u8]).stream().pipeThrough(ds)).arrayBuffer().then((b) => new Uint8Array(b));
  }

  function loadBankB64(b64, meta) {
    if (!b64) return Promise.resolve(0);
    return inflateRaw(b64ToU8(b64)).then((raw) => installBankFromRaw(raw, meta));
  }

  function fromBank(n) {
    const src = BANK || root.NIGHT_BANK;
    if (!src || !src.packs) return null;
    const rec = src.packs[n];
    if (!rec) return null;
    const lv = C.unpackLevel(rec.bytes, rec.meta);
    attachWorld(lv, n);
    if (rec.meta) {
      if (rec.meta.diff) lv.diff = rec.meta.diff;
      if (rec.meta.rand != null) lv.rand = rec.meta.rand;
      if (rec.meta.sols != null) lv.sols = rec.meta.sols;
      if (rec.meta.keyCount != null) lv.keyCount = rec.meta.keyCount;
      if (rec.meta.unique != null) lv.unique = rec.meta.unique;
      if (rec.meta.keyUnique != null) lv.keyUnique = rec.meta.keyUnique;
      if (rec.meta.greedyOk != null) lv.greedyOk = rec.meta.greedyOk;
    }
    return lv;
  }

  function generate(n, opts) {
    if (cache[n] && !(opts && opts.noBank)) return cache[n];
    const banked = opts && opts.noBank ? null : fromBank(n);
    if (banked) { cache[n] = banked; return banked; }
    if (n <= 5 && C.LEVELS[n - 1] && !(opts && opts.forceGen)) {
      const lv = enrich(C.LEVELS[n - 1], n);
      cache[n] = lv;
      return lv;
    }
    const pacing = pacingOf(n);
    const maxTry = (opts && opts.maxTry) || (isBoss(pacing.role) ? 90 : 64);
    let best = null, bestEv = null, bestFit = 1e9;
    const gridOverride = opts && opts.gridOverride;
    for (let a = 0; a < maxTry; a++) {
      let lv = null;
      try { lv = tryOnce(n, a, gridOverride); } catch (e) { continue; }
      if (!lv) continue;
      const ev = evaluate(lv, {
        maxVisits: a < 20 ? 30000 : 80000,
        countVisits: a < 20 ? 40000 : 80000,
        randTrials: 200,
        maxSol: isBoss(pacing.role) ? 8 : 16,
      });
      if (!ev.ok) continue;
      lv.diff = ev.diff;
      lv.rand = ev.rand.rate;
      lv.sols = ev.cnt.count;
      lv.keyCount = ev.cnt.keyCount;
      lv.unique = ev.cnt.unique;
      lv.keyUnique = ev.cnt.keyUnique;
      lv.greedyOk = ev.greedy.ok;
      lv.solPath = ev.sol.path;
      const hard = passesHard(n, ev);
      const fit = Math.abs(ev.diff.score - pacing.target) + (hard ? 0 : 40);
      if (hard && fit < bestFit) { bestFit = fit; best = lv; bestEv = ev; }
      else if (!best && ev.sol.ok) { best = lv; bestEv = ev; bestFit = fit; }
      if (hard && fit <= 8) break;
      // Scores run above target late in the run; once a hard-passing level exists, stop searching after a budget.
      if (best && bestFit < 40 && a >= (isBoss(pacing.role) ? 24 : 14)) break;
    }
    if (!best) throw new Error("generate failed " + n);
    if (n > TUTORIAL && bestEv && !passesHard(n, bestEv)) throw new Error("generate failed hard " + n);
    cache[n] = best;
    return best;
  }

  function getLevel(i) {
    const n = i + 1;
    const b = fromBank(n);
    if (b) return b;
    if (i < 5 && C.LEVELS[i]) return enrich(C.LEVELS[i], n);
    return generate(n);
  }

  function introFor(n) { return INTROS.find((x) => x.at === n) || null; }

  // v6 difficulty tiers: sawtooth per 20-level city, softer first chapter.
  const TIER_CH1 = { 6: "breath", 7: "breath", 8: "normal", 9: "normal", 11: "breath", 12: "normal", 13: "normal", 14: "normal", 15: "hard", 16: "breath", 17: "normal", 18: "normal", 19: "hard" };
  const TIER_POS = [null, "breath", "normal", "normal", "hard", "hard", "breath", "normal", "normal", "hard", "boss",
    "breath", "normal", "normal", "hard", "hard", "breath", "normal", "normal", "hard", "boss"];
  const TIER_NAME = { teach: "入门", breath: "轻松", normal: "普通", hard: "困难" };
  function tierOf(n) {
    if (n <= TUTORIAL) return "teach";
    if (n % 10 === 0) return "boss";
    if (n <= 20) return TIER_CH1[n] || "normal";
    const pos = ((n - 1) % 20) + 1;
    return n <= 40 && pos === 4 ? "normal" : TIER_POS[pos];
  }
  function tierName(n) {
    const t = tierOf(n);
    if (t === "boss") return n % 20 === 0 ? "章末" : "地标";
    return TIER_NAME[t];
  }

  function arrangeTickets(lv, tier, rng) {
    const gates = C.gateColorSet(lv.grid);
    const useful = new Set();
    for (let y = 0; y < lv.H; y++) for (let x = 0; x < lv.W; x++) {
      const c = lv.grid[y][x];
      if (c && c.on && C.isReachable(lv.grid, x, y, {}, 0)) useful.add(c.c);
    }
    const all = lv.cols.flat().map((t) => ({ c: t.c, n: t.n, duo: !!t.duo }))
      .sort((a, b) => a.c - b.c || a.n - b.n || (a.duo - b.duo));
    const shuffle = (a) => { for (let i = a.length - 1; i > 0; i--) { const j = (rng() * (i + 1)) | 0; const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
    const gate = all.filter((t) => gates.has(t.c));
    const rest = shuffle(all.filter((t) => !gates.has(t.c)));
    const waitT = rest.filter((t) => !useful.has(t.c));
    const useT = rest.filter((t) => useful.has(t.c));
    const cols = [[], [], [], []];
    const depth = { breath: [0, 1], normal: [1, 2], hard: [2, 4] }[tier];
    const taken = [];
    for (const t of gate) {
      let ci = (rng() * 4) | 0;
      for (let k = 0; k < 8 && taken.includes(ci); k++) ci = (rng() * 4) | 0;
      taken.push(ci);
      const d = depth[0] + ((rng() * (depth[1] - depth[0] + 1)) | 0);
      for (let k = 0; k < d; k++) {
        const pickWait = tier === "breath" ? rng() < 0.5 : rng() < 0.8;
        const src = (pickWait ? waitT : useT).length ? (pickWait ? waitT : useT) : (waitT.length ? waitT : useT);
        if (src.length) cols[ci].push(src.shift());
      }
      cols[ci].push(t);
    }
    const pool = tier === "breath" ? useT.concat(waitT) : shuffle(waitT.concat(useT));
    for (const t of pool) {
      let ci = (rng() * 4) | 0;
      if (rng() < 0.6) ci = cols.reduce((m, c, i) => (c.length < cols[m].length ? i : m), 0);
      cols[ci].push(t);
    }
    const hide = (lv.mechs || []).includes("hidden") || lv.cols.some((c) => c.some((t) => t.hidden));
    let id = hashStr("tk:" + lv.id) % 100000;
    return {
      ...lv,
      cols: cols.map((col) => col.map((t, ri) => {
        const o = { c: t.c, n: t.n, id: ++id };
        if (t.duo) o.duo = true;

  function tuneTickets(lv, n, tries) {
    const tier = tierOf(n);
    if (tier === "teach" || tier === "boss") return { lv, tier, kept: true };
    const rng = mulberry32(hashStr("tune6:" + n + ":" + (lv.artSeed || 0)));
    let soft = null;

      if (tier === "normal") { if (smart.ok) return { lv: cand, tier, path: smart.path }; continue; }
      if (smart.ok) { if (!soft) soft = { lv: cand, tier: "normal", path: smart.path }; continue; }
      if (C.randomPlayouts(cand, 5, 120, hashStr("rnd:" + n)).rate >= 0.05) continue;
      if (C.randomPlayouts(cand, 5, 200, hashStr("rnd6:" + n)).rate >= 0.08) continue;
      const sol = C.solve(cand, 5, { maxVisits: tries ? Math.min(4000, budget) : 60000 });
      budget -= sol.visits;
      if (sol.ok) return { lv: cand, tier, path: sol.path };

    for (let i = 0; i < s.length; i++) n = Math.imul(n ^ s.charCodeAt(i), 16777619);
    return n >>> 0;
  }
  function lerp(a, b, t) { return a + (b - a) * t; }
  function hexA(h, a) {
    if (Array.isArray(h)) h = h[0];
    if (typeof h !== "string" || !h.startsWith("#")) h = "#ffffff";
    const n = h.replace("#", "");
    const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
    return `rgba(${r},${g},${b},${a})`;
  }
  function lerpC(a, b, t) {
    const P = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
    const A = P(a), B = P(b);
    return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(",")})`;
  }
  function roundRect(c, x, y, w, h, r) {
    const rr = Math.max(0, Math.min(r, w / 2, h / 2));
    c.beginPath();
    c.moveTo(x + rr, y);
    c.arcTo(x + w, y, x + w, y + h, rr);
    c.arcTo(x + w, y + h, x, y + h, rr);
    c.arcTo(x, y + h, x, y, rr);
    c.arcTo(x, y, x + w, y, rr);
    c.closePath();
  }

  /* ---------- glow sprites (no per-frame shadowBlur) ---------- */
  const glowSprites = [];
  function makeGlows() {
    for (let i = 0; i < C.COLORS.length; i++) {
      const c = document.createElement("canvas");
      c.width = c.height = 64;
      const x = c.getContext("2d");
      const col = C.COLORS[i].glow;
      const g = x.createRadialGradient(32, 32, 2, 32, 32, 30);
      g.addColorStop(0, hexA("#fff8e0", 0.95));
      g.addColorStop(0.2, hexA(col, 0.7));
      g.addColorStop(0.55, hexA(col, 0.22));
      g.addColorStop(1, hexA(col, 0));
      x.fillStyle = g;
      x.fillRect(0, 0, 64, 64);
      glowSprites[i] = c;
    }
  }
  makeGlows();

  function bindBoardZoom() {
    const el = board;
    if (!el || el._zoomBound) return;
    el._zoomBound = true;
    el.style.touchAction = "none";
    const pts = new Map();
    let lastDist = 0, lastMid = null, lastOne = null;
    const stageSize = () => {
      const wrap = $("#stage");
      if (wrap) layout(wrap.clientWidth, wrap.clientHeight);
      glowDirty = true;
    };
    el.addEventListener("pointerdown", (e) => {
      if (screen !== "game") return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      try { el.setPointerCapture(e.pointerId); } catch (err) {}
      if (pts.size === 2) {
        const a = [...pts.values()];
        lastDist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        lastMid = { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
      } else if (pts.size === 1) {
        lastOne = { x: e.clientX, y: e.clientY };
      }
    });
    el.addEventListener("pointermove", (e) => {
      if (!pts.has(e.pointerId)) return;
      pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pts.size === 2) {
        const a = [...pts.values()];
        const dist = Math.hypot(a[0].x - a[1].x, a[0].y - a[1].y);
        const mid = { x: (a[0].x + a[1].x) / 2, y: (a[0].y + a[1].y) / 2 };
        if (lastDist > 8) {
          viewZoom = Math.max(1, Math.min(2.8, viewZoom * (dist / lastDist)));
          viewPanX += mid.x - lastMid.x;
          viewPanY += mid.y - lastMid.y;
          if (viewZoom <= 1.02) { viewZoom = 1; viewPanX = 0; viewPanY = 0; }
          stageSize();
        }
        lastDist = dist; lastMid = mid;
      } else if (pts.size === 1 && viewZoom > 1.02 && lastOne) {
        viewPanX += e.clientX - lastOne.x;
        viewPanY += e.clientY - lastOne.y;
        lastOne = { x: e.clientX, y: e.clientY };
        stageSize();
      }
    });
    const up = (e) => { pts.delete(e.pointerId); if (pts.size < 2) lastDist = 0; if (!pts.size) lastOne = null; };
    el.addEventListener("pointerup", up);
    el.addEventListener("pointercancel", up);
    el.addEventListener("dblclick", () => { resetView(); stageSize(); });
    el.addEventListener("wheel", (e) => {
      if (screen !== "game" || !LV) return;
      e.preventDefault();
      const factor = e.deltaY > 0 ? 0.92 : 1.08;
      viewZoom = Math.max(1, Math.min(2.8, viewZoom * factor));
      if (viewZoom <= 1.02) { viewZoom = 1; viewPanX = 0; viewPanY = 0; }
      stageSize();
    }, { passive: false });
  }
  bindBoardZoom();


  let viewZoom = 1, viewPanX = 0, viewPanY = 0;
  let bloomCv = document.createElement("canvas");
  let bloomCtx = bloomCv.getContext("2d");
  let skyCv = document.createElement("canvas");
  let skyCtx = skyCv.getContext("2d");

  /* ---------- stars ---------- */
  function seedStars() {
    stars = Array.from({ length: 90 }, (_, i) => ({
      x: Math.random(),
      y: Math.random() * 0.7,
      r: 0.4 + Math.random() * 1.7,
      p: Math.random() * Math.PI * 2,
      s: 0.5 + Math.random() * 1.8,
      b: 0.35 + Math.random() * 0.65,
    }));

  /* ---------- layout ---------- */
  function resize() {
    const wrap = $("#stage");
    if (!wrap) return;
    const w = wrap.clientWidth;
    const h = wrap.clientHeight;
    const dpr = Math.min(2.5, window.devicePixelRatio || 1);
    board.width = Math.max(1, w * dpr);
    board.height = Math.max(1, h * dpr);
    board.style.width = w + "px";
    board.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    layout(w, h);
    glowDirty = true;
    skyKey = "";
  }

  function layout(w, h) {
    if (!LV) { geo = { w, h }; return; }
    const slotBand = 70;
    const streetY = h - slotBand;
    const sky = Math.max(52, h * 0.11);
    const cityH = Math.max(100, streetY - sky - 6);
    const fit = Math.max(8, Math.min((w - 12) / LV.W, cityH / LV.H));
    const zoom = viewZoom || 1;
    const cs = fit * zoom;
    let ox = (w - cs * LV.W) / 2 + viewPanX;
    let oy = streetY - 8 - cs * LV.H + viewPanY;
    if (zoom > 1.01) {
      const minOx = Math.min(8, w - 8 - cs * LV.W);
      const maxOx = Math.max(8, w - 8 - cs * LV.W);
      // actually we want to be able to pan to see all cells
      const loX = Math.min(8, w - 8 - cs * LV.W);
      const hiX = Math.max(8, w - 8 - cs * LV.W);
      ox = Math.max(loX, Math.min(hiX, ox));
      const loY = Math.min(sky + 4, streetY - 8 - cs * LV.H);
      const hiY = Math.max(sky + 4, streetY - 8 - cs * LV.H);
      oy = Math.max(loY, Math.min(hiY, oy));
    }
    geo = { w, h, cs, ox, oy, sky, street: slotBand, streetY, fit, zoom };
  }

  function cellAt(localX, localY) {
    if (!geo || !LV || !geo.cs) return null;
    const x = Math.floor((localX - geo.ox) / geo.cs);
    const y = Math.floor((localY - geo.oy) / geo.cs);
    if (x < 0 || y < 0 || x >= LV.W || y >= LV.H) return null;
    return { x, y };
  }

  function resetView() { viewZoom = 1; viewPanX = 0; viewPanY = 0; }

  function cellXY(x, y) {
    return { x: geo.ox + (x + 0.5) * geo.cs, y: geo.oy + (y + 0.5) * geo.cs };
  }
  function slotPt(i) {
    const el = $$("#slots .slot")[i];
    if (!el || !geo) return { x: geo.w * (i + 0.5) / slotCount, y: geo.h - 8 };
    const r = el.getBoundingClientRect();
    const b = board.getBoundingClientRect();
    return { x: r.left + r.width / 2 - b.left, y: r.top - b.top + 6 };
  }

  /* ---------- decor ---------- */
  function buildDecor(L) {
    const r = rnd(seedOf(L.id + ":" + L.name));
    const th = themeOf(L);
    // connected buildings
    const seen = Array.from({ length: L.H }, () => Array(L.W).fill(false));
    const blds = [];
    const inb = (x, y) => y >= 0 && y < L.H && x >= 0 && x < L.W && L.grid[y][x];
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        if (!inb(x, y) || seen[y][x]) continue;
        const cells = [];
        const q = [[x, y]];
        seen[y][x] = true;
        let x0 = x, y0 = y, x1 = x, y1 = y;
        while (q.length) {
          const [cx, cy] = q.pop();
          cells.push([cx, cy]);
          x0 = Math.min(x0, cx); y0 = Math.min(y0, cy);
          x1 = Math.max(x1, cx); y1 = Math.max(y1, cy);
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = cx + dx, ny = cy + dy;
            if (inb(nx, ny) && !seen[ny][nx]) { seen[ny][nx] = true; q.push([nx, ny]); }
          }
        }
        const wall = th.wall[(blds.length) % th.wall.length];
        let topX = x0, topY = y1;
        for (const [cx, cy] of cells) if (cy < topY || (cy === topY && Math.abs(cx - (x0 + x1) / 2) < Math.abs(topX - (x0 + x1) / 2))) { topX = cx; topY = cy; }
        const flatTop = cells.filter(([, cy]) => cy === y0).length >= (x1 - x0 + 1) * 0.7;
        blds.push({
          cells, x0, y0, x1, y1, topX, topY,
          wall, wall2: lerpC(wall, "#000000", 0.35),
          antenna: r() > 0.45,
          sign: flatTop && !L.landmark ? th.signs[blds.length % th.signs.length] : null,
        });
      }
    }
    function makeSky(count, hMin, hMax, dark, startX) {
      const arr = [];
      let x = startX;
      for (let i = 0; i < count && x < 1.12; i++) {
        const w = 0.045 + r() * 0.09;
        const h = hMin + r() * (hMax - hMin);
        const wins = [];
        const cols = 2 + ((r() * 4) | 0);
        const rows = 4 + ((r() * 8) | 0);
        for (let j = 0; j < cols * rows; j++) if (r() > 0.28) wins.push(j);
        arr.push({
          x, w, h, roof: (r() * 4) | 0,
          wall: lerpC(th.wall[0], dark, 0.25 + r() * 0.35),
          edge: lerpC(th.wall[1] || th.wall[0], "#8a90b0", 0.12),
          cols, rows, wins, lit: 0.45 + r() * 0.5,
          spire: r() > 0.65,
        });
        x += w + 0.004 + r() * 0.02;
      }
      return arr;
    }
    const skylineFar = makeSky(16, 0.58, 1.12, "#0a0a18", -0.02);
    const skylineMid = makeSky(12, 0.32, 0.72, "#12101c", -0.05);
    const lamps = [];
    for (let i = 0; i < 5; i++) lamps.push({ t: (i + 0.5) / 5 + (r() - 0.5) * 0.06 });
    return { blds, skylineFar, skylineMid, lamps, seed: r };
  }

  function projectCity(city, w, h) {
    const x = (city.lon + 130) / 290 * w;
    const y = (62 - city.lat) / 112 * h;
    return { x: Math.max(8, Math.min(w - 8, x)), y: Math.max(10, Math.min(h - 10, y)) };
  }
  function drawWorldMap(cv, opt) {
    if (!cv) return;
    const WW = window.NightWorld;
    if (!WW) return;
    const w = cv.width, h = cv.height;
    const c = cv.getContext("2d");
    c.clearRect(0, 0, w, h);
    const g = c.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, "#0a1020");
    g.addColorStop(1, "#101828");
    c.fillStyle = g;
    c.fillRect(0, 0, w, h);
    // faint water / land wash
    c.fillStyle = "rgba(50,90,120,0.18)";
    c.fillRect(0, 0, w, h);
    c.fillStyle = "rgba(40,70,60,0.2)";
    c.beginPath();
    c.ellipse(w * 0.22, h * 0.42, w * 0.18, h * 0.28, -0.3, 0, Math.PI * 2);
    c.ellipse(w * 0.52, h * 0.38, w * 0.28, h * 0.26, 0.2, 0, Math.PI * 2);
    c.ellipse(w * 0.82, h * 0.48, w * 0.16, h * 0.22, 0, 0, Math.PI * 2);
    c.ellipse(w * 0.78, h * 0.78, w * 0.12, h * 0.14, 0, 0, Math.PI * 2);
    c.fill();
    const cities = WW.CITIES;
    const pts = cities.map((city) => projectCity(city, w, h));
    c.strokeStyle = "rgba(255,213,106,0.35)";
    c.lineWidth = 1.4;
    c.setLineDash([4, 4]);
    c.beginPath();
    pts.forEach((p, i) => { if (i === 0) c.moveTo(p.x, p.y); else c.lineTo(p.x, p.y); });
    c.stroke();
    c.setLineDash([]);
    const page = (opt && opt.page) || 0;
    cities.forEach((city, i) => {
      const p = pts[i];
      const done = !!save.stars[i * PAGE + 19];
      const open = save.all || i * PAGE < save.unlocked || save.stars[i * PAGE] != null || i === 0;
      const cur = i === page;
      c.beginPath();
      c.fillStyle = done ? "#ffd56a" : cur ? "#7ee7ff" : open ? "#c8e4ff" : "#3a3a55";
      c.arc(p.x, p.y, cur ? 5 : 3.2, 0, Math.PI * 2);
      c.fill();
      if (cur) {
        c.strokeStyle = "#ffd56a";
        c.lineWidth = 1.2;
        c.beginPath(); c.arc(p.x, p.y, 8, 0, Math.PI * 2); c.stroke();
        c.fillStyle = "#f3efe4";
        c.font = "bold 11px sans-serif";
        c.textAlign = "center";
        c.fillText(city.name, p.x, Math.max(14, p.y - 12));
      }
    });
    c.fillStyle = "rgba(243,239,228,0.7)";
    c.font = "10px sans-serif";
    c.textAlign = "left";
    c.fillText("环球电工的夜班航线", 10, h - 8);
  }

  function pageCount() {
    if (save.all) return Math.ceil(MAX_MENU / PAGE);
    const vis = Math.max(PAGE, Math.min(MAX_MENU, (save.unlocked || 1) + PAGE - 1));
    return Math.max(1, Math.ceil(vis / PAGE));
  }
  function renderMenu() {
    const cleared = Object.keys(save.stars).length;
    const prog = $("#progress");
    const pages = pageCount();
    if (menuPage >= pages) menuPage = pages - 1;
    if (menuPage < 0) menuPage = 0;
    const chap = menuPage + 1;
    const chapName = G && G.chapterName ? G.chapterName(menuPage * PAGE + 1) : ("第 " + chap + " 章");
    if (prog) {
      const citiesDone = (window.NightWorld && window.NightWorld.CITIES)
        ? window.NightWorld.CITIES.filter((_, ci) => save.stars[ci * PAGE + 19]).length
        : 0;
      const walked = Math.max(citiesDone, menuPage + (cleared ? 1 : 0) > 0 ? Math.min(menuPage + 1, citiesDone + 1) : 0);
      const streak = save.streak > 1 ? ` · 连续上班 ${save.streak} 天` : "";
      prog.textContent = save.all
        ? `已走过 ${Math.max(citiesDone, 1)} 座城 · 关了 ${cleared} 处夜景 · 测试解锁`
        : `已走过 ${Math.max(citiesDone, cleared ? 1 : 0)} 座城 · 关了 ${cleared} 处夜景${streak}`;
    }
    if ($("#pageLab")) $("#pageLab").textContent = `第 ${chap} 章 · ${chapName}`;
    const city = window.NightWorld && window.NightWorld.cityOf(menuPage * PAGE + 1);
    if ($("#chapterLine")) $("#chapterLine").textContent = city ? city.open : "";
    drawWorldMap($("#worldMap"), { page: menuPage, city });
    if ($("#pagePrev")) $("#pagePrev").disabled = menuPage <= 0;
    if ($("#pageNext")) $("#pageNext").disabled = menuPage >= pages - 1;
    const box = $("#levels");
    box.innerHTML = "";
    const start = menuPage * PAGE;
    for (let i = start; i < start + PAGE; i++) {
      if (i >= MAX_MENU) break;
      let L;
      try { L = levelAt(i); } catch (e) { continue; }
      if (!L) continue;
      const open = isOpenLevel(i);
      const b = document.createElement("button");
      const starsN = save.stars[i] || 0;
      b.className = "card" + (starsN ? " done" : "") + (open && !starsN && i === (save.unlocked - 1) ? " start" : "") + (open ? "" : " locked") + (L.landmark ? " landmark" : "");
      b.type = "button";
      const cv = document.createElement("canvas");
      cv.width = 280;
      cv.height = 150;
      drawThumb(cv, L, open);
      const meta = document.createElement("div");
      meta.className = "meta";
      meta.innerHTML = `<span class="no ${tierCls(L.tier)}">第 ${i + 1} 关 · ${L.tier || ""}</span><strong>${L.name}</strong>`;
      if (L.landmark) meta.innerHTML += `<span class="badge">地标</span>`;
      if (!open) meta.innerHTML += `<span class="lock">锁</span>`;
      else if (starsN) meta.innerHTML += `<span class="star">${"★".repeat(starsN)}${"☆".repeat(3 - starsN)}</span>`;
      b.append(cv, meta);
      b.onclick = () => { if (open) openLevel(i); };
      box.appendChild(b);
    }
  }

  function drawThumb(cv, L, open) {
    const c = cv.getContext("2d");
    const W = cv.width, H = cv.height;
    const th = themeOf(L);
    const g = c.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, th.sky0);
    g.addColorStop(1, th.sky2);
    c.fillStyle = g;
    c.fillRect(0, 0, W, H);
    c.fillStyle = "rgba(255,255,255,.5)";
    for (let i = 0; i < 16; i++) c.fillRect((i * 47) % W, (i * 29) % (H * 0.4), 1.4, 1.4);
    const type = L.landmarkType || (th && th.landmark);
    if (type && window.NightLandmarks) {
      c.save();
      window.NightLandmarks.draw(c, type, W * 0.72, H - 8, Math.min(W, H) * 0.72, { wall: (th.wall && th.wall[0]) || "#0a0c14", accent: th.accent, lit: open ? 0.85 : 0.2 });
      c.restore();
    }

    const cs = Math.min((W - 16) / L.W, (H - 22) / L.H);
    const ox = (W - cs * L.W) / 2, oy = 12 + (H - 22 - cs * L.H);
    for (let y = 0; y < L.H; y++) {
      for (let x = 0; x < L.W; x++) {
        const cell = L.grid[y][x];
        if (!cell) continue;
        const px = ox + x * cs, py = oy + y * cs;
        c.fillStyle = th.wall[0];
        c.fillRect(px, py, cs + 0.5, cs + 0.5);
        if (cell.on || cell.dormant) {
          c.fillStyle = cell.dormant ? "rgba(40,40,60,.8)" : C.COLORS[cell.c].fill;
          c.globalAlpha = open ? 1 : 0.45;
          c.fillRect(px + 0.8, py + 0.8, Math.max(1, cs - 1.6), Math.max(1, cs - 1.6));
          c.globalAlpha = 1;
        }
      }
    }
  }

  function restore(s) {
    grid = C.cloneGrid(s.grid);
    cols = C.cloneCols(s.cols);

    for (const sl of slots) if (sl) { sl._busy = false; sl._wait = false; }

    slotCount = s.slotCount;
